---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - start: 192.168.1.202
      stop: 192.168.1.254
    # BGP-only range (#2064). Deliberately outside every VLAN subnet (the
    # obvious 10.1.1.0/24 is inside the Servers VLAN's 10.1.0.0/16 and would be
    # on-link again). Clients reach these IPs through the router, where
    # externalTrafficPolicy=Local is honoured. Services hold both IPs during the
    # migration via lbipam.cilium.io/ips. Mirrors the old .202-.254 range so the
    # last octet carries over, and leaves .5/.6/.53 to the dedicated pools below
    # (overlapping pools are marked Conflicting and disabled by LBIPAM).
    - start: 10.11.0.200
      stop: 10.11.0.254
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: nginx-ingress-internal
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 192.168.1.200/32
  serviceSelector:
    matchExpressions:
      - { key: 'io.kubernetes.service.name', operator: In, values: [ ingress-nginx-controller ] }
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: nginx-ingress-external
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 192.168.1.201/32
  serviceSelector:
    matchExpressions:
      - { key: 'io.kubernetes.service.name', operator: In, values: [ external-ingress-nginx-controller ] }
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: k8s-gateway
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 10.11.0.53/32
  serviceSelector:
    matchExpressions:
      - { key: 'io.kubernetes.service.name', operator: In, values: [ k8s-gateway ] }
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: adguard-primary
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 192.168.1.5/32
    - cidr: 10.11.0.5/32

  serviceSelector:
    matchExpressions:
      - key: 'io.kubernetes.service.name'
        operator: In
        values:
          - adguard-primary-main
          - adguard-primary-udp
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: adguard-secondary
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 192.168.1.6/32
    - cidr: 10.11.0.6/32

  serviceSelector:
    matchExpressions:
      - key: 'io.kubernetes.service.name'
        operator: In
        values:
          - adguard-secondary-main
          - adguard-secondary-udp
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumbgpadvertisement_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisement-config
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: [ "never-used-value" ] }
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumbgppeerconfig_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: bgp-peer-config-v4
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumbgpclusterconfig_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: cilium
      localASN: 64514
      peers:
        - name: mikrotik-router
          peerASN: 64514
          peerAddress: 192.168.1.1
          peerConfigRef:
            name: bgp-peer-config-v4
