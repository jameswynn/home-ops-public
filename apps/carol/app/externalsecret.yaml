---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: carol
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        CAROL_ENCRYPTION_KEY: |-
          {{ .CAROL_ENCRYPTION_KEY }}
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: carol
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: carol-oauth-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: authentik-oauth
  target:
    template:
      data:
        client_id: "{{ .client_id }}"
        client_secret: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: Carol
