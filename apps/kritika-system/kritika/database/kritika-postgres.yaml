---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  # Single instance, like memini: longhorn replicates the volume, and a homelab
  # reviewer tolerates a short outage. kritika needs a direct (or session-mode)
  # connection, never a transaction-mode pooler, so no Pooler here.
  instances: 1
  # kritika needs Postgres 18 with VectorChord (vchord) and pgvector (vector).
  # The <pg-major>-<vchord> tag form reuses .renovate/postgres.json5's
  # VectorChord rule and the imageName custom manager unchanged; the image ships
  # both extensions, so no CNPG image-volume extension block is needed.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.1
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: kritika
      owner: kritika
      secret:
        name: kritika-db-owner
  # No CPU limit; memory request == limit (repo convention). Cold-start sizing:
  # resize from observed p95 after a week of reviews.
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
      ephemeral-storage: 200Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 200Mi
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      # A dead leader otherwise holds kritika's session advisory lock for ~2h
      # (onedr0p/home-ops#11794); keepalives drop the session within ~2 min.
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kritika-postgres
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
      # Keep the database's writes off muspelheim's etcd disk (CLAUDE.md).
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - muspelheim
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/postgresql.cnpg.io/database_v1.json
# Extensions are created by CNPG as superuser; kritika requires both before its
# first start.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika
spec:
  cluster:
    name: kritika-postgres
  name: kritika
  owner: kritika
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-app
spec:
  cluster:
    name: kritika-postgres
  name: kritika_app
  login: true
  superuser: false
  bypassrls: false
  passwordSecret:
    name: kritika-db-app
  databaseRoleReclaimPolicy: retain
---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: kritika-postgres
spec:
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
  configuration:
    # serverName defaults to the cluster name: s3://postgresql/kritika-postgres/
    destinationPath: s3://postgresql/
    endpointURL: https://${SECRET_GARAGE_URL}
    s3Credentials:
      region:
        name: postgresql-garage
        key: GARAGE_REGION
      accessKeyId:
        name: postgresql-garage
        key: GARAGE_ACCESS_KEY
      secretAccessKey:
        name: postgresql-garage
        key: GARAGE_SECRET_KEY
    wal:
      compression: zstd
    data:
      compression: gzip
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kritika-postgres
spec:
  schedule: "0 45 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: kritika-postgres
  # Archives via the barman-cloud plugin (no spec.backup), see memini.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/monitoring.coreos.com/podmonitor_v1.json
# Explicit PodMonitor: CNPG deprecated spec.monitoring.enablePodMonitor.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kritika-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: kritika-postgres
  podMetricsEndpoints:
    - port: metrics
