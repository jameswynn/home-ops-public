      "panels": [
        {
          "type": "stat",
          "title": "Total detections",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "sum"
              ]
            },
            "colorMode": "background"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=\"networking\", pod=~\"envoy-towonel-.*\"} |= \"Coraza:\" [$__interval]))",
              "refId": "A",
              "queryType": "range",
              "editorMode": "code",
              "legendFormat": "",
              "format": "time_series"
            }
          ],
          "id": 1
        },
