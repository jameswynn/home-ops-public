---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: home-assistant-request-buffer
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant-app
      # namespace: dev
  requestBuffer:
    limit: 100Mi
  # timeout:
  #   http:
  #     requestTimeout: "0s"
