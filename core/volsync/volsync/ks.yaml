---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app volsync
  namespace: &namespace volsync
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./core/volsync/volsync/app
  dependsOn:
    - name: snapshot-controller
      namespace: kube-system
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
