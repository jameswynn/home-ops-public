---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-backup
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      minio-backup-longhorn:
        type: cronjob

        cronjob:
          # 6 AM local (11:00 UTC) — no spec.timeZone, so the schedule is read in
          # the controller-manager's local time (America/Chicago).
          #
          # This slot has to stay after the 0 1 longhorn backup RecurringJob, so
          # the mirror picks up the same night's replica backups. It must also
          # stay >=1h clear of longhorn's filesystem-trim (moved to 0 8): the two
          # used to share this slot, and the combined I/O stalled etcd commits up
          # to 4s on muspelheim, dropping the k3s leader-election lease.
          schedule: '0 6 * * *'
          successfulJobsHistory: 3
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true

        containers:
          app:
            image:
              repository: ghcr.io/rclone/rclone
              tag: 1.75.2
            command:
              - /bin/sh
              - /minio/backup.sh
              - longhorn
              - wynn-longhorn
            env:
              RCLONE_CONFIG_SOURCE_TYPE: s3
              RCLONE_CONFIG_SOURCE_PROVIDER: Minio
              RCLONE_CONFIG_SOURCE_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: MINIO_URL
              RCLONE_CONFIG_SOURCE_ENV_AUTH: "false"
              RCLONE_CONFIG_SOURCE_FORCE_PATH_STYLE: "true"
              RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: MINIO_LONGHORN_ACCESS_KEY
              RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: MINIO_LONGHORN_SECRET_KEY
              RCLONE_CONFIG_DESTINATION_TYPE: s3
              RCLONE_CONFIG_DESTINATION_PROVIDER: Other
              RCLONE_CONFIG_DESTINATION_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: BACKBLAZE_URL
              RCLONE_CONFIG_DESTINATION_ENV_AUTH: "false"
              RCLONE_CONFIG_DESTINATION_FORCE_PATH_STYLE: "true"
              RCLONE_CONFIG_DESTINATION_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: BACKBLAZE_LONGHORN_ACCESS_KEY
              RCLONE_CONFIG_DESTINATION_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: BACKBLAZE_LONGHORN_SECRET_KEY
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            # CPU from the last 7d of runs (3 runs, ~22m each): p50 50.7m,
            # p95 174.4m, max 177.7m. Flat profile — the mirror to B2 is
            # network-bound, so it sits at ~175m for the whole run rather than
            # spiking, and 250m clears the observed max without reserving a
            # quarter-core more than the job can use. No CPU limit, per the
            # cluster convention: a nightly backup should finish as fast as
            # the node allows.
            resources:
              requests:
                memory: 200Mi
                cpu: 250m
                ephemeral-storage: 100Mi
              limits:
                memory: 2000Mi
                ephemeral-storage: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

      minio-backup-postgres:
        type: cronjob

        cronjob:
          # 7 AM local (12:00 UTC). ~3m of work on a small dataset, so it sits
          # happily between the longhorn mirror at 0 6 and the trim at 0 8.
          schedule: '0 7 * * *'
          successfulJobsHistory: 3
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true

        containers:
          app:
            image:
              repository: ghcr.io/rclone/rclone
              tag: 1.75.2
            command:
              - /bin/sh
              - /minio/backup.sh
              - postgresql
              - wynn-postgres
            env:
              RCLONE_CONFIG_SOURCE_TYPE: s3
              RCLONE_CONFIG_SOURCE_PROVIDER: Minio
              RCLONE_CONFIG_SOURCE_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: MINIO_URL
              RCLONE_CONFIG_SOURCE_ENV_AUTH: "false"
              RCLONE_CONFIG_SOURCE_FORCE_PATH_STYLE: "true"
              RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: MINIO_POSTGRES_ACCESS_KEY
              RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: MINIO_POSTGRES_SECRET_KEY
              RCLONE_CONFIG_DESTINATION_TYPE: s3
              RCLONE_CONFIG_DESTINATION_PROVIDER: Other
              RCLONE_CONFIG_DESTINATION_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: BACKBLAZE_URL
              RCLONE_CONFIG_DESTINATION_ENV_AUTH: "false"
              RCLONE_CONFIG_DESTINATION_FORCE_PATH_STYLE: "true"
              RCLONE_CONFIG_DESTINATION_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: BACKBLAZE_POSTGRES_ACCESS_KEY
              RCLONE_CONFIG_DESTINATION_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: minio-backup
                    key: BACKBLAZE_POSTGRES_SECRET_KEY
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            # CPU from the last 7d of runs (3 runs, ~3m each): p50 4.9m,
            # p95 7.8m, max 7.8m. Far smaller dataset than the longhorn
            # backup, so it barely registers. 25m is the practical request
            # floor. No CPU limit, per the cluster convention.
            resources:
              requests:
                memory: 200Mi
                cpu: 25m
                ephemeral-storage: 100Mi
              limits:
                memory: 2000Mi
                ephemeral-storage: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      tmp:
        enabled: true
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
      script:
        enabled: true
        name: minio-backup
        type: configMap
        globalMounts:
          - path: /minio/backup.sh
            subPath: backup.sh
            readOnly: true
