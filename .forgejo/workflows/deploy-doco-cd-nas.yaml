---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Keeps the NAS doco-cd controller at the version in git. doco-cd reconciles the
# docker/nas stacks itself but never redeploys itself; this runs
# docker/update-doco-cd.sh on the NAS over SSH. Twin of deploy-doco-cd-vps.yaml.
name: Deploy doco-cd (NAS)

on:
  push:
    branches: [main]
    paths:
      - docker/nas/.doco-cd/**
      - docker/update-doco-cd.sh
      - .forgejo/workflows/deploy-doco-cd-nas.yaml
  workflow_dispatch: {}

concurrency:
  group: deploy-doco-cd-nas
  cancel-in-progress: false

jobs:
  deploy:
    # The in-cluster runner (dev/forgejo-runner): it is on the LAN with the NAS. The VPS
    # runner also carries `ubuntu-latest` but cannot reach 192.168.1.3, hence `local`.
    runs-on: local
    timeout-minutes: 15
    steps:
      # Plain OpenSSH with a pinned ed25519 host key (see deploy-doco-cd-vps.yaml for
      # why not appleboy/ssh-action).
      - name: Update controller
        env:
          SSH_KEY: ${{ secrets.NAS_DEPLOY_SSH_KEY }}
          # The NAS's /etc/ssh/ssh_host_ed25519_key.pub
          # (SHA256:Jm4YrglZSxsmJOlxy8h5hLx5fhyI6oHpytGzGvzrlEU)
          KNOWN_HOST: >-
            192.168.1.3 ssh-ed25519
            AAAAC3NzaC1lZDI1NTE5AAAAIHkggg5CdINlq6FdQiI4JxJxjrUqcTSZE+YwgbewchKR
        run: |
          if ! command -v ssh >/dev/null; then
            $(command -v sudo) apt-get update -qq
            $(command -v sudo) apt-get install -y -qq openssh-client >/dev/null
          fi
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$d/key")
          printf '%s\n' "$KNOWN_HOST" > "$d/known_hosts"
          # The key is restricted server-side to a forced command
          # (update-doco-cd.sh nas), so no remote command is sent.
          ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$d/known_hosts" -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            wynnj@192.168.1.3

      # Bounded so a notification can never hang or fail the deploy; see
      # deploy-doco-cd-vps.yaml for why curl and not ntfy-action + timeout-minutes.
      - name: Notify
        if: always()
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATUS: ${{ job.status }}
          LOG_URL: https://forge.wynning.tech/${{ forgejo.repository }}/actions/${{ forgejo.run_id }}
        run: |
          if [ "$STATUS" = success ]; then
            title="NAS doco-cd deploy succeeded" tags=partying_face
          else
            title="NAS doco-cd deploy failed" tags=warning
          fi
          curl -fsS -m 20 -o /dev/null \
            -H "Title: $title" -H "Tags: $tags" -H "Priority: low" \
            -H "Actions: view, Build Log, $LOG_URL, clear=true" \
            -d "$STATUS" "https://ntfy.wynning.tech/$TOPIC" \
            || echo "::warning::ntfy unreachable; notification skipped"
