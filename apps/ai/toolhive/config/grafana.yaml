---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/toolhive.stacklok.dev/mcpserver_v1beta1.json
# Tanguille: grafana-service.observability.svc.cluster.local:3000 — Grafana lives
# in the `monitoring` namespace here. Service name `grafana-service` confirmed via
# apps/home-operations patterns at port 3000.
# GRAFANA_API_KEY: Tanguille's config omits this (possibly anonymous access enabled
# on their internal Grafana). This cluster's Grafana requires auth; the key is pulled
# from toolhive-secrets. If Grafana SA token auth isn't configured yet, create a
# Grafana service account with Viewer role and store the token as GRAFANA_API_KEY
# in the toolhive-mcp Bitwarden item.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: grafana/mcp-grafana:1.3.0@sha256:5114852743e450fe5186b6c1712419843eb4bd295e47e64c452c3aa0fab3c42e
  transport: stdio
  groupRef:
    name: all
  args:
    - "-t"
    - "stdio"
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.monitoring.svc.cluster.local:3000
  secrets:
    - name: toolhive-secrets
      key: GRAFANA_API_KEY
      targetEnvName: GRAFANA_API_KEY
  toolConfigRef:
    name: grafana
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 110Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 100Mi
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: grafana
spec:
  # Grafana OSS + Prometheus/Alertmanager only; Cloud, Pyroscope, Loki and
  # Sift-backed tools have no datasource in this cluster.
  toolsFilter:
    - list_datasources
    - get_datasource_by_uid
    - get_datasource_by_name
    - query_prometheus
    - query_prometheus_histogram
    - list_prometheus_metric_names
    - list_prometheus_metric_metadata
    - list_prometheus_label_names
    - list_prometheus_label_values
    - list_alert_rules
    - get_alert_rule_by_uid
    - create_alert_rule
    - update_alert_rule
    - delete_alert_rule
    - list_alert_groups
    - get_alert_group
    - list_contact_points
    - search_dashboards
    - get_dashboard_by_uid
    - get_dashboard_summary
    - get_dashboard_property
    - get_dashboard_panel_queries
    - update_dashboard
    - search_folders
    - create_folder
    - get_panel_image
    - generate_deeplink
    - get_annotations
    - get_annotation_tags
    - create_annotation
    - update_annotation
    - patch_annotation
    - create_graphite_annotation
