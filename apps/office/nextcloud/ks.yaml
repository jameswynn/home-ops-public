---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nextcloud
  namespace: &namespace office
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./apps/office/nextcloud/app
  components:
    - ../../../../components/dragonfly
    - ../../../../components/nfs-scaler
    - ../../../../components/anubis
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: *namespace
      ANUBIS_TARGET: http://nextcloud2:8080
      NFS_SCALAR_TARGET: nextcloud2
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
