---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
# kopiur mover Jobs run in the app's namespace and envFrom this Secret by the
# name the `nas` ClusterRepository references. Namespace-level (not per-app in
# components/kopiur) so namespaces with several kopiur apps share one copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager-sdk
  target:
    name: kopiur-repository-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: volsync
