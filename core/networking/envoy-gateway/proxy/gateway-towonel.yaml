---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
# The public gateway: all inbound internet traffic arrives here, tunnelled in from
# the towonel hub on the VPS. It is ClusterIP-only (no LB IP, not LAN-exposed) — the
# in-cluster towonel-agent is the only client, reaching it at
# envoy-towonel.networking.svc:443. Its ClientTrafficPolicy enables PROXY protocol so
# the agent can preserve the real client IP.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-towonel
  namespace: networking
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        # Two replicas: this is the only path in from the public internet, so a
        # single-pod restart (image bump, node reboot via kured) was a hard
        # outage. Paired with the PodDisruptionBudget at the bottom of this file.
        replicas: 2
        pod:
          # A second replica only buys anything if it lands on a different node.
          # Four candidate nodes (niflheim is arm64 + `arm` NoSchedule-tainted and
          # never gets these pods), and the deployment's default rolling update
          # rounds to maxSurge 1 / maxUnavailable 0 at 2 replicas — so the
          # 3-pods-over-3-hosts peak during a rollout is satisfiable. Worst case
          # (2+ nodes gone) is a stalled rollout, not an outage: the running pods
          # are never torn down first.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              # Envoy Gateway passes this through verbatim and does NOT fill in a
              # selector — an omitted one matches nothing and silently no-ops.
              # These are the labels EG v1.8 actually stamps on the generated
              # envoy-towonel pods (verified against the live Deployment).
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  app.kubernetes.io/component: proxy
                  gateway.envoyproxy.io/owning-gateway-name: envoy-towonel
                  gateway.envoyproxy.io/owning-gateway-namespace: networking
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 1Gi
              ephemeral-storage: 200Mi
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd
    # Must stay byte-identical to the `envoy` EnvoyProxy's format in
    # envoy-proxy.yaml — CrowdSec's Envoy parser on the VPS keys on these exact
    # field names, and a divergent schema here would silently stop detection on
    # the gateway that faces the public internet. `path` and `client_ip` are the
    # additions over Envoy Gateway's built-in format.
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              requested_server_name: "%REQUESTED_SERVER_NAME%"
              route_name: "%ROUTE_NAME%"
              user-agent: "%REQ(USER-AGENT)%"
              ":authority": "%REQ(:AUTHORITY)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-towonel
  labels:
    network: towonel
  annotations:
    # cloudflare-dns-towonel publishes every route on this gateway as a grey CNAME -> here.
    external-dns.alpha.kubernetes.io/target: "towonel.${SECRET_ROOT_DOMAIN}"
    gatus.home-operations.com/endpoint: |
      client:
        dns-resolver: tcp://1.1.1.1:53
      group: towonel
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-towonel
  listeners:
    # The towonel agent forwards plain-HTTP streams to origin **:80**, ignoring the
    # `origin: ...:443` in its service config. Without this listener those connections
    # fail outright ("failed to connect to origin envoy-towonel...:80" in the agent log)
    # instead of redirecting, and the shared `https-redirect` HTTPRoute — which already
    # lists this gateway with `sectionName: http` — sits at Accepted=False/NoMatchingParent.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: default-cert

    - name: jameswynn-https
      protocol: HTTPS
      port: 443
      hostname: "jameswynn.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: jameswynn-cert

    - name: sub-jameswynn-https
      protocol: HTTPS
      port: 443
      hostname: "*.jameswynn.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: jameswynn-cert

    - name: sneaker-https
      protocol: HTTPS
      port: 443
      hostname: "sneaker.social"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: sneaker-cert

    - name: sub-sneaker-https
      protocol: HTTPS
      port: 443
      hostname: "*.sneaker.social"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: sneaker-cert

---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-towonel
spec:
  # targetRef (by name) takes precedence over the cluster-wide `envoy` policy's
  # targetSelectors for this gateway, so we restate the base settings + proxy protocol.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-towonel
  # Replaces the deprecated `enableProxyProtocol: true`. Leaving `optional` unset
  # keeps the old behaviour exactly: connections without a PROXY protocol header
  # are rejected. That stays correct here — the in-cluster towonel agent is the
  # only client (this gateway is ClusterIP-only) and it always sends v2.
  proxyProtocol: {}
  headers:
    earlyRequestHeaders:
      set:
        - name: X-Real-Ip
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  path:
    disableMergeSlashes: true
    escapedSlashesAction: KeepUnchanged
  http2:
    onInvalidMessage: TerminateStream
  # No http3 here (unlike the base `envoy` policy): HTTP/3 adds a UDP QUIC listener,
  # and Envoy's proxy_protocol listener filter is TCP-only. With proxyProtocol
  # above, Envoy NACKs the whole xDS update ("Didn't find a registered implementation
  # for 'envoy.filters.listener.proxy_protocol'" on .../https-quic), which leaves this
  # gateway serving stale config. The towonel agent speaks TCP, so QUIC is unusable here.
  tcpKeepalive: {}
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/poddisruptionbudget-policy-v1.json
# Keeps kured / a node drain from taking both public-ingress pods at once. The
# Deployment is generated by Envoy Gateway (owned by the Gateway, not by Flux),
# so this selector restates the labels EG stamps on those pods rather than
# reusing a selector we control — keep it in sync if EG changes its label set.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envoy-towonel
  namespace: networking
spec:
  minAvailable: 1
  # A pod that is already Running-but-unready must not block a drain: with the
  # default IfHealthyBudget, one unready replica out of two wedges eviction
  # entirely. AlwaysAllow lets the broken pod go and keeps the healthy one.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      gateway.envoyproxy.io/owning-gateway-name: envoy-towonel
      gateway.envoyproxy.io/owning-gateway-namespace: networking
