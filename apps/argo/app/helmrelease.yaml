---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: argo-workflows
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.1.1
  url: oci://ocharted.wynning.tech/argoproj.github.io/argo-helm/argo-workflows
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app argo-workflows
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: argo-workflows
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    workflow:
      serviceAccount:
        create: true
    crds:
      keep: false
      full: true
    controller:
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # CPU from 7d of Prometheus data: p50 1.9m, p95 2.1m, max 2.2m. The
      # limit here was raised 50m -> 500m to stop reconcile bursts throttling;
      # it is now removed entirely, which is a superset of that fix — even at
      # 500m the controller still lost 0.7% of CFS periods. 25m is the
      # practical request floor. No CPU limit, per the cluster convention.
      resources:
        requests:
          cpu: 25m
          memory: 70M
        limits:
          memory: 200M
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    executor:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    server:
      # TODO: --auth-mode=server exposes the UI with no per-user auth (uses the
      # server's ServiceAccount). Fine behind envoy-internal (LAN-only); switch to
      # sso/client and wire forward-auth if you ever expose it externally.
      extraArgs:
        - --auth-mode=server
      # CPU from 7d of Prometheus data: p50 0.2m, p95 0.4m, max 1m. The limit
      # was raised 50m -> 500m to fix 14.1% CFS throttling, but that only got
      # it down to 11.5% — the server's sub-100ms bursts are wide, not long,
      # so no quota that fits a 0.4m p95 will stop clipping them. Removing the
      # limit is the actual fix. 25m is the practical request floor.
      resources:
        requests:
          cpu: 25m
          memory: 50M
        limits:
          memory: 200M
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
