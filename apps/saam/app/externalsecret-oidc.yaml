---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saam-oidc
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        SAAM_AUTHENTIK_CLIENT_SECRET: |-
          {{ .SAAM_AUTHENTIK_CLIENT_SECRET }}
        SAAM_GOOGLE_CLIENT_SECRET: |-
          {{ .SAAM_GOOGLE_CLIENT_SECRET }}
        auth.toml: |-
          [[providers]]
          type = "authentik"
          issuer = "https://auth.wynning.tech/application/o/saam/"
          client_id = "saam"
          client_secret_env = "SAAM_AUTHENTIK_CLIENT_SECRET"

          [[providers]]
          type = "google"
          client_id = "49540323277-uv3rqjnrsspml2uuaut0rlllrauitgch.apps.googleusercontent.com"
          client_secret_env = "SAAM_GOOGLE_CLIENT_SECRET"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: saam
