---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 2.20.15
            env:
              # Configurate app
              PAPERLESS_URL: https://paperless.${SECRET_INTERNAL_DOMAIN}
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: "${CLUSTER_TZ}"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # Authentik Headers for SSO
              PAPERLESS_ENABLE_HTTP_REMOTE_USER: "TRUE"
              PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: "HTTP_X_AUTHENTIK_USERNAME"
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
              PAPERLESS_DATA_DIR: /usr/src/paperless/data
              PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
              # # Configure folder importer
              # PAPERLESS_CONSUMER_POLLING: "60"
              # PAPERLESS_CONSUMER_RECURSIVE: "true"
              # PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Configure OCR
              PAPERLESS_OCR_LANGUAGES: eng
              PAPERLESS_OCR_LANGUAGE: eng
              # Configure redis integration
              PAPERLESS_REDIS: redis://paperless-dragonfly:6379
              # Configure user permissions
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
            envFrom:
              - secretRef:
                  name: paperless-secrets
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                memory: 300Mi
                cpu: 10m
                ephemeral-storage: 100Mi
              limits:
                memory: 2000Mi
                cpu: 1000m
                ephemeral-storage: 500Mi

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 100

    service:
      app:
        primary: true
        controller: paperless
        ports:
          http:
            port: 8000

    persistence:
      data:
        existingClaim: paperless-data
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/data
      media:
        existingClaim: paperless-media
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/media
      # consume:
      #   type: nfs
      #   server: ${SECRET_NAS_URL}
      #   path: /volume1/paperless_consume
      #   advancedMounts:
      #     paperless:
      #       app:
      #         - path: /usr/src/paperless/data/consume

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Paperless"
          gethomepage.dev/description: "OCR for paperless documents"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "paperless.png"
          gethomepage.dev/weight: "60"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
