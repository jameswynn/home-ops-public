---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/toolhive.stacklok.dev/mcpserver_v1beta1.json
# Tanguille: grafana-service.observability.svc.cluster.local:3000 — Grafana lives
# in the `monitoring` namespace here. Service name `grafana-service` confirmed via
# apps/home-operations patterns at port 3000.
# The Bitwarden item exposes the Grafana service-account token under the
# current MCP image's supported variable name.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: grafana/mcp-grafana:2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
  transport: stdio
  args:
    - "-t"
    - "stdio"
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.monitoring.svc.cluster.local:3000
    # mcp-grafana >=2.0 reports anonymous usage stats to stats.grafana.org by
    # default; "disabled" builds no events and opens no connection.
    - name: GRAFANA_USAGE_STATS
      value: disabled
  secrets:
    - name: toolhive-secrets
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  toolConfigRef:
    name: grafana
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 110Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 100Mi
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: grafana
spec:
  # Grafana OSS + Prometheus/Alertmanager only; Cloud, Pyroscope, Loki and
  # Sift-backed tools have no datasource in this cluster.
  toolsFilter:
    - list_datasources
    - get_datasource
    - query_prometheus
    - query_prometheus_histogram
    - list_prometheus_metric_names
    - list_prometheus_metric_metadata
    - list_prometheus_label_names
    - list_prometheus_label_values
    - alerting_rules_read
    - alerting_rules_write
    - list_alert_groups
    - get_alert_group
    - alerting_manage_routing
    - search_dashboards
    - get_dashboard_by_uid
    - get_dashboard_summary
    - get_dashboard_property
    - get_dashboard_panel_queries
    - update_dashboard
    - search_folders
    - create_folder
    - get_panel_image
    - generate_deeplink
    - get_annotations
    - get_annotation_tags
    - create_annotation
    - update_annotation
