---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gotosocial
  namespace: comms
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    service:
      main:
        controller: main
        ports:
          http:
            port: &port 8080

    controllers:
      main:
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: *app
          # Keep off muspelheim (#2302): its etcd WAL shares an LVM VG with the
          # Longhorn replica store on a DRAM-less BX500, and a 10 GB SQLite DB
          # under federation load is exactly the disk-heavy writer that node
          # must not host. gotosocial-data is Longhorn, so the volume re-attaches
          # wherever the pod lands and a hard rule is safe (same as ollama).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - muspelheim
          securityContext:
            fsGroup: 1000
            runAsUser: 1000
            runAsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          main:
            nameOverride: *app
            image:
              repository: mirror.gcr.io/superseriousbusiness/gotosocial
              tag: 0.22.3
            env:
              - name: GTS_HOST
                value: &host "social.${SECRET_ROOT_DOMAIN}"
              - name: TZ
                value: ${CLUSTER_TZ}
              # Postgres since #2302 (SQLite stalled under federation load: a
              # 10.5 GB single-writer file on Longhorn). gotosocial-db is the
              # same basic-auth Secret the DatabaseRole reads, so the app and
              # the role can never disagree on the password.
              - name: GTS_DB_TYPE
                value: postgres
              - name: GTS_DB_ADDRESS
                value: gotosocial-postgres-rw.comms.svc.cluster.local
              - name: GTS_DB_PORT
                value: "5432"
              - name: GTS_DB_DATABASE
                value: gotosocial
              # In-cluster; CNPG serves TLS but GtS "require" would also want
              # the CNPG CA mounted. Revisit with the netpol work.
              - name: GTS_DB_TLS_MODE
                value: disable
              - name: GTS_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: gotosocial-db
                    key: username
              - name: GTS_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: gotosocial-db
                    key: password
              - name: GTS_ACCOUNTS_REGISTRATION_OPEN
                value: "false"
              - name: GTS_TRUSTED_PROXIES
                value: "10.42.0.0/16,10.43.0.0/16,127.0.0.1/32,192.168.1.3/32,::1"
              - name: GTS_ADVANCED_RATE_LIMIT_EXCEPTIONS
                value: "10.0.0.0/8,192.168.1.0/24"
              # Default is 300 per 5min per IP, which is ample at steady state
              # (~200-400 inbox deliveries/hour total) but far too low for
              # catch-up after any downtime: peers redeliver their whole queue
              # at once, exceed the limit immediately, get 429s, and retry —
              # so the backlog cannot drain through a steady-state limit.
              - name: GTS_ADVANCED_RATE_LIMIT_REQUESTS
                value: "2000"
              # GOMAXPROCS is pinned so pool size and the CPU-scaled workers are
              # node-independent. With no CPU limit (removed in #1374) it would
              # follow the node's core count. Pool size is
              # db-max-open-conns-multiplier (8, config.yaml) x GOMAXPROCS = 16
              # connections, well inside gotosocial-postgres max_connections 50.
              # (The old pin of the multiplier to 2 only existed to bound the
              # per-connection SQLite page cache; that cache is gone.)
              #
              # Two other settings scale off GOMAXPROCS, and both scale *down*
              # safely at 2: advanced-throttling-multiplier 8 gives 16 open
              # requests (128 backlog), far above the ~200-400 inbox
              # deliveries/hour steady state, and advanced-sender-multiplier 2
              # gives 4 delivery goroutines. media-ffmpeg-pool-size is a fixed
              # 1, not CPU-scaled. All three live in config.yaml.
              - name: GOMAXPROCS
                value: "2"
              - name: GTS_OIDC_LINK_EXISTING
                value: "true"
              - name: GTS_STORAGE_BACKEND
                value: "s3"
              - name: GTS_STORAGE_S3_PROXY
                value: "true"
              - name: GTS_LANDING_PAGE_USER
                value: "james"
              - name: GTS_ACCOUNTS_ALLOW_CUSTOM_CSS
                value: "true"
              - name: GTS_SMTP_HOST
                value: smtp.comms.svc.cluster.local
              - name: GTS_SMTP_PORT
                value: 25
              - name: GTS_SMTP_FROM
                value: no-reply@${SECRET_ROOT_DOMAIN}
            envFrom:
              - secretRef:
                  name: *app
              - secretRef:
                  name: gotosocial-oauth

            # Re-baselined for Postgres (#2302): the old 2.5Gi request / 3Gi
            # limit were sized around 4 x 512MiB SQLite page caches, which no
            # longer exist. The limit stays at 3Gi for the first week so a
            # federation catch-up after the cutover cannot OOMKill the pod;
            # resize both from the observed p95 afterwards. No CPU limit, per
            # the convention (federation catch-up is spiky by nature).
            resources:
              requests:
                memory: 1Gi
                cpu: 150m
                ephemeral-storage: 100Mi
              limits:
                memory: 3Gi
                ephemeral-storage: 200Mi
            # `enabled: true` is load-bearing: app-template renders a probe only
            # when it is set. These three carried `custom: true` and a spec but no
            # `enabled`, so the chart silently dropped all of them and the pod ran
            # with no probes at all — which is how a total stall on 2026-08-07 went
            # 4h45m without a restart while the pod still reported Ready (with no
            # readiness probe, Ready is automatic at container start). GoToSocial
            # was the only app in this repo making that mistake.
            #
            # The path matters as much as the flag. `/` answers 302 in ~600us
            # without touching the database, so it stayed green through the whole
            # outage. /nodeinfo/2.0 reads account/status counts, so it is the thing
            # that actually fails when the database/sql pool leaks itself dry.
            # Probe traffic is unaffected by GTS_ADVANCED_RATE_LIMIT_EXCEPTIONS,
            # and a 429 from the global throttler counts as a probe failure, which
            # is what we want.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &probePath /nodeinfo/2.0
                    port: *port
                    scheme: HTTP
                  # Healthy is <200ms. 4 consecutive misses over 5s each restarts
                  # after ~60s of genuine stall, while staying far clear of normal
                  # latency so federation catch-up can't trigger a restart loop.
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 4
                  successThreshold: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *probePath
                    port: *port
                    scheme: HTTP
                  # Drops the pod out of the Service ~45s into a stall, so callers
                  # get a fast 503 instead of hanging until the 10m request timeout.
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
                  successThreshold: 1
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *probePath
                    port: *port
                    scheme: HTTP
                  # Covers the ffmpeg wasm compile and cache warm-up on start;
                  # gates the other two. 5 minutes, then liveness takes over.
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
                  successThreshold: 1

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "GotoSocial"
          gethomepage.dev/description: "Federated Social Media"
          gethomepage.dev/group: "Applications"
          gethomepage.dev/icon: "gotosocial.png"
          gethomepage.dev/weight: "30"
          external-dns.alpha.kubernetes.io/hostname: *host
          # Point the auto-generated check at a cheap endpoint. Without this it
          # probes the bare host, GTS 302s / -> /@james (GTS_LANDING_PAGE_USER),
          # Gatus follows the redirect, and each *completed* profile render
          # leaks one SQL connection in 0.22.1 — measured as exactly +1 per
          # request, never reclaimed. At one check per minute that exhausts the
          # 8-connection pool in ~7min and wedges the instance for good, which
          # is what drove 86 restarts/12h on 2026-08-08.
          #
          # Trade-off: this no longer proves the *web frontend* renders, only
          # that the app answers and can reach the database (/nodeinfo/2.0
          # reads account/status counts). That is the same endpoint the
          # liveness probe uses. Revisit once the upstream leak is fixed.
          gatus.home-operations.com/endpoint: |
            url: https://social.${SECRET_ROOT_DOMAIN}/nodeinfo/2.0
            conditions: ["[STATUS] == 200"]
        hostnames:
          - *host
        parentRefs:
          - name: envoy-towonel
            namespace: networking
          - name: envoy-internal
            namespace: networking

    persistence:
      data:
        enabled: true
        existingClaim: gotosocial-data
        globalMounts:
          - path: /gotosocial/storage
      config:
        enabled: true
        type: configMap
        name: gotosocial-config
        globalMounts:
          - subPath: config.yaml
            path: /gotosocial/config.yaml
            readOnly: true
