---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        DATABASE_URL: |-
          postgresql://{{ .STREAMYSTATS_POSTGRES_USERNAME }}:{{ .STREAMYSTATS_POSTGRES_PASSWORD }}@${SVC_POSTGRES_HOST}:${SVC_POSTGRES_PORT}/{{ .STREAMYSTATS_POSTGRES_DATABASE }}

        SESSION_SECRET: |-
          {{ .STREAMYSTATS_SESSION_SECRET }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: streamystats
    - extract:
        key: postgresql
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-initdb
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        INIT_POSTGRES_HOST: "${SVC_POSTGRES_HOST}"
        INIT_POSTGRES_SUPER_PASS: |-
          {{ .POSTGRES_SUPERUSER_PASSWORD }}
        INIT_POSTGRES_DBNAME: |-
          {{ .STREAMYSTATS_POSTGRES_DATABASE }}
        INIT_POSTGRES_USER: |-
          {{ .STREAMYSTATS_POSTGRES_USERNAME }}
        INIT_POSTGRES_PASS: |-
          {{ .STREAMYSTATS_POSTGRES_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: streamystats
    - extract:
        key: postgresql
