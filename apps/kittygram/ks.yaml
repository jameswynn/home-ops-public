---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kittygram
  namespace: &namespace kittygram
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./apps/kittygram/app
  components:
    - ../../../components/anubis
    - ../../../components/dragonfly
    - ../../../components/volume-claim
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: *namespace
      ANUBIS_TARGET: http://kittygram:8080
      VOLUME_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
