---
# Bitwarden Secrets Manager item `okb`. Fields used here:
#   OKB_COUCHDB_PASSWORD  `obsidian` CouchDB user (shared with the clients)
#   OKB_E2EE_PASSPHRASE   LiveSync end-to-end encryption passphrase. Must
#                         match every client.
#   OKB_ID_RECOVERY_CODE  `sls-id-v1:<hex>` from the first client (LiveSync
#                         settings, E2EE: "Current ID recovery code"). Current
#                         LiveSync derives document IDs from this per-vault key
#                         (idDerivationVersion 1); without it the bridge
#                         refuses the database.
#   OKB_FORGEJO_TOKEN     Forgejo access token for james/personal-okb,
#                         scope write:repository
#
# The bridge reads one JSON file, so the credentials are templated into it
# here rather than injected as env.
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        FORGEJO_TOKEN: |-
          {{ .OKB_FORGEJO_TOKEN }}
        # Both peers share a group, so changes flow both ways between them.
        # useRemoteTweaks adopts chunking/encryption settings from the vault's
        # milestone document, which the first Obsidian client writes.
        # obfuscatePassphrase must be empty while the clients run with path
        # obfuscation off: the bridge turns obfuscation on whenever it is set.
        config.json: |-
          {
            "peers": [
              {
                "type": "couchdb",
                "name": "okb-couchdb",
                "group": "okb",
                "url": "http://couchdb.okb.svc.cluster.local:5984",
                "database": "okb",
                "username": "obsidian",
                "password": {{ .OKB_COUCHDB_PASSWORD | toJson }},
                "passphrase": {{ .OKB_E2EE_PASSPHRASE | toJson }},
                "idDerivationKey": {{ .OKB_ID_RECOVERY_CODE | toJson }},
                "obfuscatePassphrase": "",
                "baseDir": "",
                "useRemoteTweaks": true,
                "includeInternal": [".obsidian/**"]
              },
              {
                "type": "storage",
                "name": "okb-vault",
                "group": "okb",
                "baseDir": "/data/vault/",
                "scanOfflineChanges": true,
                "ignore": [".git/**", ".obsidian/workspace*.json"]
              }
            ]
          }
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: okb
