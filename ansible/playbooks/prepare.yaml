---
- hosts:
    - master
    - worker
  become: true
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Pausing for 2 seconds...
      ansible.builtin.pause:
        seconds: 2
  tasks:
    - name: Get DEB architecture
      shell: dpkg --print-architecture
      register: deb_architecture
    - name: Locale
      block:
        - name: Locale | Set timezone
          community.general.timezone:
            name: "{{ timezone | default('America/New York') }}"
    - name: Networking
      block:
        - name: Networking | Set hostname to inventory hostname
          ansible.builtin.hostname:
            name: "{{ inventory_hostname }}"
        # - name: Networking | Update /etc/hosts to include inventory hostname
        #   ansible.builtin.blockinfile:
        #     path: /etc/hosts
        #     block: |
        #       127.0.1.1   {{ inventory_hostname }}
        # - name: Networking | Update /etc/hosts to include all inventory hosts
        #   import_role:
        #     name: arillso.hosts
        #   vars:
        #     hosts_hostname_loopback: true

        - name: Networking | Add IP address of all hosts to all hosts
          ansible.builtin.lineinfile:
            dest: /etc/hosts
            regexp: '.*{{ item }}$'
            line: "{{ hostvars[item].ansible_host }} {{item}}"
            state: present
          when: hostvars[item].ansible_host is defined
          with_items: "{{ groups.all }}"

    - name: Storage
      block:
        - name: Storage | Add multipath blacklist for longhorn
          ansible.builtin.blockinfile:
            dest: /etc/multipath.conf
            block: |
              blacklist {
                  devnode "^sd[a-z0-9]+"
              }

    - name: "Setup Management User ({{ ansible_user }})"
      block:
        - name: Set authorized key for remote user
          ansible.posix.authorized_key:
            user: "{{ ansible_user }}"
            state: present
            key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa.pub') }}"

        - name: Setup passwordless sudo
          lineinfile:
            path: /etc/sudoers
            state: present
            regexp: '^%sudo'
            line: '%sudo ALL=(ALL) NOPASSWD: ALL'
            validate: '/usr/sbin/visudo -cf %s'

        - name: User Configuration | Add additional SSH public keys
          ansible.posix.authorized_key:
            user: "{{ ansible_user }}"
            key: "{{ item }}"
          loop: "{{ public_ssh_keys | default([]) }}"

    - name: Packages
      block:
        - name: Packages | Install required packages
          ansible.builtin.apt:
            name: "{{ packages | default([]) }}"
            update_cache: true
        - name: Packages | Remove snap
          ansible.builtin.apt:
            pkg: snapd
            state: absent
            purge: true
        - name: Packages | Remove leaf packages
          ansible.builtin.apt:
            autoremove: true
    - name: Reset Temp Directory Permissions
      file:
        state: absent
        path: /tmp/.ansible
    - name: Enable automatic downloads of updates
      import_role:
        name: hifis.unattended_upgrades
      vars:
        # unattended_mail: "{{ email }}"
        unattended_syslog_enable: true
    - name: System Configuration (1)
      block:
        # - name: System Configuration (1) | Configure smartd
        #   ansible.builtin.copy:
        #     dest: /etc/smartd.conf
        #     mode: 0644
        #     content: DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,35,40
        #   notify: Restart smartd
        - name: System Configuration (1) | Disable ufw | Ubuntu
          ansible.builtin.systemd:
            service: ufw.service
            enabled: false
            masked: true
            state: stopped
        - name: System Configuration (1) | Enable fstrim
          ansible.builtin.systemd:
            service: fstrim.timer
            enabled: true
    - name: System Configuration (2)
      block:
        - name: System Configuration (2) | Enable kernel modules now
          community.general.modprobe:
            name: "{{ item }}"
            state: present
          loop: [ br_netfilter, ip_vs, ip_vs_rr, overlay, rbd ]
        - name: System Configuration (2) | Enable kernel modules on boot
          ansible.builtin.copy:
            mode: 644
            content: "{{ item }}"
            dest: "/etc/modules-load.d/{{ item }}.conf"
          loop: [ br_netfilter, ip_vs, ip_vs_rr, overlay, rbd ]
        - name: System Configuration (2) | Set sysctls
          ansible.posix.sysctl:
            name: "{{ item.key }}"
            value: "{{ item.value }}"
            sysctl_file: /etc/sysctl.d/99-kubernetes.conf
            reload: true
          with_dict: "{{ sysctl_config }}"
          vars:
            sysctl_config:
              net.ipv4.ip_forward: 1
              net.ipv4.conf.all.forwarding: 1
              net.ipv4.conf.all.rp_filter: 0
              net.ipv4.conf.default.rp_filter: 0
              net.ipv6.conf.all.forwarding: 1
              net.bridge.bridge-nf-call-iptables: 1
              net.bridge.bridge-nf-call-ip6tables: 1
              fs.inotify.max_user_watches: 524288
              fs.inotify.max_user_instances: 512
        - name: System Configuration (2) | Disable swap at runtime | Ubuntu
          ansible.builtin.command: swapoff -a
          when:
            - ansible_facts['distribution'] == 'Ubuntu'
            - ansible_swaptotal_mb > 0
        - name: System Configuration (2) | Disable swap at boot | Ubuntu
          ansible.posix.mount:
            name: "{{ item }}"
            fstype: swap
            state: absent
          loop: [ "none", "swap" ]
          when: ansible_facts['distribution'] == 'Ubuntu'
        - name: System Configuration (2) | Install linux-modules-extra-rapsi package
          ansible.builtin.apt:
            name: "linux-modules-extra-raspi"
            update_cache: true
          when: inventory_hostname in groups['arm64']

        - name: System Configuration (2) | Update cmdline.txt for raspi
          replace:
            path: "/boot/firmware/cmdline.txt"
            regexp: '^([\w](?!.*\b{{ item }}\b).*)$'
            replace: '\1 {{ item }}'
          with_items:
            - "cgroup_enable=cpuset"
            - "cgroup_memory=1"
            - "cgroup_enable=memory"
          when: inventory_hostname in groups['arm64']

        # - name: System Configuration (2) | Create Netplan for eno1
        #   copy:
        #     dest: /etc/netplan/00-eno1.yaml
        #     content: |
        #       network:
        #         version: 2
        #         ethernets:
        #           eno1:
        #             dhcp4: true
        #             dhcp4-overrides:
        #               route-metric: 50
        #     owner: root
        #     group: root
        #     mode: 600
        #   when: inventory_hostname not in groups['arm64']

        # - name: System Configuration (2) | Create Netplan for vlans
        #   copy:
        #     dest: /etc/netplan/01-vlans.yaml
        #     content: |
        #       network:
        #         version: 2
        #         vlans:
        #           vlan300:
        #             id: 300
        #             link: eno1
        #             dhcp4: yes
        #             dhcp4-overrides:
        #               route-metric: 200
        #     owner: root
        #     group: root
        #     mode: 600
        #   when: inventory_hostname not in groups['arm64']

        # - name: System Configuration (2) | Netplan Apply
        #   command: netplan apply

        - name: System Configuration (2) | Create cni bin parent directory
          file:
            path: /opt/cni
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: System Configuration (2) | Link cni bin
          file:
            src: /var/lib/rancher/k3s/data/cni/
            dest: /opt/cni/bin
            state: link
            force: yes

        - name: System Configuration (2) | Create cni config directory
          file:
            path: /etc/cni
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: System Configuration (2) | Link cni config dir
          file:
            src: /var/lib/rancher/k3s/agent/etc/cni/net.d/
            dest: /etc/cni/net.d
            state: link
            force: yes
