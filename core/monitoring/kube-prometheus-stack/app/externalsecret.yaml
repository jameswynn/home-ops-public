---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        BAUTH_USER: |-
          {{ .NTFY_ALERTMANAGER_USERNAME }}
        BAUTH_PASS: |-
          {{ .NTFY_ALERTMANAGER_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: ntfy-alertmanager
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
# basicAuth for ScrapeConfig/zot-nas. `metrics` is a zot htpasswd user (Bitwarden
# ZOT_HTPASSWD) with only accessControl.metrics on top of the read-only defaultPolicy
# in docker/nas/zot/config.json — it cannot push or delete.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-metrics
  namespace: monitoring
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        username: metrics
        password: |-
          {{ .ZOT_PASSWORD }}
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: prometheus
