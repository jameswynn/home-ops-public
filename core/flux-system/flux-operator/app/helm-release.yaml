---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false
      config:
        baseURL: https://placeholder.tld
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            clientID: PLACEHOLDER_CLIENT_ID
            clientSecret: PLACEHOLDER_SECRET
            issuerURL: https://placeholder.tld
      authentication:
        type: OAuth2
        oauth2:
          provider: OIDC
          clientID: fluxcd-operator
          issuerURL: https://auth.wynning.tech/application/o/fluxcd-operator/

  valuesFrom:
    - kind: Secret
      name: fluxcd-operator
      valuesKey: FLUXCD_OPERATOR_OIDC_CLIENT_ID
      targetPath: web.config.authentication.oauth2.clientID
    - kind: Secret
      name: fluxcd-operator
      valuesKey: FLUXCD_OPERATOR_OIDC_CLIENT_SECRET
      targetPath: web.config.authentication.oauth2.clientSecret
    - kind: Secret
      name: fluxcd-operator
      valuesKey: FLUXCD_OPERATOR_OIDC_ISSUER
      targetPath: web.config.authentication.oauth2.issuerURL
    - kind: Secret
      name: fluxcd-operator
      valuesKey: FLUXCD_OPERATOR_BASE_URL
      targetPath: web.config.baseURL
