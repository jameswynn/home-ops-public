---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: default-cert
  namespace: networking
spec:
  commonName: ${SECRET_ROOT_DOMAIN}
  dnsNames:
    - ${SECRET_ROOT_DOMAIN}
    - '*.${SECRET_ROOT_DOMAIN}'
    - '*.${SECRET_INTERNAL_DOMAIN}'
    - '*.core.${SECRET_ROOT_DOMAIN}'
    - '*.dyn.${SECRET_ROOT_DOMAIN}'
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  secretName: default-cert
  usages:
    - digital signature
    - key encipherment
