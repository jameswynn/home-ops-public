---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-garage
  namespace: ai
spec:
  # Same Bitwarden item the `default` and `office` CNPG clusters already use —
  # the barman-cloud sidecar reads its S3 credentials from a Secret in the
  # cluster's own namespace, so it has to be mirrored into `ai` as well.
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: postgresql-garage
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        GARAGE_REGION: garage
        GARAGE_ACCESS_KEY: |-
          {{ .POSTGRESQL_GARAGE_ACCESS_KEY }}
        GARAGE_SECRET_KEY: |-
          {{ .POSTGRESQL_GARAGE_SECRET_KEY }}
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: postgresql-garage
