---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
# The public-DNS external-dns instance, scoped to the envoy-towonel gateway. It publishes every
# route on envoy-towonel as a grey (DNS-only) CNAME -> towonel.wynning.tech (from the gateway's
# target annotation) and the towonel.wynning.tech A record (-> VPS) from the towonel DNSEndpoint.
# Records stay grey and un-proxied so towonel's raw TLS/SNI passthrough works.
#
# The `-towonel` suffix and the distinct txtOwnerId/txtPrefix are historical: this ran alongside a
# primary `cloudflare-dns` instance that forced every record to the cloudflared tunnel. That
# instance and cloudflared are gone, but the registry keys are load-bearing — changing them would
# orphan every TXT record this instance owns.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns-towonel
  namespace: networking
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: external-dns
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    interval: 2m
    logLevel: info
    provider:
      name: cloudflare
    env:
      - name: &name CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secret
            key: *name
    extraArgs:
      # Only the towonel-labelled gateway. No --force / --cloudflare-proxied: targets come from
      # the gateway/DNSEndpoint and records are grey so towonel's raw TLS/SNI passthrough works.
      - --gateway-label-filter=network in (towonel)
    policy: sync
    sources:
      - "gateway-httproute"
      - "crd"
    txtPrefix: k8s-tw.
    txtOwnerId: towonel
    domainFilters:
      - "${SECRET_ROOT_DOMAIN}"
      - "sneaker.social"
      - "jameswynn.com"
    excludeDomains:
      # int.* isn't public — mikrotik-dns owns it.
      - "${SECRET_INTERNAL_DOMAIN}"
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: external-dns-secret
