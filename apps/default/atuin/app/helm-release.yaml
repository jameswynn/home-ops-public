---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app atuin
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      atuin:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: atuin-init-db

        containers:
          app:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.19.0@sha256:4d0ccca1d151f860b3f469c60df78bf1ab798f15e88dc1912d31d6741653eb99
            args:
              - start
            env:
              ATUIN_CONFIG_DIR: /config
              ATUIN_HOST: 0.0.0.0
              ATUIN_PORT: &port 8888
              ATUIN_OPEN_REGISTRATION: true
              TZ: ${CLUSTER_TZ}
              ATUIN_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: ATUIN_DB_URI

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            # CPU from 7d of Prometheus data: p50 0m, p95 0m, max 2m. 25m is the
            # practical request floor. No CPU limit, per the cluster convention.
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
                ephemeral-storage: 100Mi
              limits:
                memory: 512Mi
                ephemeral-storage: 100Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: atuin
        ports:
          http:
            port: *port

    persistence:
      config:
        type: emptyDir
        sizeLimit: 10Mi

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Atuin"
          gethomepage.dev/description: "Shell History Management"
          gethomepage.dev/group: "Applications"
          gethomepage.dev/icon: "atuin.png"
          gethomepage.dev/weight: "100"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
