---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app yubal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            # TODO: replace with the real image for this app
            image:
              repository: ghcr.io/guillevc/yubal
              tag: 0.10.0@sha256:1447663d19eb69e4c6c6d274e979a99c4013a7d0a7666ca1bf2127612cd639eb
            env:
              YUBAL_TZ: ${CLUSTER_TZ}
              YUBAL_PORT: &port 8080
              YUBAL_DOWNLOAD_UGC: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            # CPU from 7d of Prometheus data: p50 2m, p95 3m, max 72m (the max
            # is a download job). 25m is the practical request floor. No CPU
            # limit, per the cluster convention — downloads should burst.
            resources:
              requests:
                cpu: 25m
                memory: 256M
                ephemeral-storage: 100Mi
              limits:
                memory: 512Mi
                ephemeral-storage: 100Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "yubal"
          gethomepage.dev/description: "Youtube Music Downloader"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/yubal.svg
          gethomepage.dev/weight: "100"
        hostnames:
          - "${APP}.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      config:
        enabled: true
        existingClaim: *app
        advancedMounts:
          main:
            main:
              - path: /app/config

      media:
        enabled: true
        type: nfs
        server: ${SECRET_NAS_URL}
        path: /volume1/media
        globalMounts:
          - path: /app/data
            subPath: music

      tmpfs:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /tmp
            subPath: tmp
          - path: /run
            subPath: run
