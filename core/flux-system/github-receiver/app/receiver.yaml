---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: forgejo-receiver
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: forgejo-webhook-secret
  resources:

    - apiVersion: source.extensions.fluxcd.io/v1beta1
      kind: ArtifactGenerator
      name: private-apps
      namespace: flux-system

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: private-apps-forgejo
      namespace: flux-system

    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: private-apps
      namespace: flux-system

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
      namespace: flux-system

    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: flux-system
      namespace: flux-system
