---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
  namespace: home
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      esphome:
        # type: statefulset
        annotations:
          secret.reloader.stakater.com/reload: esphome-secrets
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "networking",
                "ips": ["10.3.0.152/24"],
                "mac": "92:cf:d7:05:70:84"
              }]
        containers:
          app:
            image:
              repository: ghcr.io/esphome/esphome
              tag: 2026.7.4

            # CPU from 7d of Prometheus data: p50 0.1m, p95 0.1m, max 0.2m —
            # and the same max over 30d, i.e. no firmware compile ran in the
            # window. Steady state is a web UI doing nothing, so the request
            # drops to the 25m floor. No CPU limit, per the cluster convention;
            # dropping the 4000m ceiling means a compile can use whatever the
            # node has spare instead of being capped at 4 cores.
            resources:
              requests:
                cpu: 25m
                memory: 512M
                ephemeral-storage: 5Gi
              limits:
                memory: 6096M
                ephemeral-storage: 5Gi

    service:
      app:
        controller: esphome
        ports:
          http:
            port: 6052

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "esphome"
          gethomepage.dev/description: "ESP IoT Management"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "esphome.png"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      config:
        enabled: true
        existingClaim: esphome-config
        globalMounts:
          - path: /config
      esphome-cache:
        enabled: true
        type: emptyDir
        sizeLimit: 5Gi
        globalMounts:
          - path: /config/.esphome
