---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: opentelemetry-operator
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.121.0
  url: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-operator
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: monitoring
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: opentelemetry-operator
  values:
    crds:
      create: true
    admissionWebhooks:
      certManager:
        # Reuse the cluster's cert-manager for the admission-webhook cert.
        enabled: true
    manager:
      # collectorImage left at chart default (opentelemetry-collector-k8s distro),
      # which ships the otlp / prometheusremotewrite / otlphttp exporters we use.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
