---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vikunja
  namespace: office
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: *app
            secret.reloader.stakater.com/reload: *app
        containers:
          main:
            image:
              repository: mirror.gcr.io/vikunja/vikunja
              tag: 2.5.0@sha256:22df4c1bc8843c28d383bc5f52b59e7b601bf5f6560b36b29c0a500833c77fa3
            envFrom:
              - secretRef:
                  name: *app
            env:
              - name: VIKUNJA_SERVICE_TIMEZONE
                value: ${CLUSTER_TZ}

              - name: POSTGRES_ENABLED
                value: "true"
              - name: VIKUNJA_DATABASE_TYPE
                value: 'postgres'

              # - name: VIKUNJA_SERVICE_FRONTENDURL
              #   value: https://tasks.${SECRET_ROOT_DOMAIN}
              - name: VIKUNJA_SERVICE_PUBLICURL
                value: https://tasks.${SECRET_INTERNAL_DOMAIN}

              - name: VIKUNJA_MAILER_FROMEMAIL
                value: no-reply@${SECRET_ROOT_DOMAIN}
              - name: VIKUNJA_MAILER_ENABLED
                value: 'true'
              - name: VIKUNJA_MAILER_HOST
                value: smtp.comms.svc.cluster.local
              - name: VIKUNJA_MAILER_PORT
                value: 25

              - name: VIKUNJA_REDIS_ENABLED
                value: "true"
              - name: VIKUNJA_REDIS_HOST
                value: vikunja-dragonfly:6379
              - name: VIKUNJA_REDIS_DB
                value: 7
              - name: VIKUNJA_KEYVALUE_TYPE
                value: redis
            # CPU from 7d of Prometheus data: p50 1m, p95 1m, max 4m. 25m is ~6x
            # the observed max. No CPU limit, per the cluster convention.
            resources:
              requests:
                memory: 50Mi
                cpu: 25m
                ephemeral-storage: 100Mi
              limits:
                memory: 500Mi
                ephemeral-storage: 200Mi

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: vikunja-init-db

    service:
      main:
        controller: main
        ports:
          http:
            port: 3456

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Vikunja"
          gethomepage.dev/description: "To-Do/Kanban"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "vikunja.png"
          gethomepage.dev/weight: "50"
          external-dns.alpha.kubernetes.io/hostname: "tasks.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - "tasks.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      files:
        enabled: true
        existingClaim: vikunja
        globalMounts:
          - path: /app/vikunja/files
      config:
        enabled: true
        type: secret
        name: *app
        globalMounts:
          - path: /etc/vikunja/config.yml
            subPath: config.yml
            readOnly: true
