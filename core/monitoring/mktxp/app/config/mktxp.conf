# mktxp router config (#461). Everything not set here takes mktxp's [default]
# values, which mktxp writes back into this file's writable copy at startup.
[hex-s]
    hostname = 192.168.1.1

[default]
    enabled = True
    hostname = 192.168.1.1

    # api-ssl only; the plaintext API (8728) is slated for removal (#1524).
    # The router serves a self-signed cert whose SAN is 192.168.1.1, pinned
    # here — see tofu/mikrotik/services.tf.
    port = 8729
    use_ssl = True
    ssl_certificate_verify = True
    ssl_check_hostname = True
    ssl_ca_file = api-ssl.crt

    # Read-only `mktxp` user (tofu/mikrotik/locals.tf), from mktxp-secret.
    credentials_file = /secret/credentials.yaml

    health = True
    routerboard = True
    installed_packages = True
    dhcp = True
    dhcp_lease = True
    pool = True
    interface = True
    monitor = True
    route = True
    firewall = True
    neighbor = True
    dns = True
    netwatch = True
    public_ip = True
    user = True
    queue = True
    bgp = True
    wireguard_peers = True

    # Open connections per source address. Destinations stay off: one series
    # per destination IP is exactly the cardinality flows (Part 2) avoid.
    connections = True
    connection_stats = True
    connection_stats_destinations = False

    # Per-client byte/rate counters. Kid Control already tracks every device
    # on the LAN; dynamic includes those not assigned to a Kid Control user.
    kid_control_assigned = True
    kid_control_dynamic = True

    # `dhcp_name` is the client's DHCP host-name, else its MAC; many IoT and
    # appliance clients send none. `combined` appends the static lease comment
    # ("88:C9:… (sony-tv-wired)"), so devices named in leases.sops.yaml are
    # readable. It applies to interface/firewall names too ("bridge (defconf)"),
    # which is why MikrotikWanDown matches `ether1( .*)?`.
    # Comments are truncated to 20 characters by mktxp.
    interface_name_format = combined

    # Off: its labels include a live countdown (`expires_after`), so every
    # scrape mints new series.
    certificate = False

    # Hardware this router doesn't have.
    poe = False
    wireless = False
    wireless_clients = False
    capsman = False
    capsman_clients = False
    w60g = False
