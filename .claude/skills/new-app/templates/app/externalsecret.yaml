---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # TODO: map the secret fields this app actually consumes.
        # Each value references a field on the Bitwarden secret extracted below.
        # Example:
        #   SECRET_KEY: |-
        #     {{ .__APP_UPPER___SECRET_KEY }}
        SECRET_KEY: |-
          {{ .__APP_UPPER___SECRET_KEY }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        # TODO: confirm this Bitwarden Secrets Manager key exists, or change to the right one.
        key: __BITWARDEN_KEY__
