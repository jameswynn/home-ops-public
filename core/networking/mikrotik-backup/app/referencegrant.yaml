---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagereferencegrant_v1beta1.json
# Lets GarageKey default/garage-nas-owner manage its owner permission on this
# bucket (same pattern as core/monitoring/loki/app/referencegrant.yaml).
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: garage-nas-owner-mikrotik-backup
spec:
  from:
    - kind: GarageKey
      namespace: default
  to:
    - kind: GarageBucket
      name: mikrotik-backup
