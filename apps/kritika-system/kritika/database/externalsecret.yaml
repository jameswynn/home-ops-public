---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
# Owner role: owns the database, runs migrations and leader work. Not a
# superuser. Used by CNPG's initdb and handed to the chart as database.owner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-db-owner
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: kritika-db-owner
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
        # connect_timeout per kritika's database docs. Passwords must avoid
        # URI-special characters (alphanumeric).
        uri: "postgres://kritika:{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}@kritika-postgres-rw.kritika-system.svc:5432/kritika?sslmode=require&connect_timeout=10"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
# Application role kritika_app: login only, no superuser, no BYPASSRLS, owns
# nothing (kritika's row-level security depends on that).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-db-app
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: kritika-db-app
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .KRITIKA_POSTGRES_APP_PASSWORD }}"
        uri: "postgres://kritika_app:{{ .KRITIKA_POSTGRES_APP_PASSWORD }}@kritika-postgres-rw.kritika-system.svc:5432/kritika?sslmode=require&connect_timeout=10"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
# Garage S3 credentials for barman-cloud, mirrored into this namespace (the
# sidecar reads them from the cluster's own namespace), same item as memini.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-garage
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: postgresql-garage
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        GARAGE_REGION: garage
        GARAGE_ACCESS_KEY: |-
          {{ .POSTGRESQL_GARAGE_ACCESS_KEY }}
        GARAGE_SECRET_KEY: |-
          {{ .POSTGRESQL_GARAGE_SECRET_KEY }}
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: postgresql-garage
