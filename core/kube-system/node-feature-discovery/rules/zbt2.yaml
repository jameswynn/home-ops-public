---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/nfd.k8s-sigs.io/nodefeaturerule_v1alpha1.json
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: zbt2
spec:
  rules:
    # Conbee Zigbee hub
    - name: zbt2
      labels:
        feature.node.kubernetes.io/zbt2: "true"
      matchFeatures:
        - feature: usb.device
          matchExpressions:
            vendor: { op: In, value: [ "303a", "831a" ] }
