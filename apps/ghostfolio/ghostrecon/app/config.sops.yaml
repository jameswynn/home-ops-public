# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/v1/secret.json
#
# config.yaml and derive.rhai for ghostrecon, mounted together at /config.
#
# They live in the same Secret on purpose: `derive.script` resolves relative to
# config.yaml's own directory, so a separate mount would leave the pod dying at
# startup with "Derive script does not exist".
#
# SOPS-encrypted because config.yaml carries real Ghostfolio account UUIDs.
# Edit with `task sops:decrypt -- <this file>`, then re-encrypt with
# `task sops:encrypt -- <this file>` before staging.
#
# Flux variable substitution is switched off for this one resource, and has to
# stay off. Rhai string interpolation is spelled `${expr}` — the same syntax
# envsubst claims — so every log line in derive.rhai looks like a variable
# reference to it. The good case is that a real message is silently replaced by
# an empty string; the bad case is what actually happened, which is that
# `${out[i].name}` is not a parseable variable name and the whole Kustomization
# stops reconciling with "envsubst error: unable to parse variable name".
# Escaping each one as `$${...}` would work and would be a standing trap: the
# script is upstream's, gets re-copied wholesale, and the escapes would have to
# be re-applied by hand every time. Turning substitution off for the resource
# lets derive.rhai stay byte-identical to ../ghostrecon/derive.rhai instead.
#
# The cost is that ${CLUSTER_TZ} no longer resolves here, so the schedule's
# timezone below is written out literally. It is the only substitution this
# Secret ever used. Same approach as frigate and cloudnative-pg, which annotate
# their generated config for the same reason.
apiVersion: v1
kind: Secret
metadata:
    name: ghostrecon-config
    annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
type: Opaque
stringData:
    config.yaml: ENC[AES256_GCM,data:,iv:TbS2MrxA0cU6FDbn7Rn1VrQFqql3uhm3iQ1blF9gTbU=,tag:wlDC2kVLPnVTAffefQk/QA==,type:str]
    derive.rhai: ENC[AES256_GCM,data:,iv:jCe7hZaY8az3Lsm/bHWagos+UEUyMNozrMwypANgdIo=,tag:O0drqPkRlJqT5tRenIePoA==,type:str]
sops:
    age:
        - enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSAvNHZSOTZlVXhraFB1MHRG
            OHY1ZFNRblJkcEwrZVZueXAxM2R1K3JEejBrCnJKZ2ZPUk1BRWlGc3ZYWlpCZldB
            YVR3TGpzUGxxR0JKNE5QRVJaOW1JVzgKLS0tIDNYanU3VmhsVEVTL1dIcUZFd3dV
            ZU5nSkdtQlpLUzNPd1I5Ny8ra2w3WnMKtuSl2HTKslF2hYWtYK0J6W5nYocs1S8N
            nWpxV+3nanJ+QRjfcBFM4aucOIPi12qWvZhjPvAUb2Udzjpf6ThIkg==
            -----END AGE ENCRYPTED FILE-----
          recipient: age1zjgnh5c52xfue53fjsw7s5qyj5lqv9zj44rsk0rw7ywvs72xe3csfclpem
    encrypted_regex: ^(data|stringData)$
    lastmodified: "2026-08-18T12:15:49Z"
    mac: ENC[AES256_GCM,data:jRf/nU/PTaafxrQTTb51YVoT5NB4iGjCJXWYgBHhR16xh6dyShA+d/UUCyby4yAmABFs9Dmm9SlSXSL6zmb1NNvY49cGK6wXKXK6jct97g7bHpk3JABzUp6LIC48BBVBW6Sl5J+owDiM2dFd43FGUlr8OFexg+rfTu6v7F7JrFw=,iv:1QkrDAz7bs4TXK39xVpUYDSiU3qZqod0zP7roSB6Bcs=,tag:F0kK9MX1N0a+gNcakatSTw==,type:str]
