              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "count(sum by (client_ip)(count_over_time({namespace=\"networking\", pod=~\"envoy-towonel-.*\"} |= \"Coraza:\" | regexp `\\[client \"(?P<client_ip>[^\"]*)\"\\]` [$__range])))",
