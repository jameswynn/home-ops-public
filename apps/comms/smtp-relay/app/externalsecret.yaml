---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
  namespace: comms
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        SMTP_RELAY_SERVER: |-
          {{ .SMTP_RELAY_SERVER }}
        SMTP_RELAY_USERNAME: |-
          {{ .SMTP_RELAY_USERNAME }}
        SMTP_RELAY_PASSWORD: |-
          {{ .SMTP_RELAY_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: smtp-relay
