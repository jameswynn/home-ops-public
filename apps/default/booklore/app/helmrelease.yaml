---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: booklore
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          fixup:
            image:
              repository: mirror.gcr.io/busybox
              tag: latest
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
              - --
            args:
              - "mkdir -p /run/nginx"
        containers:
          main:
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: v3.3.2
            env:
              TZ: ${CLUSTER_TZ}
              USER_ID: 1000
              GROUP_ID: 1000
              BOOKLORE_PORT: &port "6060"
              DATABASE_URL: "jdbc:mariadb://localhost:3306/booklore"
              DATABASE_USERNAME: booklore
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore
                    key: DATABASE_PASSWORD
              SWAGGER_ENABLED: "true"
              # FORCE_DISABLE_OIDC: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 6060
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3306
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            # CPU from 7d of Prometheus data: p50 18.6m, p95 25.3m, max 917m
            # (the max is a library scan/metadata refresh). Idle sits near 20m,
            # so 50m covers the steady state and still lets a scan schedule.
            # No CPU limit, per the cluster convention — a 2000m cap on an app
            # that never sustains 30m only ever throttled those scans.
            resources:
              requests:
                cpu: 50m
                memory: 256M
                ephemeral-storage: 100Mi
              limits:
                memory: 3Gi
                ephemeral-storage: 500Mi

          mariadb:
            image:
              repository: lscr.io/linuxserver/mariadb
              tag: 11.8.8

            env:
              TZ: ${CLUSTER_TZ}
              MYSQL_USER: booklore
              MYSQL_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore
                    key: DATABASE_PASSWORD
              MYSQL_DATABASE: booklore
              MYSQL_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore
                    key: DATABASE_ROOT_PASSWORD

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    ingress:
      ts-main:
        enabled: true
        className: tailscale
        hosts:
          - host: "{{ .Release.Name }}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - "{{ .Release.Name }}"

    route:
      legacy:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking

      grimmory:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Grimmory"
          gethomepage.dev/description: "Book Management"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: "book-lore.png"
          gethomepage.dev/weight: "100"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name = booklore"
          internal.wynning.tech/hostname: &host "books.${SECRET_INTERNAL_DOMAIN}"
          tailscale.com/expose: "true"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      data:
        enabled: true
        existingClaim: booklore
        advancedMounts:
          main:
            main:
              - path: /app/data
      mariadb:
        enabled: true
        existingClaim: booklore-mariadb
        advancedMounts:
          main:
            mariadb:
              - path: /config

      media:
        enabled: true
        type: nfs
        server: ${SECRET_NAS_URL}
        path: /volume1/media
        advancedMounts:
          main:
            main:
              - path: /ebooks
                subPath: books2
              - path: /bookdrop
                subPath: calibre-web-ingest

      tmpfs:
        type: emptyDir
        sizeLimit: 2Gi
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /tmp
            subPath: tmp
          - path: /run
            subPath: run
