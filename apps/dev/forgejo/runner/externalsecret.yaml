---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # A persistent UUID+token pair, as issued once when the runner is created in
        # Forgejo's runner settings — NOT a short-lived registration token. The runner
        # therefore never runs `forgejo-runner register`; it is handed the credentials
        # directly via server.connections in its config (same model as the VPS runner
        # in docker/vps/04-runner).
        UUID: |-
          {{ .FORGEJO_RUNNER_UUID }}
        TOKEN: |-
          {{ .FORGEJO_RUNNER_TOKEN }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: forgejo-runner
