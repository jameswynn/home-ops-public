---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.6.0
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    fullnameOverride: *app

    auth:
      oidc:
        enabled: true
        issuerUrl: https://auth.wynning.tech/application/o/renovate-operator/
        clientId: renovate-operator
        existingSecret: renovate-operator
        secretKey: client-secret

    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Renovate"
        gethomepage.dev/description: "Dependency Updates"
        gethomepage.dev/group: "Development"
        gethomepage.dev/icon: "renovate.svg"
        gethomepage.dev/weight: "100"
        gethomepage.dev/pod-selector: "app = renovate-operator"
      hostnames:
        - renovate.${SECRET_INTERNAL_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: networking
    webhook:
      enabled: true
