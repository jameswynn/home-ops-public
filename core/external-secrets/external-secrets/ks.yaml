---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: &namespace external-secrets
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  targetNamespace: *namespace
  path: ./core/external-secrets/external-secrets/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-bw-secrets
  namespace: &namespace external-secrets
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  targetNamespace: *namespace
  path: ./core/external-secrets/external-secrets/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-secretstore
  namespace: &namespace external-secrets
  labels:
    disable-global-substitutions: "true"
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  targetNamespace: *namespace
  path: ./core/external-secrets/external-secrets/secretstore
  prune: true
  dependsOn:
    - name: external-secrets
    - name: external-secrets-bw-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: bw-secrets
