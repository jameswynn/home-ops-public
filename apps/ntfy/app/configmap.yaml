apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-configmap
data:
  server.yml: |-
    behind-proxy: true
    base-url: "https://ntfy.${SECRET_ROOT_DOMAIN}"
    listen-http: ":8080"

    cache-file: "/var/cache/ntfy/cache.db"
    attachment-cache-dir: "/var/cache/ntfy/attachments"
    attachment-total-size-limit: "5G"
    attachment-file-size-limit: "50M"
    attachment-expiry-duration: "6h"

    auth-file: "/var/lib/ntfy/user.db"
    auth-default-access: "deny-all"
    enable-login: true

    # behind-proxy makes ntfy take the visitor IP from the rightmost X-Forwarded-For
    # entry, i.e. envoy's immediate downstream. For in-cluster clients that is the
    # calling pod's IP, so every Matrix push for every user collapses into a single
    # visitor bucket keyed on the continuwuity pod IP (default: 60 burst, then one
    # request per 5s). That starved real pushes -- 201 were 429'd in a single day.
    #
    # Exempt the k3s pod CIDR: in-cluster callers are trusted workloads and already
    # have to authenticate (auth-default-access is deny-all). This does not weaken
    # rate limiting for external users -- envoy-towonel preserves the real public
    # client IP, so external visitors bucket on their own address, never on 10.42.x.x.
    #
    # The pod CIDR rather than continuwuity's pod IP because pod IPs are ephemeral;
    # a pinned IP would silently regress the next time the pod is rescheduled.
    visitor-request-limit-exempt-hosts: "10.42.0.0/16"
