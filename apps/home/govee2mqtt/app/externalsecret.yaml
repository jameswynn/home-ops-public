---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: govee2mqtt
  namespace: home
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        GOVEE_EMAIL: |-
          {{ .GOVEE_EMAIL }}
        GOVEE_PASSWORD: |-
          {{ .GOVEE_PASSWORD }}
        GOVEE_API_KEY: |-
          {{ .GOVEE_API_KEY }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: govee2mqtt
