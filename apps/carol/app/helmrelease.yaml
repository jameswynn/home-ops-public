# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app carol
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      carol:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: forge.wynning.tech/james/carol # {"$imagepolicy": "carol:carol:name"}
              # tag: branch-22-skills-f71a259
              tag: v0.0.2-rc.6 # {"$imagepolicy": "carol:carol:tag"}
            env:
              APP_URL: https://carol.${SECRET_INTERNAL_DOMAIN}
              DATABASE_URL: sqlite:/data/carol.db
              CAROL_STORAGE_ROOT: /data/storage
              OIDC_AUTHENTIK_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: carol-oauth-secret
                    key: client_id
              OIDC_AUTHENTIK_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: carol-oauth-secret
                    key: client_secret
              OIDC_AUTHENTIK_ISSUER: https://auth.${SECRET_ROOT_DOMAIN}/application/o/carol/
              OIDC_AUTHENTIK_REQUIRE_EMAIL_VERIFIED: "false"
              CAROL_TRANSCRIPTION_ENABLED: "true"
              CAROL_TRANSCRIPTION_PROTOCOL: "wyoming"
              CAROL_TRANSCRIPTION_ENDPOINT: "192.168.1.212:10300"
            envFrom:
              - secretRef:
                  name: carol
            probes:
              liveness: &probes
                enabled: false
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Carol"
          gethomepage.dev/description: "Personal Career Manager"
          gethomepage.dev/group: "Applications"
          gethomepage.dev/icon: "https://carol.${SECRET_INTERNAL_DOMAIN}/icon-192.png"
          gethomepage.dev/weight: "50"
        hostnames:
          - "carol.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      data:
        enabled: true
        existingClaim: carol
        globalMounts:
          - path: /data
