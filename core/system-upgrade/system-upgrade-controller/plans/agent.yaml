---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/upgrade.cattle.io/plan_v1.json
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  serviceAccountName: system-upgrade-controller
  concurrency: 1
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: "v1.35.4+k3s1"
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/master
        operator: NotIn
        values:
          - "true"
  prepare:
    image: rancher/k3s-upgrade
    args:
      - "prepare"
      - "k3s-server"
  upgrade:
    image: rancher/k3s-upgrade
  drain:
    force: true
    deleteLocalData: true # default
    ignoreDaemonSets: true # default
    skipWaitForDeleteTimeout: 300
  tolerations:
    - { key: arm, effect: NoSchedule, operator: Equal, value: "true" }
