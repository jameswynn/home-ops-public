---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: konflate-secret
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Forge read token — required, home-ops is a private repo.
        KONFLATE_TOKEN: "{{ .KONFLATE_TOKEN }}"
        # Inbound webhook secret; enables POST /hooks.
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
        # Write-only credential for commit statuses + PR comments.
        KONFLATE_WRITE_TOKEN: "{{ .KONFLATE_WRITE_TOKEN }}"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: konflate
