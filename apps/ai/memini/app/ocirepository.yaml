---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: memini
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # The published chart pins the app image by digest, so this tag is the single
  # version pin for both chart and image — do not also pin `image.tag` in the
  # HelmRelease values or the two will drift.
  ref:
    tag: v0.7.18
  url: oci://registry.erwanleboucher.dev/eleboucher/charts/memini
