---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagecluster_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageCluster
metadata:
  name: garage-nas
spec:
  replicas: 1
  zone: garage
  gateway: true
  replication:
    factor: 1
  # Pin the full image like garage-cluster does. garage-operator >=0.8.2 renders
  # imageRepository as "<repo>:<tag>" (no "/garage" appended), so the bare repo
  # produced the unpullable "mirror.gcr.io/dxflrs:v2.4.1". Match the NAS node's
  # version (docker on 192.168.1.3 runs dxflrs/garage:v2.5.0).
  image: mirror.gcr.io/dxflrs/garage:v2.5.0
  connectTo:
    rpcSecretRef:
      name: garage-nas
      key: GARAGE_RPC_SECRET
    bootstrapPeers:
      - "f06c429d7558b7fddf64b1c24ad6f6467eeceb6ef8841685922142216190cf1b@192.168.1.3:3901"
    adminApiEndpoint: "https://s3-admin.core.wynning.tech"
    adminTokenSecretRef:
      name: garage-nas
      key: GARAGE_ADMIN_TOKEN
  admin:
    adminTokenSecretRef:
      name: garage-nas
      key: GARAGE_ADMIN_TOKEN
  publicEndpoint:
    type: LoadBalancer
    loadBalancer:
      annotations:
        # #2064: new BGP-only IP is primary (SVC_* var); old L2 IP kept until retired.
        lbipam.cilium.io/ips: "192.168.1.225,${SVC_GARAGE_NAS_GATEWAY_ADDR}"
