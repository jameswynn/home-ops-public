---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app adguard-secondary
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 100
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - "adguard-primary"
                  topologyKey: kubernetes.io/hostname
        containers:
          main:
            image:
              repository: mirror.gcr.io/adguard/adguardhome
              tag: v0.107.79

            env:
              PUID: 1000
              GUID: 1000
              TZ: "${CLUSTER_TZ}"

            # CPU from 7d of Prometheus data: p50 0.7m, p95 1m, max 2.4m — it
            # only sees the queries primary doesn't. 25m is the practical
            # request floor. No CPU limit, per the cluster convention: if it
            # ever has to take over for primary it must be free to burst.
            resources:
              requests:
                memory: 10Mi
                cpu: 25m
                ephemeral-storage: 10Mi
              limits:
                memory: 500Mi
                ephemeral-storage: 20Mi

    service:
      main:
        type: LoadBalancer
        controller: main
        annotations:
          lbipam.cilium.io/ips: ${SVC_ADGUARD2_ADDR}
          lbipam.cilium.io/sharing-key: adguard2
          internal.wynning.tech/hostname: "adguard2.${SECRET_INTERNAL_DOMAIN}"
        externalTrafficPolicy: Local
        ports:
          setup:
            enabled: false
            port: 3000
          http:
            enabled: true
            port: &httpPort 80
            targetPort: 8080
          dns:
            enabled: false
            port: 53
      udp:
        enabled: true
        controller: main
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_ADGUARD2_ADDR}
          lbipam.cilium.io/sharing-key: adguard2
          tailscale.com/expose: "true"
        externalTrafficPolicy: Local
        ports:
          dns:
            enabled: true
            port: 53
            targetPort: 5053
            protocol: UDP

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "AdGuard Secondary"
          gethomepage.dev/description: "DNS Based Filtering"
          gethomepage.dev/group: "DNS"
          gethomepage.dev/icon: "adguard-home.png"
          gethomepage.dev/weight: "20"
          gethomepage.dev/widget.url: "https://adguard-secondary.${SECRET_INTERNAL_DOMAIN}"
          gethomepage.dev/widget.type: "adguard"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - name: adguard-secondary-main
                port: *httpPort

    persistence:
      config:
        enabled: true
        existingClaim: adguard-secondary-config
        globalMounts:
          - path: /opt/adguardhome/conf
      work:
        enabled: true
        existingClaim: adguard-secondary-work
        globalMounts:
          - path: /opt/adguardhome/work
  valuesFrom:
    - kind: Secret
      name: adguard-sync
      valuesKey: USERNAME
      targetPath: route.app.annotations.gethomepage\.dev/widget\.username
    - kind: Secret
      name: adguard-sync
      valuesKey: PASSWORD
      targetPath: route.app.annotations.gethomepage\.dev/widget\.password
