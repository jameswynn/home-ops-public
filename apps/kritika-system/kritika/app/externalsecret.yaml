---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
# Env for kritika serve, referenced from config as { env: NAME }. kritika fails
# startup on an unreferenced KRITIKA_AUTH_* variable and on a setting given in
# both config and env, so keep these names in step with helm-release.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: kritika-secret
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        ADMIN_PASSWORD: "{{ .KRITIKA_ADMIN_PASSWORD }}"
        # PEM, 4096-bit RSA (openssl genrsa 4096). Signs the JWTs Forgejo's
        # Authorized Integration validates via <webUrl>/forgejo/.well-known/keys.
        FORGEJO_PRIVATE_KEY: "{{ .KRITIKA_FORGEJO_PRIVATE_KEY }}"
        FORGEJO_WEBHOOK_SECRET: "{{ .KRITIKA_FORGEJO_WEBHOOK_SECRET }}"
        # Dedicated LiteLLM virtual key (minted like memini's/toolhive's).
        LITELLM_API_KEY: "{{ .KRITIKA_LITELLM_API_KEY }}"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: kritika
