      # toolhive-secretary (Jonathon): SearXNG + memini-jonathon + Koffan
      #   + CalDAV + CardDAV
      # Koffan tool names are defined in the forge.wynning.tech/james/koffan-mcp
      # adapter source; Cedar names listed below are the VMCP-prefixed forms
      # (MCPServer name "koffan" + raw tool name). Full read+write is granted:
      # a shopping-list secretary needs to add, update, and remove items.
      # ToolHive prefix: MCPServerEntry name "memini-jonathon" → "memini-jonathon_".
      # Verify koffan_* names with `tools/list` after the image is published and
      # the MCPServer starts (see OIDC.md).
      #
      # CalDAV/CardDAV (#1551/#1552) are the pi0n00r/nextcloud-mcp-server image
      # split into two MCPServers, "caldav" and "carddav" → Cedar prefixes
      # caldav_ and carddav_ over the raw nc_calendar_*/nc_contacts_* names.
      # Tool names are EXACT: read from `tools/list` against the pinned digest,
      # not inferred (see CALDAV-CARDDAV.md).
      #
      # The permits below are the complete `toolsFilter` allow-lists from
      # caldav.yaml and carddav.yaml — Cedar cannot grant anything the filters
      # do not expose, so the two lists are kept in sync deliberately:
      #   caldav  5 read + 3 write + 1 destructive (delete_event)
      #   carddav 4 read + 2 write + 0 destructive
      # Calendar collection management (manage_calendar), filter-matched mass
      # edits (bulk_operations), all VTODO tools, contact/address-book deletion
      # and the lossy contact-write spellings are excluded at the backend and so
      # have no permit here. Adding a permit for one of them does nothing until
      # the corresponding toolsFilter entry is added too.
      # -------------------------------------------------------------------------
