---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ideon
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: ideon-init-db
        containers:
          main:
            image:
              repository: ghcr.io/3xpyth0n/ideon
              tag: 0.9.6
            env:
              TIMEZONE: ${CLUSTER_TZ}
              APP_PORT: &port 3000
              APP_URL: https://${APP}.${SECRET_INTERNAL_DOMAIN}
            envFrom:
              - secretRef:
                  name: *app
            # CPU from 7d of Prometheus data: p50 2m, p95 2m, max 16m. No CPU
            # limit, per the cluster convention.
            resources:
              requests:
                cpu: 25m
                memory: 256M
                ephemeral-storage: 100Mi
              limits:
                memory: 2Gi
                ephemeral-storage: 500Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "ideon"
          gethomepage.dev/description: "Idea Management"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "https://${APP}.${SECRET_INTERNAL_DOMAIN}/light-icon.png"
          gethomepage.dev/weight: "120"
        hostnames:
          - "${APP}.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      data:
        enabled: true
        existingClaim: *app
        advancedMounts:
          main:
            main:
              - path: /app/storage
      tmpfs:
        type: emptyDir
        sizeLimit: 100Gi
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /tmp
            subPath: tmp
          - path: /run
            subPath: run
