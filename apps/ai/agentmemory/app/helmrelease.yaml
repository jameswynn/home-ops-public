---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app agentmemory
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: forge.wynning.tech/james/agentmemory
              tag: v0.9.12-1@sha256:ab4cfa40e5be9c96bc80fdd44f6460e0ac20625ec3f2e5def2493ad42ef6f5c9
            env:
              TZ: ${CLUSTER_TZ}
              AGENTMEMORY_TOOLS: all
              EMBEDDING_PROVIDER: local
              III_REST_PORT: "3111"
              GRAPH_EXTRACTION_ENABLED: "true"
              CONSOLIDATION_ENABLED: "true"
              AGENTMEMORY_AUTO_COMPRESS: "true"

            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /agentmemory/livez
                    port: 3111
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /agentmemory/livez
                    port: 3111
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /agentmemory/livez
                    port: 3111
                  failureThreshold: 60
                  periodSeconds: 5
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 256M
                ephemeral-storage: 100Mi
              limits:
                memory: 2Gi
                ephemeral-storage: 500Mi
    service:
      main:
        controller: main
        ports:
          api:
            port: 3111
          viewer:
            port: 3113

    route:
      api:
        annotations:
          # API-only service: it serves nothing at "/", so the sidecar's default
          # root probe always 404s. Use the app's own liveness path.
          gatus.home-operations.com/endpoint: |-
            url: https://${APP}-api.${SECRET_INTERNAL_DOMAIN}/${APP}/livez
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "${APP}-api.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: 3111
      viewer:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "agentmemory"
          gethomepage.dev/description: "AI Memory"
          gethomepage.dev/group: "AI"
          gethomepage.dev/icon: mdi-brain
          gethomepage.dev/weight: "150"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name = ${APP}"
        hostnames:
          - "${APP}.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: 3113

    persistence:
      data:
        enabled: true
        existingClaim: *app
        advancedMounts:
          main:
            main:
              # TODO: update mount path to match the app's data directory
              - path: /data
      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
