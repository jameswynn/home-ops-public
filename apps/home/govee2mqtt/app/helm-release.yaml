---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app govee2mqtt
  namespace: home
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 15
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      govee2mqtt:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "networking",
                "ips": ["10.3.0.155/24"],
                "mac": "92:cf:d7:05:70:90"
              }]
        containers:
          app:
            env:
              # GOVEE_LAN_NO_MULTICAST: "true"
              # GOVEE_LAN_BROADCAST_ALL: "true"
              # GOVEE_LAN_BROADCAST_GLOBAL: "true"
              # GOVEE_LAN_SCAN: 10.0.0.1,10.0.0.2
              GOVEE_LAN_SCAN: 10.3.0.39,10.3.0.40
              GOVEE_MQTT_HOST: ${SVC_MOSQUITTO_ADDR}
              GOVEE_MQTT_PORT: 1883
              GOVEE_TEMPERATURE_SCALE: F
              RUST_LOG_STYLE: always
              # RUST_LOG: govee=trace
              TZ: ${CLUSTER_TZ}
            # envFrom:
            #   - secretRef:
            #       name: *app
            image:
              repository: ghcr.io/wez/govee2mqtt
              tag: latest@sha256:d5427fa1524e3e6f87c59e5cbc59e782036a2b5274e4f96cfb581d844aa2b6dc
            ports:
              - name: http
                containerPort: &port 8056
                protocol: TCP
            # CPU from 7d of Prometheus data: p50 6.5m, p95 7.6m, max 9.1m — a
            # steady, low poll loop against the Govee LAN/cloud APIs. This
            # container had no CPU request at all, and the namespace LimitRange
            # only defaults ephemeral-storage, so the scheduler was treating it
            # as free. 25m is the request floor and ~3x p95. No CPU limit, per
            # the cluster convention.
            resources:
              requests:
                cpu: 25m
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "govee2mqtt"
          gethomepage.dev/description: "Govee to MQTT bridge for Home Assistant"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "https://govee2mqtt.${SECRET_INTERNAL_DOMAIN}/assets/favicon.ico"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      data:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /data
