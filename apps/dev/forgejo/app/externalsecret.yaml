---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        POSTGRESQL_PASSWORD: |-
          {{ .FORGEJO_POSTGRESQL_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: forgejo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-signing-key
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: forgejo-signing-key
    creationPolicy: Owner
    template:
      data:
        ed25519: |
          {{ .FORGEJO_SIGNING_PRIVATE_KEY }}
        ed25519.pub: |
          {{ .FORGEJO_SIGNING_PUBLIC_KEY }}
  dataFrom:
    - extract:
        key: forgejo
