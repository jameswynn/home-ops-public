---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plausible
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      plausible:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: *app
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: plausible-initdb

          geoip:
            image:
              repository: ghcr.io/maxmind/geoipupdate
              tag: v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
              pullPolicy: IfNotPresent
            restartPolicy: Always
            env:
              GEOIPUPDATE_FREQUENCY: "8"
              GEOIPUPDATE_PRESERVE_FILE_TIMES: "1"
              GEOIPUPDATE_EDITION_IDS: GeoLite2-City
              GEOIPUPDATE_ACCOUNT_ID:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: GEOIPUPDATE_ACCOUNT_ID
              GEOIPUPDATE_LICENSE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: GEOIPUPDATE_LICENSE_KEY
            securityContext:
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - ls
                      - /usr/share/GeoIP/GeoLite2-City.mmdb
                  periodSeconds: 5
        containers:
          app:
            image:
              repository: ghcr.io/plausible/community-edition
              tag: v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
              pullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -eux
                /entrypoint.sh db createdb
                /entrypoint.sh db migrate
                exec /entrypoint.sh run
            env:
              BASE_URL: https://${APP}.${SECRET_INTERNAL_DOMAIN}
              DISABLE_REGISTRATION: invite_only
              CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible_events_db
              IP_GEOLOCATION_DB: /usr/share/GeoIP/GeoLite2-City.mmdb

              MAILER_EMAIL: no-reply@${SECRET_ROOT_DOMAIN}
              MAILER_NAME: Wynning Plausible
              SMTP_HOST_ADDR: smtp.comms.svc.cluster.local
              SMTP_HOST_PORT: "25"
              SMTP_HOST_SSL_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness:
                enabled: true
              readiness:
                enabled: true
            # CPU from 7d of Prometheus data: p50 22.2m, p95 45.8m, max 73.5m
            # — the BEAM scheduler keeps a steady floor and ingest is a
            # continuous trickle rather than bursty, so the p95 is close to
            # the real cost. 100m. No CPU limit, per the cluster convention:
            # throttling the ingest path drops pageview events on the floor.
            resources:
              requests:
                cpu: 100m
                memory: 256M
                ephemeral-storage: 100Mi
              limits:
                memory: 2Gi
                ephemeral-storage: 500Mi
            securityContext:
              readOnlyRootFilesystem: true
        pod:
          terminationGracePeriodSeconds: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 100Mi
      geoip:
        type: emptyDir
        sizeLimit: 200Mi
        globalMounts:
          - path: /usr/share/GeoIP

    service:
      plausible:
        controller: plausible
        ports:
          http:
            port: 8000

    route:
      plausible:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Plausible"
          gethomepage.dev/description: "Analytics"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "plausible.svg"
          gethomepage.dev/weight: "130"
        hostnames:
          - "${APP}.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - name: plausible-anubis
                port: 8080
