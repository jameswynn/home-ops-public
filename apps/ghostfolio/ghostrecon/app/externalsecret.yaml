---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostrecon
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Carries its basic-auth credentials inline.
        SIMPLEFIN_ACCESS_URL: |-
          {{ .SIMPLEFIN_ACCESS_URL }}
        # Admin token — needed to create asset profiles on apply.
        GHOSTFOLIO_API_TOKEN: |-
          {{ .GHOSTFOLIO_API_TOKEN }}
        # Only read because config.yaml configures a `realestate` provider.
        RAPIDAPI_KEY: |-
          {{ .RAPIDAPI_KEY }}
        # API token
        GHOSTRECON_API_TOKEN: |-
          {{ .GHOSTRECON_API_TOKEN }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: ghostrecon
