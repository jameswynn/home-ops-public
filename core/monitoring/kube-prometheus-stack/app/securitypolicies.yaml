---
# Two routes live in this one Kustomization (prometheus + alertmanager) and
# components/forward-auth can only target a single AUTH_ROUTE, so its
# SecurityPolicy is inlined here twice. Keep the spec in step with the component
# (#2075). Grafana, kromgo, ntfy-alertmanager and tempo reach these over the
# cluster Service, not the route, so they are unaffected.
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kube-prometheus-stack-prometheus-forward-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-prometheus-stack-prometheus
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - "X-Forwarded-For" # this is here so we can get the real IP
      - "X-Real-Ip" # Needed to make Anubis happy
      - "accept"
      - "cookie"
      - "authorization"
      - "proxy-authorization"
      - "x-forwarded-proto"
    http:
      backendRefs:
        - kind: Service
          name: ak-outpost-authentik-embedded-outpost
          namespace: authentik
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - "Set-Cookie"
        - "X-authentik-uid"
        - "X-authentik-username"
        - "X-authentik-name"
        - "X-authentik-email"
        - "X-authentik-groups"
        - "X-authentik-entitlements"
        - "Authorization" # set by Authentik when the provider sends HTTP-Basic to the backend
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kube-prometheus-stack-alertmanager-forward-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-prometheus-stack-alertmanager
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - "X-Forwarded-For" # this is here so we can get the real IP
      - "X-Real-Ip" # Needed to make Anubis happy
      - "accept"
      - "cookie"
      - "authorization"
      - "proxy-authorization"
      - "x-forwarded-proto"
    http:
      backendRefs:
        - kind: Service
          name: ak-outpost-authentik-embedded-outpost
          namespace: authentik
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - "Set-Cookie"
        - "X-authentik-uid"
        - "X-authentik-username"
        - "X-authentik-name"
        - "X-authentik-email"
        - "X-authentik-groups"
        - "X-authentik-entitlements"
        - "Authorization" # set by Authentik when the provider sends HTTP-Basic to the backend
