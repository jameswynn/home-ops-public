---
# doco-cd deploy config for the NAS stacks — https://doco.cd
# doco-cd auto-discovers each stack dir under working_dir and reconciles it. The Compose
# project is named after the DIRECTORY, so renaming or deleting one destroys that stack
# (delete: true) — the dirs are deliberately not numbered like docker/vps, to keep the
# project names the stacks had in the old nas-doco repo.
# external_secrets values are Bitwarden Secrets Manager secret UUIDs. The block is global:
# one UUID the machine account can't read fails EVERY stack, so verify new ones first
# (README → Secrets). Prefix names with the app.
working_dir: ./docker/nas
reconciliation:
  enabled: true
auto_discovery:
  enabled: true
  depth: 1
  delete: true
force_recreate: false
external_secrets:
  GARAGE_ADMIN_TOKEN: 198720f9-828b-4116-9255-b4f2014aa8f3
  GARAGE_API_ADMIN_KEY: 443140ed-d5bc-4608-866a-b4f2014a9e00
