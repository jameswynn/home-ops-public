# Anthropic via OAuth bearer token (api.anthropic.com).
# OAuth tokens auth with `Authorization: Bearer` + the oauth beta header and
# must NOT send `x-api-key` — litellm normally forces x-api-key from api_key,
# so we set a placeholder api_key and blank x-api-key in extra_headers.
