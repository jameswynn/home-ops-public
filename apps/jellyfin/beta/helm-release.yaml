---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin-beta
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        type: statefulset
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 44
              - 109
              - 100
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: feature.node.kubernetes.io/intel-gpu
                        operator: In
                        values:
                          - "true"
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      # This prevents jellyfin from trampling Frigate's access to the TPU
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - "frigate"
                  topologyKey: kubernetes.io/hostname
                  # nodeAntiAffinity:
                  #   requiredDuringSchedulingIgnoredDuringExecution:
                  #     nodeSelectorTerms:
                  #       - matchExpressions:
                  #           # This prevents jellyfin from trampling Frigate's access to the TPU
                  #           - key: feature.node.kubernetes.io/coral-tpu
                  #             operator: In
                  #             values:
                  #               - "true"
        containers:
          main:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11
            env:
              TZ: "${CLUSTER_TZ}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_PublishedServerUrl: https://jellyfin-beta.${SECRET_ROOT_DOMAIN}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                # gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1000Mi
              limits:
                # gpu.intel.com/i915: 1
                cpu: 2000m
                memory: 4000Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8096

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Jellyfin BETA"
          gethomepage.dev/description: "Video Entertainment"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: "jellyfin.png"
          gethomepage.dev/weight: "10"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name = jellyfin-beta"
          external-dns.alpha.kubernetes.io/hostname: &hostname "jellyfin-beta.${SECRET_ROOT_DOMAIN}"
        hostnames:
          - *hostname
        parentRefs:
          - name: envoy-towonel
            namespace: networking
          - name: envoy-internal
            namespace: networking
        # tailscale:
        #   hostnames: ["jellyfin.ts.${SECRET_ROOT_DOMAIN}"]
        #   parentRefs:
        #     - name: envoy-tailscale
        #       namespace: networking
        rules:
          - backendRefs:
              - name: jellyfin-beta-anubis
                port: 8080

    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /config
      cache:
        enabled: true
        type: emptyDir
        sizeLimit: 500Mi
        globalMounts:
          - path: /config/cache
      mymedia:
        enabled: true
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /mymedia
            readOnly: true
      mymedia2:
        enabled: true
        type: nfs
        server: ${SECRET_NAS_URL}
        path: /volume1/media
        globalMounts:
          - path: /mymedia2
            readOnly: true
      transcode:
        enabled: true
        type: emptyDir
        sizeLimit: 1Gi
