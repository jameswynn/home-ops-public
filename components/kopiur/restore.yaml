---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${APP}"
spec:
  source:
    fromPolicy:
      name: "${APP}"
  target:
    populator: {}
  policy:
    onMissingSnapshot: Continue
  options:
    enableFileDeletion: true
  mover:
    cache:
      capacity: "${KOPIUR_CACHE_CAPACITY:=5Gi}"
      mode: Persistent
      storageClassName: "${KOPIUR_CACHE_STORAGECLASS:=local-path}"
    podSecurityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
      fsGroup: ${KOPIUR_PGID:=1000}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
