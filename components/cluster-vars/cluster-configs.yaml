  SVC_K8S_GATEWAY_ADDR: "10.11.0.53"
  SVC_MOSQUITTO_ADDR: "10.11.0.202"
  SVC_MINECRAFT_ADDR: "192.168.1.203"
  SVC_MIMIC3_ADDR: "192.168.1.204"
  SVC_AUTHENTIK_LDAP_ADDR: "10.11.0.205"
  SVC_UNIFI_CONTROLLER_ADDR: "10.11.0.206"
  SVC_SYSLOG_ADDR: "10.11.0.207"
  SVC_MINIO_ADDR: "192.168.1.208"
  SVC_POSTGRESQL_ADDR: "10.11.0.209"
  SVC_PRIVATE_1_ADDR: "192.168.1.210"
  SVC_WYOMING_PIPER_ADDR: "10.11.0.211"
  SVC_WYOMING_WHISPER_ADDR: "10.11.0.212"
  SVC_COMPREFACE_ADDR: "192.168.1.213"
  SVC_WYOMING_OPENWAKEWORD_ADDR: "10.11.0.214"
