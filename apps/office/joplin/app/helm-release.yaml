---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app joplin
  namespace: office
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        pod:
          annotations:
            secret.reloader.stakater.com/reload: *app
          nodeSelector:
            kubernetes.io/arch: "amd64"
        containers:
          main:
            image:
              repository: mirror.gcr.io/joplin/server
              tag: 3.7.1
            env:
              - name: APP_BASE_URL
                value: https://joplin.${SECRET_ROOT_DOMAIN}
              - name: APP_PORT
                value: &port 8080
              - name: DB_CLIENT
                value: pg
              - name: MAILER_ENABLED
                value: 1
              - name: MAILER_HOST
                value: smtp.comms.svc.cluster.local
              - name: MAILER_PORT
                value: 25
              - name: MAILER_NOREPLY_NAME
                value: JoplinServer
              - name: MAILER_NOREPLY_EMAIL
                value: no-reply@${SECRET_ROOT_DOMAIN}
            envFrom:
              - secretRef:
                  name: *app
            # CPU from 7d of Prometheus data: p50 9m, p95 10m, max 12m. 50m is 5x
            # p95 and 4x the observed max. No CPU limit, per the cluster convention.
            resources:
              requests:
                cpu: 50m
                memory: 200Mi
                ephemeral-storage: 200Mi
              limits:
                memory: 500Mi
                ephemeral-storage: 200Mi
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: joplin-init-db
                  # env:
                  #   - name: INIT_POSTGRES_HOST
                  #     value: "${SVC_POSTGRES_HOST}"
                  #   - name: INIT_POSTGRES_SUPER_PASS
                  #     value: "${SECRET_POSTGRES_SUPERUSER_PASSWORD}"
                  #   - name: INIT_POSTGRES_DBNAME
                  #     valueFrom:
                  #       secretKeyRef:
                  #         name: *app
                  #         key: POSTGRES_DATABASE
                  #   - name: INIT_POSTGRES_USER
                  #     valueFrom:
                  #       secretKeyRef:
                  #         name: *app
                  #         key: POSTGRES_USER
                  #   - name: INIT_POSTGRES_PASS
                  #     valueFrom:
                  #       secretKeyRef:
                  #         name: *app
                  #         key: POSTGRES_PASSWORD

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "joplin"
          gethomepage.dev/description: "Note management"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "joplin.png"
          gethomepage.dev/weight: "20"
          external-dns.alpha.kubernetes.io/hostname: "joplin.${SECRET_ROOT_DOMAIN}"
        hostnames:
          - "joplin.${SECRET_ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-towonel
            namespace: networking
          - name: envoy-internal
            namespace: networking
