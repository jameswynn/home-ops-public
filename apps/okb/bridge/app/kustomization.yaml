---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
  - ocirepository.yaml
configMapGenerator:
  - name: okb-bridge-scripts
    files:
      - git-sync.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # git-sync.sh is full of shell ${VARS}; Flux postBuild must not touch them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
