---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-web
  annotations:
    # The sidecar builds the probe URL from the first hostname, which here is a
    # wildcard — "https://*.web.<domain>" is not resolvable, so the check errored
    # rather than failed. Pin the concrete host. Garage's web endpoint answers 404
    # for a host with no matching bucket, which is the healthy response; the body
    # assertion distinguishes that from Envoy's own no-route 404 (empty body), so
    # the check still fails if the route is removed.
    gatus.home-operations.com/endpoint: |-
      url: https://web.${SECRET_INTERNAL_DOMAIN}
      conditions:
        - "[STATUS] == 404"
        - "[BODY] == pat(*404 Not Found*)"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: networking
  hostnames:
    - "*.web.${SECRET_INTERNAL_DOMAIN}"
    - "web.${SECRET_INTERNAL_DOMAIN}"
  rules:
    - backendRefs:
        - name: garage-cluster
          port: 3902
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-s3
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 403"]
spec:
  parentRefs:
    - name: envoy-internal
      namespace: networking
  hostnames:
    - "s3.${SECRET_INTERNAL_DOMAIN}"
  rules:
    - backendRefs:
        - name: garage-cluster
          port: 3900
