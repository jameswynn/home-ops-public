---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/perfectra1n/kubesearch-mcp:master@sha256:b8efc3b8a280a33779cf5e2460bebe340a4178fc87316b527dcd04821b2aa9e6
  transport: streamable-http
  mcpPort: 3000
  groupRef:
    name: all
  env:
    - name: KUBESEARCH_REFRESH_HOURS
      value: "24"
  podTemplateSpec:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: mcp
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi
