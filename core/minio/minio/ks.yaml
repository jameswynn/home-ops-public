---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio-backupjob
  namespace: minio
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./core/minio/minio/backupjob
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
