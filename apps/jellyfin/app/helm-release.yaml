---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        # type: statefulset
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 44
              - 109
              - 100
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: feature.node.kubernetes.io/intel-gpu
                        operator: In
                        values:
                          - "true"
                      - key: feature.node.kubernetes.io/coral-tpu
                        operator: DoesNotExist
        containers:
          main:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11
            env:
              TZ: "${CLUSTER_TZ}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              # JELLYFIN_PublishedServerUrl: https://jellyfin.${SECRET_ROOT_DOMAIN}
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   readOnlyRootFilesystem: true
            #   capabilities: { drop: [ "ALL" ] }
            # CPU from 7d of Prometheus data: p50 4.3m, p95 26.4m, max 221m.
            # Transcoding is offloaded to the i915 GPU, so even playback keeps
            # the CPU modest and the existing 100m request already fits — it
            # stays as-is. No CPU limit, per the cluster convention: a
            # software-transcode fallback must not be throttled into stutter.
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1000Mi
                ephemeral-storage: 2000Mi
              limits:
                gpu.intel.com/i915: 1
                memory: 4000Mi
                ephemeral-storage: 5000Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8096

    route:
      main:
        # annotations:
        #   gethomepage.dev/enabled: "true"
        #   gethomepage.dev/name: "Jellyfin"
        #   gethomepage.dev/description: "Video Entertainment"
        #   gethomepage.dev/group: "Media"
        #   gethomepage.dev/icon: "jellyfin.png"
        #   gethomepage.dev/weight: "10"
        #   gethomepage.dev/pod-selector: "app.kubernetes.io/name = jellyfin"
        hostnames:
          - jellyfin.wynning.tech
        parentRefs:
          - name: envoy-internal
            namespace: networking
          - name: envoy-towonel
            namespace: networking
        rules:
          - backendRefs:
              - name: jellyfin-anubis
                port: 8080
      internal:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Jellyfin"
          gethomepage.dev/description: "Video Entertainment"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: "jellyfin.png"
          gethomepage.dev/weight: "10"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name = jellyfin"
          external-dns.alpha.kubernetes.io/hostname: &hostname "jellyfin.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *hostname
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      config:
        enabled: true
        existingClaim: pvc-jellyfin
        globalMounts:
          - path: /config
      cache:
        enabled: true
        type: emptyDir
        sizeLimit: 500Mi
        globalMounts:
          - path: /config/cache
      mymedia:
        enabled: true
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /mymedia
            readOnly: true
      mymedia2:
        enabled: true
        type: nfs
        server: ${SECRET_NAS_URL}
        path: /volume1/media
        globalMounts:
          - path: /mymedia2
            readOnly: true
      transcode:
        enabled: true
        type: emptyDir
        sizeLimit: 5Gi
