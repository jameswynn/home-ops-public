---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-secrets
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: toolhive-secrets
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # VirtualMCPServer embedding — dedicated LiteLLM virtual key
        LITELLM_API_KEY: |-
          {{ .LITELLM_API_KEY }}
        # Remote MCP server credentials
        CONTEXT7_API_KEY: |-
          {{ .CONTEXT7_API_KEY }}
        GITHUB_PERSONAL_ACCESS_TOKEN: |-
          {{ .GITHUB_PERSONAL_ACCESS_TOKEN }}
        GHOSTFOLIO_TOKEN: |-
          {{ .GHOSTFOLIO_TOKEN }}
        # Actual Budget MCP uses the existing Actual server password. The
        # actual-budget item is extracted below alongside toolhive-mcp.
        ACTUAL_PASSWORD: |-
          {{ .ACTUAL_BUDGET_PASSWORD }}
        # Per-Hermes-profile Forgejo service accounts (#1561), not James's PAT
        HEPHAESTUS_FORGEJO_PAT: |-
          {{ .HEPHAESTUS_FORGEJO_PAT }}
        ROBERTO_FORGEJO_PAT: |-
          {{ .ROBERTO_FORGEJO_PAT }}
        GRAFANA_API_KEY: |-
          {{ .GRAFANA_API_KEY }}
        HOMEASSISTANT_API_TOKEN: |-
          {{ .HOMEASSISTANT_API_TOKEN }}
        # A dedicated Joplin Server account for the MCP client, not the
        # personal one: Joplin Server has no read-only account role, so this
        # credential can write even though the exposed tools cannot.
        JOPLIN_USERNAME: |-
          {{ .JOPLIN_USERNAME }}
        JOPLIN_PASSWORD: |-
          {{ .JOPLIN_PASSWORD }}
        KARAKEEP_API_KEY: |-
          {{ .KARAKEEP_API_KEY }}
        # Nextcloud DAV service-account credentials for the caldav/carddav MCP
        # backends (#1551/#1552). One dedicated Nextcloud app password per
        # backend, so either can be revoked in Nextcloud → Security → Devices &
        # sessions without disturbing the other. These are NOT the nextcloud
        # admin credentials — that Bitwarden item is deliberately not extracted
        # into this namespace. See CALDAV-CARDDAV.md for how to scope the
        # account down to just the calendars/address books it should reach.
        NEXTCLOUD_CALDAV_USERNAME: |-
          {{ .NEXTCLOUD_CALDAV_USERNAME }}
        NEXTCLOUD_CALDAV_APP_PASSWORD: |-
          {{ .NEXTCLOUD_CALDAV_APP_PASSWORD }}
        NEXTCLOUD_CARDDAV_USERNAME: |-
          {{ .NEXTCLOUD_CARDDAV_USERNAME }}
        NEXTCLOUD_CARDDAV_APP_PASSWORD: |-
          {{ .NEXTCLOUD_CARDDAV_APP_PASSWORD }}
        # Koffan shopping-list API token — sourced from the koffan Bitwarden
        # item (same item the default/koffan ExternalSecret uses).
        KOFFAN_API_TOKEN: |-
          {{ .KOFFAN_API_TOKEN }}
        # Per-persona Memini API keys (raw, from toolhive-mcp Bitwarden item)
        MEMINI_ZUG_API_KEY: |-
          {{ .MEMINI_ZUG_API_KEY }}
        MEMINI_ANTON_API_KEY: |-
          {{ .MEMINI_ANTON_API_KEY }}
        MEMINI_JONATHON_API_KEY: |-
          {{ .MEMINI_JONATHON_API_KEY }}
        MEMINI_CAROL_API_KEY: |-
          {{ .MEMINI_CAROL_API_KEY }}
        MEMINI_HEPHAESTUS_API_KEY: |-
          {{ .MEMINI_HEPHAESTUS_API_KEY }}
        MEMINI_ROBERTO_API_KEY: |-
          {{ .MEMINI_ROBERTO_API_KEY }}
        MEMINI_SAGAN_API_KEY: |-
          {{ .MEMINI_SAGAN_API_KEY }}
        # Pre-formatted Authorization header values for ToolHive headerForward injection
        MEMINI_ZUG_AUTHORIZATION: |-
          Bearer {{ .MEMINI_ZUG_API_KEY }}
        MEMINI_ANTON_AUTHORIZATION: |-
          Bearer {{ .MEMINI_ANTON_API_KEY }}
        MEMINI_JONATHON_AUTHORIZATION: |-
          Bearer {{ .MEMINI_JONATHON_API_KEY }}
        MEMINI_CAROL_AUTHORIZATION: |-
          Bearer {{ .MEMINI_CAROL_API_KEY }}
        MEMINI_HEPHAESTUS_AUTHORIZATION: |-
          Bearer {{ .MEMINI_HEPHAESTUS_API_KEY }}
        MEMINI_ROBERTO_AUTHORIZATION: |-
          Bearer {{ .MEMINI_ROBERTO_API_KEY }}
        MEMINI_SAGAN_AUTHORIZATION: |-
          Bearer {{ .MEMINI_SAGAN_API_KEY }}
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: toolhive-mcp
    - extract:
        key: actual-budget
    - extract:
        key: koffan
