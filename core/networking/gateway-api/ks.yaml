---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: networking
  labels:
    # The bundle is upstream YAML with no `${...}` in it, so envsubst has nothing
    # to do over 1.4MB of CRD schema. Opting out also means a `${...}` appearing
    # in a future upstream CEL rule or description can't be silently blanked.
    disable-global-substitutions: "true"
    disable-global-decryption: "true"
spec:
  # Deliberately no targetNamespace: everything the bundle ships (13 CRDs plus a
  # ValidatingAdmissionPolicy and its Binding) is cluster-scoped, and stamping a
  # namespace onto those is rejected by the API server.
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./core/networking/gateway-api/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
