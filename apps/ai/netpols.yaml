---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: ai-namespace-policy
  namespace: &namespace ai
spec:
  endpointSelector: {}
  ingress:
    # Allow ingress from envoy-gateway in the networking namespace.
    # TODO: tighten gateway.networking.k8s.io/gateway-name match if you want to scope
    # this to only envoy-internal or only envoy-towonel rather than both.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            "k8s:io.kubernetes.pod.namespace": networking

    # Allow intra-namespace traffic (pod-to-pod within this namespace)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": *namespace

  # TODO: if Prometheus needs to scrape this namespace, uncomment:
  # - fromEndpoints:
  #     - matchLabels:
  #         app.kubernetes.io/name: prometheus
  #         "k8s:io.kubernetes.pod.namespace": monitoring

  egress:
    # Allow intra-namespace traffic
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": *namespace

    # Actual Budget MCP server -> the Actual API at actual.actual.svc:5006.
    #
    # This file is not currently applied (it is commented out of
    # apps/ai/kustomization.yaml), so the rule is inert today and ai pods reach
    # actual by default-allow. It exists now because this egress block is
    # deny-by-default the moment the file is uncommented, and the failure mode
    # then is MCP calls hanging until they time out rather than erroring —
    # exactly the kind of break that gets blamed on the MCP server.
    #
    # The matching ingress rule lives in apps/actual/netpols.yaml.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": actual
      toPorts:
        - ports:
            - port: "5006"
              protocol: TCP

    # Allow DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

  # # TODO: uncomment if this app needs to reach the public internet
  # - toEntities:
  #     - world
