---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux
  namespace: flux-system
spec:
  groups:
    - name: flux.rules
      rules:
        # - alert: FluxInstanceAbsent
        #   expr: |
        #     absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
        #   for: 5m
        #   annotations:
        #     summary: >-
        #       Flux instance metric is missing
        #   labels:
        #     severity: critical

        # - alert: FluxInstanceNotReady
        #   expr: |
        #     flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
        #   for: 5m
        #   annotations:
        #     summary: >-
        #       Flux instance {{ $labels.name }} is not ready
        #   labels:
        #     severity: critical
        - alert: FluxReconciliationFailure
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} reconciliation has been failing for more than 15 minutes.
          expr: |
            max(gotk_reconcile_condition{status="False",type="Ready"}) by (namespace, name, kind)
              +
            on(namespace, name, kind) (max(gotk_reconcile_condition{status="Deleted"})
              by (namespace, name, kind)) * 2 == 1
          for: 15m
          labels:
            severity: critical
