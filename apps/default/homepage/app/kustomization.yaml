---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - httproute.yaml
configMapGenerator:
  - name: homepage
    files:
      - config/bookmarks.yaml
      - config/services.yaml
      - config/settings.yaml
      - config/widgets.yaml
      - config/docker.yaml
      - config/kubernetes.yaml
namespace: default
generatorOptions:
  disableNameSuffixHash: true
