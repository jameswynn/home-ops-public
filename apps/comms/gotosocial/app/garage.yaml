---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagebucket_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: gotosocial
spec:
  clusterRef:
    name: garage-nas
    namespace: default
  quotas:
    maxSize: 100Gi
  globalAlias: gotosocial
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagekey_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: gotosocial
spec:
  clusterRef:
    name: garage-nas
    namespace: default
  importKey:
    secretRef:
      name: gotosocial
    accessKeyIdKey: GARAGE_ACCESS_KEY
    secretAccessKeyKey: GARAGE_SECRET_KEY
  # Output must not reuse the import Secret's name. Defaulting to the CR name
  # made the operator treat the ExternalSecret-owned comms/gotosocial (which
  # GtS reads its GTS_STORAGE_S3_* from) as its own generated Secret, and every
  # reconcile failed: "refusing to mark previous Secret comms/gotosocial because
  # it is not controlled by GarageKey". Nothing consumes this output Secret.
  secretTemplate:
    name: gotosocial-garage-key
  bucketPermissions:
    - bucketRef:
        name: gotosocial
      read: true
      write: true
