---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: joplin
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        POSTGRES_CONNECTION_STRING: |-
          postgresql://{{ .JOPLIN_POSTGRES_USERNAME }}:{{ .JOPLIN_POSTGRES_PASSWORD }}@${SVC_POSTGRES_HOST}:${SVC_POSTGRES_PORT}/{{ .JOPLIN_POSTGRES_DATABASE }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: joplin
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: joplin-init-db
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        INIT_POSTGRES_HOST: "${SVC_POSTGRES_HOST}"
        INIT_POSTGRES_SUPER_PASS: |-
          {{ .POSTGRES_SUPERUSER_PASSWORD }}
        INIT_POSTGRES_DBNAME: |-
          {{ .JOPLIN_POSTGRES_DATABASE }}
        INIT_POSTGRES_USER: |-
          {{ .JOPLIN_POSTGRES_USERNAME }}
        INIT_POSTGRES_PASS: |-
          {{ .JOPLIN_POSTGRES_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: joplin
    - extract:
        key: postgresql
