---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Break-glass admin bearer token. `|-` matters: a trailing newline here
        # ends up in the Authorization header and every request 401s.
        MEMINI_API_KEY: |-
          {{ .MEMINI_API_KEY }}
        # Virtual key for the litellm proxy (embeddings model bge-small-en-v1.5).
        MEMINI_EMBED_API_KEY: |-
          {{ .MEMINI_EMBED_API_KEY }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: memini
