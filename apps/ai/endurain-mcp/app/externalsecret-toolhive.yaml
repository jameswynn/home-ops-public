---
# ToolHive injects this pre-formatted header when it calls the backend.
# The raw token remains in the separate application Secret and in BWS only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endurain-mcp-toolhive
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: endurain-mcp-toolhive
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        ENDURAIN_MCP_AUTHORIZATION: "Bearer {{ .ENDURAIN_MCP_AUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: endurain-mcp
