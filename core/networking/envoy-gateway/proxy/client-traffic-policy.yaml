---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
spec:
  headers:
    earlyRequestHeaders:
      set:
        - name: X-Real-Ip
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
      #trustedCIDRs:
      #  - 10.44.0.0/16
  path:
    disableMergeSlashes: true
    escapedSlashesAction: KeepUnchanged
  http2:
    onInvalidMessage: TerminateStream
  # No HTTP/3. Every hostname here is also published through the towonel edge,
  # which is TCP-only (SNI passthrough, no UDP/443 on heimdall). With h3 on,
  # envoy-internal sends `alt-svc: h3=":443"; ma=86400`; browsers cache that per
  # origin, so a phone that used auth.wynning.tech at home then tries QUIC against
  # the public IP from cellular and hangs (Firefox especially). Found 2026-11-03.
  targetSelectors:
    # Exclude envoy-towonel — it has its own ClientTrafficPolicy that adds PROXY protocol.
    - group: gateway.networking.k8s.io
      kind: Gateway
      matchExpressions:
        - key: network
          operator: NotIn
          values:
            - towonel
  tcpKeepalive: {}
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
