---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app frigate
  namespace: &namespace home
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  # dependsOn:
  #   - name: intel-gpu-plugin
  #     namespace: kube-system
  #   - name: node-feature-discovery
  #     namespace: kube-system
  path: ./apps/home/frigate/app
  components:
    - ../../../../components/forward-auth
    - ../../../../components/nfs-scaler
  postBuild:
    substitute:
      APP: *app
      AUTH_ROUTE: frigate-app
      NFS_SCALAR_CONTROLLER: StatefulSet
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
