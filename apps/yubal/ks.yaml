---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app yubal
  namespace: &namespace yubal
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  components:
    - ../../../components/kopiur
    - ../../../components/nfs-scaler
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./apps/yubal/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
