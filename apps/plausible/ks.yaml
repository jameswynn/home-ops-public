---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plausible
  namespace: &namespace plausible
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./apps/plausible/app
  components:
    - ../../../components/anubis
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: *namespace
      ANUBIS_TARGET: http://plausible:8000
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plausible-clickhouse
  namespace: &namespace plausible
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./apps/plausible/clickhouse
  postBuild:
    substitute:
      APP: clickhouse
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
