---
# Credentials are kept in the Bitwarden Secrets Manager item `endurain-mcp`.
# Required fields: ENDURAIN_USERNAME, ENDURAIN_PASSWORD,
# ENDURAIN_MCP_AUTH_TOKEN (a random value of at least 32 characters).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endurain-mcp
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: endurain-mcp
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        ENDURAIN_USERNAME: "{{ .ENDURAIN_USERNAME }}"
        ENDURAIN_PASSWORD: "{{ .ENDURAIN_PASSWORD }}"
        ENDURAIN_MCP_AUTH_TOKEN: "{{ .ENDURAIN_MCP_AUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: endurain-mcp
