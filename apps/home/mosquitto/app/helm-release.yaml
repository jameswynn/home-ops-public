---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        # initContainers:
        #   init-config:
        #     image:
        #       repository: public.ecr.aws/docker/library/eclipse-mosquitto
        #       tag: 2.0.21@sha256:94f5a3d7deafa59fa3440d227ddad558f59d293c612138de841eec61bfa4d353
        #     command: ["/bin/sh", "-c"]
        #     args:
        #       - |
        #         cp /tmp/secret/mosquitto_pwd /mosquitto/external_config/;
        #         chmod 600 /mosquitto/external_config/mosquitto_pwd;
        #         mosquitto_passwd -U /mosquitto/external_config/mosquitto_pwd;
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            # CPU from 7d of Prometheus data: p50 0.6m, p95 0.7m, max 0.9m —
            # the flattest series in the cluster; brokering MQTT for the house
            # is almost free. 25m is the practical request floor. No CPU limit,
            # per the cluster convention.
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
                ephemeral-storage: 100Mi
              limits:
                memory: 64Mi
                ephemeral-storage: 100Mi
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: LoadBalancer
        loadBalancerIP: ${SVC_MOSQUITTO_ADDR}
        annotations:
          internal.wynning.tech/hostname: "mqtt.${SECRET_INTERNAL_DOMAIN}"
        ports:
          http:
            port: 1883
    persistence:
      data:
        existingClaim: mosquitto-data
      config-file:
        type: configMap
        name: mosquitto-configmap
        advancedMounts:
          main:
            main:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf
                readOnly: true
      # secret-file:
      #   type: secret
      #   name: mosquitto-secret
      #   advancedMounts:
      #     mosquitto:
      #       init-config:
      #         - path: /tmp/secret/mosquitto_pwd
      #           subPath: mosquitto_pwd
      #           readOnly: true
      external-config:
        type: emptyDir
        sizeLimit: 10Mi
        globalMounts:
          - path: /mosquitto/external_config
    # image:
    #   repository: eclipse-mosquitto
    #   tag: 2.0.21

    # resources:
    #   requests:
    #     memory: 100Mi
    #     cpu: 10m
    #   limits:
    #     memory: 200Mi
    #     cpu: 300m

    # tolerations:
    #   - key: "arm"
    #     operator: "Exists"
    #     effect: "NoSchedule"

