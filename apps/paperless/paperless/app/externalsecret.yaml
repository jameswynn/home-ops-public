---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secrets
  namespace: paperless
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        PAPERLESS_DBHOST: |-
          ${SVC_POSTGRES_HOST}
        PAPERLESS_DBNAME: |-
          {{ .PAPERLESS_POSTGRESQL_DATABASE_NAME }}
        PAPERLESS_DBUSER: |-
          {{ .PAPERLESS_POSTGRESQL_DATABASE_USERNAME }}
        PAPERLESS_DBPASS: |-
          {{ .PAPERLESS_POSTGRESQL_DATABASE_PASSWORD }}
        PAPERLESS_ADMIN_USER: |-
          {{ .PAPERLESS_ADMIN_USER }}
        PAPERLESS_ADMIN_PASSWORD: |-
          {{ .PAPERLESS_ADMIN_PASSWORD }}
        PAPERLESS_SECRET_KEY: |-
          {{ .PAPERLESS_SECRET_KEY }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: paperless
