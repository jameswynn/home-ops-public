---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel
  namespace: &namespace monitoring
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./core/monitoring/otel/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: opentelemetry-operator
      namespace: *namespace
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-collector
  namespace: &namespace monitoring
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: otel
  path: ./core/monitoring/otel/collector
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
