---
# Headless-style Service with no selector — a stable in-cluster name/port
# that the HTTPRoute targets. Backed by the EndpointSlice below, which
# pins the off-cluster LM Studio host.
apiVersion: v1
kind: Service
metadata:
  name: lmstudio
spec:
  ports:
    - name: http
      port: 1234
      targetPort: 1234
---
# Manually-managed endpoints pointing at the off-cluster LM Studio host.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lmstudio
  labels:
    kubernetes.io/service-name: lmstudio
addressType: IPv4
ports:
  - name: http
    port: 1234
    protocol: TCP
endpoints:
  - addresses:
      - 10.10.2.26
