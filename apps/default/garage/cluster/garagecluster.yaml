---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagecluster_v1beta2.json
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-cluster
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  zone: us-east-1
  replication:
    factor: 3
  storage:
    replicas: 3
    resources:
      requests:
        cpu: 15m
    # muspelheim's etcd WAL sits on a DRAM-less Crucial BX500 sharing one LVM VG
    # with the Longhorn replica store. Keep new replicas off that node when
    # possible; local-path PVCs retain their own node affinity.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - muspelheim
    metadata:
      type: PersistentVolumeClaim
      size: 1Gi
      storageClassName: local-path
    data:
      type: PersistentVolumeClaim
      size: 20Gi
      storageClassName: local-path
  network:
    rpcBindPort: 3901
    service:
      type: ClusterIP
  admin:
    # enabled: true
    bindPort: 3903
    adminTokenSecretRef:
      name: garage
      key: GARAGE_ADMIN_TOKEN
  webApi:
    rootDomain: ".web.${SECRET_INTERNAL_DOMAIN}"
  imageRepository: mirror.gcr.io/dxflrs
