---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app eurooffice
  namespace: &namespace office
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./apps/office/eurooffice/app
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: eurooffice-data
      KOPIUR_CAPACITY: 2Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # wait: true would also wait on the kopiur Restore, which stays Reconciling
  # until a PVC claims it; gate on the HelmRelease only.
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
