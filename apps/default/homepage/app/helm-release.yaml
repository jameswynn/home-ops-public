---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: homepage
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 2.1.0
  url: oci://ocharted.wynning.tech/jameswynn.github.io/helm-charts/homepage
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
  # namespace: default
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: homepage
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    image:
      # repository: ghcr.io/gethomepage/homepage
      # tag: v1.0.3
      # repository: ghcr.io/jameswynn/homepage
      # tag: kubernetes
      # repository: gitea.${SECRET_INTERNAL_DOMAIN}/james/homepage
      # tag: kubernetes-20
      pullPolicy: IfNotPresent

    config:
      useExistingConfigMap: homepage

    controller:
      annotations:
        # config lives in the generated `homepage` ConfigMap (see kustomization.yaml),
        # which the chart mounts via useExistingConfigMap — so no values checksum covers
        # it and Flux updates to settings.yaml never restart the pod on their own.
        # Without this the Longhorn widget fix in #1386 sat inert until a manual restart.
        configmap.reloader.stakater.com/reload: *app
        secret.reloader.stakater.com/reload: *app

    # affinity:
    #   nodeAffinity:
    #     requiredDuringSchedulingIgnoredDuringExecution:
    #       nodeSelectorTerms:
    #         - matchExpressions:
    #             - key: beta.kubernetes.io/arch
    #               operator: In
    #               values:
    #                 - amd64
    serviceAccount:
      create: true
      name: *app

    enableRbac: true

    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000

    env:
      PUID: 1000
      GUID: 1000
      HOMEPAGE_ALLOWED_HOSTS: start.${SECRET_INTERNAL_DOMAIN}

    # CPU from 7d of Prometheus data: p50 0m, p95 0m, p99 12m, max 39m (the
    # tail is the widget refresh fanning out to every backend). The old 1m
    # request was too low to schedule honestly. 25m is the practical request
    # floor. No CPU limit, per the cluster convention.
    resources:
      requests:
        memory: 10Mi
        cpu: 25m
        ephemeral-storage: 10Mi
      limits:
        memory: 500Mi
        ephemeral-storage: 20Mi
