---
doublestar: true
# Encrypted secrets are byte-sensitive: reformatting them churns the SOPS MAC.
# The Gateway API bundle is vendored verbatim from an upstream release asset —
# reformatting it would make `curl <url> | diff -` useless for verifying it.
exclude:
  - "**/?*.sops.yaml"
  - "core/networking/gateway-api/app/experimental-install.yaml"
formatter:
  type: basic
  disable_alias_key_correction: false
  drop_merge_tag: true
  eof_newline: true
  force_array_style: block
  include_document_start: true
  line_ending: lf
  retain_line_breaks_single: true
  scan_folded_as_literal: true
  trim_trailing_whitespace: false
