---
# Bitwarden Secrets Manager item `agent-router`. Required fields:
#   AGENT_ROUTER_API_KEY  inbound bearer key for MCP clients
#                         (`openssl rand -hex 32`; printable ASCII, no spaces)
#   HA_TOKEN              long-lived access token of a dedicated non-admin
#                         Home Assistant user
#   MATRIX_ACCESS_TOKEN   access token of the Matrix account agent-router posts
#                         as (already joined to the rooms below)
#   MATRIX_ROOM_SAGAN, MATRIX_ROOM_SAGAN_RESPONDER,
#   MATRIX_ROOM_JONATHON, MATRIX_ROOM_JONATHON_RESPONDER
#                         each agent's room ID and Matrix ID; templated into config.yaml
#                         so they stay out of git (they are not secrets to the app)
#
# config.yaml holds no secret values: each *_env field names one of the keys
# above, which the HelmRelease injects as env vars (agent-router ADR-0002).
# It is rendered here so the config and the secrets it names change together.
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-router
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: agent-router
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        AGENT_ROUTER_API_KEY: "{{ .AGENT_ROUTER_API_KEY }}"
        HA_TOKEN: "{{ .HA_TOKEN }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        config.yaml: |-
          server:
            api_key_env: AGENT_ROUTER_API_KEY
          agents:
            - name: Jarvis
              description: Home Assistant voice agent
              type: homeassistant
              url: http://home-assistant-main.home.svc.cluster.local:8123
              token_env: HA_TOKEN
              timeout: 30
            # Synchronous via his Matrix room, like Sagan: returns Jonathon's reply,
            # or `accepted` after `wait`.
            - name: Jonathon
              description: Hermes secretary profile
              type: matrix
              homeserver: https://matrix.${SECRET_ROOT_DOMAIN}
              room_id: "{{ .MATRIX_ROOM_JONATHON }}"
              responder: "{{ .MATRIX_ROOM_JONATHON_RESPONDER }}"
              token_env: MATRIX_ACCESS_TOKEN
              wait: 55
              quiet: 3
            # Synchronous: posts in Sagan's room and returns Sagan's reply, or
            # `accepted` after `wait`. Research answers take ~50s; 55 stays under
            # both the Pebble app's 60s MCP call timeout and the gateway's 60s.
            - name: Sagan
              description: Hermes research profile
              type: matrix
              homeserver: https://matrix.${SECRET_ROOT_DOMAIN}
              room_id: "{{ .MATRIX_ROOM_SAGAN }}"
              responder: "{{ .MATRIX_ROOM_SAGAN_RESPONDER }}"
              token_env: MATRIX_ACCESS_TOKEN
              wait: 55
              quiet: 3
  dataFrom:
    - extract:
        key: agent-router
