---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/argoproj.io/eventbus_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
spec:
  jetstream:
    # Must match a version key in the argo-events controller-config ConfigMap.
    version: "2.10.10"
    replicas: 3
    containerTemplate:
      resources:
        requests:
          cpu: 10m
