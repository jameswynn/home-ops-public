---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagereferencegrant_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: comms
  namespace: default
spec:
  from:
    - kind: GarageBucket
      namespace: comms
    - kind: GarageKey
      namespace: comms
  to:
    - kind: GarageCluster
      name: garage-nas
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagereferencegrant_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: renovate
  namespace: default
spec:
  from:
    - kind: GarageBucket
      namespace: renovate
    - kind: GarageKey
      namespace: default
    # apps/renovate/renovate/jobs/garage.yaml defines GarageKey renovate-cache
    # in renovate; without this it fails with "cross-namespace reference ... not
    # permitted" (failing since 2026-10-16).
    - kind: GarageKey
      namespace: renovate
  to:
    - kind: GarageCluster
      name: garage-nas
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagereferencegrant_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: monitoring
  namespace: default
spec:
  from:
    - kind: GarageBucket
      namespace: monitoring
    - kind: GarageKey
      namespace: default
    # core/monitoring/{loki,tempo}/app/garage.yaml define their GarageKeys in
    # monitoring; without this the keys never go Ready and the loki
    # Kustomization's health check (and everything dependsOn it) stalls.
    - kind: GarageKey
      namespace: monitoring
  to:
    - kind: GarageCluster
      name: garage-nas
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagereferencegrant_v1beta1.json
# core/networking/mikrotik-backup (#2322): router config backups.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: networking
  namespace: default
spec:
  from:
    - kind: GarageBucket
      namespace: networking
    - kind: GarageKey
      namespace: networking
  to:
    - kind: GarageCluster
      name: garage-nas
