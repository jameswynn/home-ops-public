---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: argo-events
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 2.4.24
  url: oci://ocharted.wynning.tech/argoproj.github.io/argo-helm/argo-events
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app argo-events
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: argo-events
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      install: true
      keep: false
    controller:
      rbac:
        enabled: true
        namespaced: false
      metrics:
        enabled: false
      # CPU from 7d of Prometheus data: p50 1m, p95 1.1m, max 1.9m. Same story
      # as the workflows controller: the limit was raised 50m -> 500m for burst
      # throttling and still clips 2.4% of CFS periods, so it goes away
      # entirely. 25m is the practical request floor.
      resources:
        requests:
          cpu: 25m
          memory: 50M
        limits:
          memory: 200M
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
