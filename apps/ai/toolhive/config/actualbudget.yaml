---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/toolhive.stacklok.dev/mcpserver_v1beta1.json
# Actual Budget MCP backend for Anton's accountant profile.
# The backend is included in the authenticated unified VMCP; Cedar below grants
# these tools only to toolhive-accountant.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: actualbudget
spec:
  image: docker.io/agigante80/actual-mcp-server:0.30.0@sha256:3e769885aea195eb1287a9f2a360f25cf6d1f33a3be54b5985c7b7a9aba5c010
  transport: streamable-http
  mcpPort: &port 3600
  groupRef:
    name: all
  env:
    - name: ACTUAL_SERVER_URL
      value: http://actual.actual.svc.cluster.local:5006
    - name: ACTUAL_BUDGET_SYNC_ID
      value: 4614fccc-5e18-4e2c-8dfc-02557cbba72c
    - name: MCP_BRIDGE_DATA_DIR
      value: /data
    - name: MCP_BRIDGE_PORT
      value: "3600"
    # ToolHive expects its standard /mcp endpoint; the image defaults to /http.
    - name: MCP_HTTP_PATH
      value: /mcp
    # ToolHive's generic health probe opens an MCP session. Actual keeps those
    # sessions until its idle sweep, so use a shorter backend idle lifetime to
    # prevent probes from exhausting the bridge's session pool.
    - name: SESSION_IDLE_TIMEOUT_MINUTES
      value: "2"
    - name: MCP_ALLOW_UNAUTHENTICATED
      value: "true"
    # Since 0.25.0 (upstream #612) the HTTP transport rejects any request whose
    # Host header it was not told about, and in open mode (above) that list is
    # loopback plus whatever is here. ToolHive's proxy reaches this pod through
    # its Service, so without this every request got a 403 and the backend log
    # filled with "hostname not allowed (DNS rebinding protection, #612)" while
    # the MCPServer still reported Ready. Bare hostnames only: no port, scheme
    # or wildcard. The proxy actually sends the mcp-actualbudget ClusterIP as
    # Host (observed after the name-only list went live), so the IP is listed
    # too; it is stable for the Service's lifetime but must be updated if the
    # Service is ever recreated. The names cover clients that use DNS.
    - name: MCP_ALLOWED_HOSTS
      value: 10.43.184.43,mcp-actualbudget,mcp-actualbudget.ai,mcp-actualbudget.ai.svc,mcp-actualbudget.ai.svc.cluster.local
  secrets:
    - name: toolhive-secrets
      key: ACTUAL_PASSWORD
  podTemplateSpec:
    spec:
      tolerations:
        - key: arm
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actualbudget-mcp-data
      containers:
        - name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
---
