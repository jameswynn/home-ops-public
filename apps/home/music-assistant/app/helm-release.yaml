---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        pod:
          nodeSelector:
            kubernetes.io/arch: "amd64"
          annotations:
            # Was 10.3.0.155 — collided with govee2mqtt (same IP, different MAC),
            # causing ARP conflicts on the IoT VLAN. govee2mqtt keeps .155.
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "networking",
                "ips": ["10.3.0.156/24"],
                "mac": "92:cf:d7:05:70:91"
              }]
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.9.13
            env:
              TZ: "${CLUSTER_TZ}"
              LOG_LEVEL: info
            # CPU from 7d of Prometheus data: p50 2.5m, p95 3.7m, max 438m —
            # idle most of the time, with short transcode/library-scan spikes.
            # 25m is the practical request floor. No CPU limit, per the cluster
            # convention: the spikes are exactly what shouldn't be throttled.
            resources:
              requests:
                cpu: 25m
                memory: 500Mi
                ephemeral-storage: 200Mi
              limits:
                memory: 2000Mi
                ephemeral-storage: 200Mi

    persistence:
      data:
        existingClaim: music-assistant

      music:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NAS_URL}
            path: /volume1/media/music

    service:
      main:
        controller: main
        type: LoadBalancer
        loadBalancerIP: "${SVC_MUSIC_ASSISTANT_ADDR}"
        annotations:
          internal.wynning.tech/hostname: "ma.${SECRET_INTERNAL_DOMAIN}"
        ports:
          http:
            port: 8095
          streaming:
            port: 8097
          streaming2:
            port: 8098
          http2:
            port: 1780
          snapserver:
            port: 1704
          # SlimProto control port for hardware Squeezebox / squeezelite players
          # (enable the "Squeezelite" provider in Music Assistant to start this listener)
          slimproto:
            port: 3483

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Music Assistant"
          gethomepage.dev/description: "Music Management"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: "music-assistant.png"
          gethomepage.dev/weight: "10"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
