---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ghostrecon
  namespace: &namespace ghostfolio
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 5Gi
      # Deliberately no VOLSYNC_PUID/PGID override, even though the container
      # runs as 10001. The mover has to stay at the component default of 1000:
      # the Synology Kopia share is UID/GID 1000 aligned, and a mover running
      # as anything else cannot read /mnt/repository/.shards. Ownership of the
      # restored volume is handled on the app side instead, by the pod's
      # fsGroup: 10001 + fsGroupChangePolicy: OnRootMismatch — the same way
      # shlink (uid 2000) does it.
  dependsOn:
    - name: ghostfolio
      namespace: *namespace
  path: ./apps/ghostfolio/ghostrecon/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
