---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.envoyproxy.io/envoypatchpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: plausible-lua-filter
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-towonel
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      name: networking/envoy-towonel/https
      # Index 2 puts the pageview call *after* the Coraza WAF, so requests the WAF
      # rejects aren't counted. The generated http_filters chain on this listener's
      # default (no-SNI) filter chain is:
      #   0 envoy.filters.http.buffer          (requestBuffer BackendTrafficPolicy)
      #   1 envoy.filters.http.wasm/...coraza-wasm
      #   2 envoy.filters.http.local_ratelimit  <- lua inserts here
      #   3..5 compressor.brotli / gzip / zstd
      #   6 envoy.filters.http.router          (terminal)
      # Verify with: curl -s localhost:19000/config_dump?resource=dynamic_listeners
      # against an envoy-towonel pod (admin port 19000) before changing this index.
      # Don't use `-` to append: anything after the router filter never runs.
      operation:
        op: add
        path: "/filter_chains/0/filters/0/typed_config/http_filters/2"
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_request(request_handle)
                  local h = request_handle:headers()
                  local path   = h:get(":path")      or "/"
                  local host   = h:get(":authority")  or "wynning.tech"
                  local ua     = h:get("user-agent")  or ""
                  local xff    = h:get("x-forwarded-for") or ""

                  local client_ip = xff:match("([^,]+)") or xff

                  -- Strip port if present
                  local hostname = host:match("([^:]+)")

                  -- Only track subdomains of wynning.tech (and wynning.tech itself)
                  if not (hostname == "wynning.tech" or hostname:sub(-#".wynning.tech") == ".wynning.tech") then
                    return
                  end

                  local body = '{"name":"pageview","url":"https://'
                    .. host .. path .. '",'
                    .. '"domain":"wynning.tech"}'

                  request_handle:httpCall(
                    "plausible_analytics",
                    {
                      [":method"]         = "POST",
                      [":path"]           = "/api/event",
                      [":authority"]      = "plausible.plausible.svc.cluster.local",
                      ["content-type"]    = "application/json",
                      ["user-agent"]      = ua,
                      ["x-forwarded-for"] = client_ip,
                    },
                    body,
                    5000,
                    true
                  )
                end
