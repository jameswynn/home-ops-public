---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.21.1
  url: oci://quay.io/jetstack/charts/cert-manager
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    crds:
      enabled: true
      keep: true
    # CPU from 7d of Prometheus data: p50 0.9m, p95 1.1m, max 47.2m — idle
    # between renewals, then one short spike per ACME order. 25m is the
    # practical request floor. No CPU limit, per the cluster convention.
    resources:
      requests:
        memory: 200Mi
        cpu: 25m
      limits:
        memory: 400Mi
    webhook:
      # CPU from 7d of Prometheus data: p50 0.7m, p95 0.8m, max 1.7m — it only
      # validates the occasional Certificate/Issuer write. No CPU limit, per
      # the cluster convention.
      resources:
        requests:
          memory: 150Mi
          cpu: 25m
        limits:
          memory: 200Mi
    cainjector:
      # CPU from 7d of Prometheus data: p50 1.8m, p95 2.3m, max 3.6m. It was
      # also losing 0.2% of CFS periods to the 1000m limit at that usage —
      # informer resyncs waking every worker at once. No CPU limit, per the
      # cluster convention.
      resources:
        requests:
          memory: 20Mi
          cpu: 25m
        limits:
          memory: 400Mi

    # replicaCount: 3
    # webhook:
    #   replicaCount: 3
    # cainjector:
    #   replicaCount: 3
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
      - --dns01-recursive-nameservers-only
    # podDnsPolicy: None
    # podDnsConfig:
    #   nameservers:
    #     - "1.1.1.1"
    #     - "9.9.9.9"
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        prometheusInstance: monitoring
