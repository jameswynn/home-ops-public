---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  route:
    groupBy:
      - "alertname"
      - "job"
    groupInterval: 10m
    groupWait: 1m
    receiver: ntfy
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - {name: alertname, value: InfoInhibitor, matchType: =}
      # Synology NAS sits above the upstream aqu-sq>10 threshold by design
      # (spinning RAID over NFS, median queue ~13 vs ~0 on cluster nodes).
      # Suppress notification only -- the rule still evaluates in Prometheus.
      - receiver: "null"
        matchers:
          - {name: alertname, value: NodeDiskIOSaturation, matchType: =}
          - {name: node, value: nas, matchType: =}
      # - receiver: heartbeat
      #   groupInterval: 15s
      #   groupWait: 0s
      #   repeatInterval: 5m
      #   matchers: [{name: alertname, value: Watchdog, matchType: =}]
      - receiver: ntfy
        matchers:
          - {name: severity, value: critical, matchType: =}
  inhibitRules:
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    - name: "ntfy"
      webhookConfigs:
        - url: "http://ntfy-alertmanager:8080"
          httpConfig:
            basicAuth:
              username:
                name: alertmanager
                key: BAUTH_USER
              password:
                name: alertmanager
                key: BAUTH_PASS
