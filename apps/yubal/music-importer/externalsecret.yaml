---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: music-importer
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        MI_NAVIDROME_USER: |-
          {{ .MUSIC_IMPORTER_NAVIDROME_USER }}
        MI_NAVIDROME_PASSWORD: |-
          {{ .MUSIC_IMPORTER_NAVIDROME_PASSWORD }}
        # A UnifiedPush topic: ntfy grants anonymous write-only access to `up*`,
        # so there is no token to hold — the topic NAME is the credential, and
        # anyone who learns it can publish to it. Hence a secret, not an env.
        MI_NTFY_TOPIC: |-
          {{ .MUSIC_IMPORTER_NTFY_TOPIC }}
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: music-importer
