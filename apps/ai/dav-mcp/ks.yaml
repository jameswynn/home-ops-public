---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dav-mcp
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: dav-mcp
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/ai/dav-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
