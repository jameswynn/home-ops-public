---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gotosocial
  namespace: comms
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    service:
      main:
        controller: main
        ports:
          http:
            port: &port 8080

    controllers:
      main:
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: *app
          securityContext:
            fsGroup: 1000
            runAsUser: 1000
            runAsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          main:
            nameOverride: *app
            image:
              repository: mirror.gcr.io/superseriousbusiness/gotosocial
              tag: 0.22.1
            env:
              - name: GTS_HOST
                value: &host "social.${SECRET_ROOT_DOMAIN}"
              - name: TZ
                value: ${CLUSTER_TZ}
              - name: GTS_DB_TYPE
                value: sqlite
              - name: GTS_DB_ADDRESS
                value: /gotosocial/storage/sqlite.db
              - name: GTS_ACCOUNTS_REGISTRATION_OPEN
                value: "false"
              - name: GTS_TRUSTED_PROXIES
                value: "10.42.0.0/16,10.43.0.0/16,127.0.0.1/32,192.168.1.3/32,::1"
              - name: GTS_ADVANCED_RATE_LIMIT_EXCEPTIONS
                value: "10.0.0.0/8,192.168.1.0/24"
              # Default is 300 per 5min per IP, which is ample at steady state
              # (~200-400 inbox deliveries/hour total) but far too low for
              # catch-up after any downtime: peers redeliver their whole queue
              # at once, exceed the limit immediately, get 429s, and retry —
              # so the backlog cannot drain through a steady-state limit.
              - name: GTS_ADVANCED_RATE_LIMIT_REQUESTS
                value: "2000"
              # GTS_DB_SQLITE_CACHE_SIZE below is a PER-CONNECTION setting: GTS
              # bakes it into the connection URI as `_pragma=cache_size(-N)`
              # because, in its own words, "each connection is a separate SQLite
              # instance opening the same database". Pool size is
              # db-max-open-conns-multiplier * GOMAXPROCS (driver_sqlite.go), so
              # peak memory is pool * cache_size + base — and that only fits a
              # memory limit if the pool is a known *constant*. Both halves are
              # pinned here rather than inherited from the node:
              #
              #   GOMAXPROCS 2 x multiplier 2 = 4 connections
              #   4 x 512MiB + ~250MiB base ~= 2.3GiB peak, vs the 3Gi limit
              #
              # Pinning GOMAXPROCS is what makes that node-independent. With no
              # CPU limit (removed in #1374) GOMAXPROCS follows the node's core
              # count, so on muspelheim's 4 cores the default multiplier of 8
              # gave a 32-connection pool — a 16GiB ceiling against a 3Gi limit
              # — and the pod was OOMKilled on 2026-08-17 after 22.5h, once
              # enough of those caches had warmed. Even the *intended* 8-conn
              # pool is a 4GiB ceiling, i.e. was never survivable; it had only
              # ever been masked by the pod restarting before the caches filled.
              #
              # Two other settings scale off GOMAXPROCS, and both scale *down*
              # safely at 2: advanced-throttling-multiplier 8 goes from 32 to 16
              # open requests (256 -> 128 backlog), still far above the ~200-400
              # inbox deliveries/hour steady state, and advanced-sender-
              # multiplier 2 goes from 8 to 4 delivery goroutines. Note
              # media-ffmpeg-pool-size is a *fixed* 1, not CPU-scaled (it only
              # follows GOMAXPROCS if set to 0 or less), so it is unaffected.
              # All three live in config.yaml.
              - name: GOMAXPROCS
                value: "2"
              # Overrides db-max-open-conns-multiplier: 8 in the mounted
              # config.yaml — env wins over the config file.
              - name: GTS_DB_MAX_OPEN_CONNS_MULTIPLIER
                value: "2"
              # sqlite.db is ~9.3G on Longhorn, i.e. replicated *network* block
              # storage, where every page cache miss is a network round-trip.
              # The 8MiB default leaves readers thrashing against the network.
              #
              # Do NOT lower this to make the arithmetic above look safer — that
              # was tried twice on 2026-08-08 and broke the site both times. At
              # 64MiB the web profile page never completed a request (550-820ms
              # at 512MiB), and at 256MiB it still failed. A 9.3G database on
              # replicated network storage genuinely needs a cache this size.
              # The pool size is the lever for memory here, not the cache size.
              #
              # Cache size is also NOT the lever for the connection leak, which
              # is what it was mistakenly used for that day. The real cause is
              # confirmed: GTS 0.22.1 leaks exactly one SQL connection per
              # *completed* /@<user> render and never reclaims it, so 8 renders
              # wedge the instance. Shrinking the cache only appeared to help
              # because the render got too slow to finish, so the client gave up
              # and the request was cancelled before it could leak. See the
              # gatus annotation on the route below for the trigger and fix.
              - name: GTS_DB_SQLITE_CACHE_SIZE
                value: "512MiB"
              - name: GTS_OIDC_LINK_EXISTING
                value: "true"
              - name: GTS_STORAGE_BACKEND
                value: "s3"
              - name: GTS_STORAGE_S3_PROXY
                value: "true"
              - name: GTS_LANDING_PAGE_USER
                value: "james"
              - name: GTS_ACCOUNTS_ALLOW_CUSTOM_CSS
                value: "true"
              - name: GTS_SMTP_HOST
                value: smtp.comms.svc.cluster.local
              - name: GTS_SMTP_PORT
                value: 25
              - name: GTS_SMTP_FROM
                value: no-reply@${SECRET_ROOT_DOMAIN}
            envFrom:
              - secretRef:
                  name: *app
              - secretRef:
                  name: gotosocial-oauth

            resources:
              requests:
                # The 512MiB sqlite cache is resident, so 100Mi badly
                # under-describes this pod to the scheduler. 768Mi still did:
                # 7d of Prometheus data puts the working set at p50 882Mi,
                # p95 2058Mi, max 2538Mi, so the old request sat below the
                # median and the scheduler consistently under-counted this pod.
                # 1.5Gi is ~1.7x the p50 and sits between p50 and p95; memory
                # is incompressible, so under-requesting risks eviction under
                # node pressure rather than just slow performance.
                memory: 1536Mi
                # CPU from 7d of Prometheus data: p50 11.6m, p95 60.8m, but
                # p99 402m and max 869m — federation catch-up is spiky by
                # nature. 150m covers the working range; the spikes are meant
                # to run unclamped, hence no CPU limit per the convention.
                cpu: 150m
                ephemeral-storage: 100Mi
              limits:
                # Measured 1628-1807Mi with the 512MiB cache under federation
                # catch-up load, i.e. peaking at 90% of the previous 2000Mi
                # limit. An OOMKill mid-backlog is worse than the headroom
                # costs; the node is at 48% of memory limits.
                #
                # With the connection pool pinned to 4 (see GOMAXPROCS above)
                # the *ceiling* is now bounded at ~2.3GiB rather than tracking
                # the node's core count, so 3Gi is a real limit with headroom
                # instead of a number the pod could exceed by arithmetic.
                memory: 3Gi
                ephemeral-storage: 200Mi
            # `enabled: true` is load-bearing: app-template renders a probe only
            # when it is set. These three carried `custom: true` and a spec but no
            # `enabled`, so the chart silently dropped all of them and the pod ran
            # with no probes at all — which is how a total stall on 2026-08-07 went
            # 4h45m without a restart while the pod still reported Ready (with no
            # readiness probe, Ready is automatic at container start). GoToSocial
            # was the only app in this repo making that mistake.
            #
            # The path matters as much as the flag. `/` answers 302 in ~600us
            # without touching the database, so it stayed green through the whole
            # outage. /nodeinfo/2.0 reads account/status counts, so it is the thing
            # that actually fails when the database/sql pool leaks itself dry.
            # Probe traffic is unaffected by GTS_ADVANCED_RATE_LIMIT_EXCEPTIONS,
            # and a 429 from the global throttler counts as a probe failure, which
            # is what we want.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &probePath /nodeinfo/2.0
                    port: *port
                    scheme: HTTP
                  # Healthy is <200ms. 4 consecutive misses over 5s each restarts
                  # after ~60s of genuine stall, while staying far clear of normal
                  # latency so federation catch-up can't trigger a restart loop.
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 4
                  successThreshold: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *probePath
                    port: *port
                    scheme: HTTP
                  # Drops the pod out of the Service ~45s into a stall, so callers
                  # get a fast 503 instead of hanging until the 10m request timeout.
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
                  successThreshold: 1
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *probePath
                    port: *port
                    scheme: HTTP
                  # Opening a 9.3G sqlite.db off Longhorn is not instant, and this
                  # gates the other two — 5 minutes, then liveness takes over.
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
                  successThreshold: 1

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "GotoSocial"
          gethomepage.dev/description: "Federated Social Media"
          gethomepage.dev/group: "Applications"
          gethomepage.dev/icon: "gotosocial.png"
          gethomepage.dev/weight: "30"
          external-dns.alpha.kubernetes.io/hostname: *host
          # Point the auto-generated check at a cheap endpoint. Without this it
          # probes the bare host, GTS 302s / -> /@james (GTS_LANDING_PAGE_USER),
          # Gatus follows the redirect, and each *completed* profile render
          # leaks one SQL connection in 0.22.1 — measured as exactly +1 per
          # request, never reclaimed. At one check per minute that exhausts the
          # 8-connection pool in ~7min and wedges the instance for good, which
          # is what drove 86 restarts/12h on 2026-08-08.
          #
          # Trade-off: this no longer proves the *web frontend* renders, only
          # that the app answers and can reach the database (/nodeinfo/2.0
          # reads account/status counts). That is the same endpoint the
          # liveness probe uses. Revisit once the upstream leak is fixed.
          gatus.home-operations.com/endpoint: |
            url: https://social.${SECRET_ROOT_DOMAIN}/nodeinfo/2.0
            conditions: ["[STATUS] == 200"]
        hostnames:
          - *host
        parentRefs:
          - name: envoy-towonel
            namespace: networking
          - name: envoy-internal
            namespace: networking

    persistence:
      data:
        enabled: true
        existingClaim: gotosocial-data
        globalMounts:
          - path: /gotosocial/storage
      config:
        enabled: true
        type: configMap
        name: gotosocial-config
        globalMounts:
          - subPath: config.yaml
            path: /gotosocial/config.yaml
            readOnly: true
