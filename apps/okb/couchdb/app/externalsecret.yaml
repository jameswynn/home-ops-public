---
# Bitwarden Secrets Manager item `okb`. Fields used here:
#   COUCHDB_ADMIN_PASSWORD  CouchDB server admin (`admin`); setup only
#   OKB_COUCHDB_PASSWORD    non-admin `obsidian` user: Obsidian clients and the
#                           bridge (see ../../bridge/app/externalsecret.yaml)
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        COUCHDB_USER: admin
        COUCHDB_PASSWORD: |-
          {{ .COUCHDB_ADMIN_PASSWORD }}
        OKB_PASSWORD: |-
          {{ .OKB_COUCHDB_PASSWORD }}
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: okb
