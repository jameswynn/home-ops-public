---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: networking
# ingress-nginx itself is gone — the cluster serves everything through
# envoy-gateway HTTPRoutes. Only the certs remain: default-cert is the TLS
# listener for all three Gateways (external/internal/towonel).
resources:
  - default-cert.yaml
  - sneaker-cert.yaml
