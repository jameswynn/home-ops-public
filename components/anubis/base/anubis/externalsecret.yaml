---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-anubis-key
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: ${APP}-anubis-key
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        ED25519_PRIVATE_KEY_HEX: "{{ .ANUBIS_ED25519_PRIVATE_KEY_HEX }}"

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: anubis
