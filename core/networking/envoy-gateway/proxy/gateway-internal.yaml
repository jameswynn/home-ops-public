---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  labels:
    network: internal
  annotations:
    internal.wynning.tech/target: ${SVC_ENVOY_GATEWAY_INTERNAL}
    gatus.home-operations.com/endpoint: |
      group: internal
      # guarded: true
      # ui:
      #   hide-hostname: true
      #   hide-url: true
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: ${SVC_ENVOY_GATEWAY_INTERNAL}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: default-cert

    # Raw TCP for forgejo git-over-ssh. Scoped to the dev namespace and to
    # TCPRoute so nothing else can claim the port.
    - name: ssh
      protocol: TCP
      port: 2222
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: dev
        kinds:
          - kind: TCPRoute
