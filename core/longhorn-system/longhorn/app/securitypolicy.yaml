apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-httproute
  oidc:
    provider:
      issuer: "https://auth.wynning.tech/application/o/longhorn"
    clientID: longhorn
    clientSecret:
      name: longhorn-oidc
    redirectURL: "https://longhorn.${SECRET_INTERNAL_DOMAIN}/oauth2/callback"
    logoutPath: "/oauth2/logout"
