---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: continuwuity
  namespace: comms
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        CONDUWUIT_REGISTRATION_TOKEN: |-
          {{ .CONTINUWUITY_REGISTRATION_TOKEN }}
        CONTINUWUITY_REGISTRATION_TOKEN: |-
          {{ .CONTINUWUITY_REGISTRATION_TOKEN }}
        # INIT_POSTGRES_HOST: "${SVC_POSTGRES_HOST}"
        # INIT_POSTGRES_SUPER_PASS: |-
        #   {{ .POSTGRES_SUPERUSER_PASSWORD }}
        # INIT_POSTGRES_DBNAME: |-
        #   {{ .CONTINUWUITY_POSTGRES_DATABASE }}
        # INIT_POSTGRES_USER: |-
        #   {{ .CONTINUWUITY_POSTGRES_USERNAME }}
        # INIT_POSTGRES_PASS: |-
        #   {{ .CONTINUWUITY_POSTGRES_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: continuwuity
