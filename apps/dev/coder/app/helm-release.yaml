---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coder
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 2.28.4
  url: oci://ocharted.wynning.tech/helm.coder.com/v2/coder
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app coder
  namespace: dev
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: coder
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://github.com/coder/coder/tree/main/helm/coder
    podAnnotations:
      secret.reloader.stakater.com/reload: *app
    coder:
      initContainers:
        - name: 01-init-db
          image: ghcr.io/home-operations/postgres-init:18.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: coder-initdb
      env:
        # App
        - name: CODER_ACCESS_URL
          value: https://coder.${SECRET_INTERNAL_DOMAIN}
        - name: CODER_WILDCARD_ACCESS_URL
          value: "*.coder.${SECRET_INTERNAL_DOMAIN}"
      envFrom:
        - secretRef:
            name: coder
        - secretRef:
            name: coder-oauth
      resources:
        requests:
          cpu: 10m
          memory: 200Mi
          ephemeral-storage: 500Mi
        limits:
          cpu: 2000m
          memory: 2Gi
          ephemeral-storage: 1Gi

      # ingress:
      #   enable: true
