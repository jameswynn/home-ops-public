---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: profile-jameswynn-com
spec:
  parentRefs:
    - name: envoy-towonel
      namespace: networking
      sectionName: jameswynn-https
  hostnames:
    - "jameswynn.com"
  rules:
    - backendRefs:
        - name: plausible
          port: 8000
      matches:
        - path:
            type: PathPrefix
            value: /js/script.js
        - path:
            type: PathPrefix
            value: /api/event
