---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hugo-ap-comments-proxy
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    service:
      main:
        controller: main
        ports:
          http:
            port: &port 8080

    controllers:
      main:
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: *app
          securityContext:
            fsGroup: 1000
            runAsUser: 1000
            runAsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          main:
            nameOverride: *app
            image:
              repository: forge.wynning.tech/james/hugo-ap-comments-proxy
              tag: 0.0.1
            env:
              - name: UPSTREAM_HOST
                value: social.wynning.tech
            envFrom:
              - secretRef:
                  name: *app

            # CPU from 7d of Prometheus data: p50 0.02m, p95 0.03m, max 0.05m —
            # this proxy is effectively idle. The old 50m request over-reserved
            # by ~1500x. 25m is the practical request floor. No CPU limit, per
            # the cluster convention.
            resources:
              requests:
                memory: 200Mi
                cpu: 25m
              limits:
                memory: 200Mi

    route:
      app:
        annotations:
          # This is a narrow ActivityPub comments proxy — it has no health
          # endpoint and serves nothing at "/", so 404 is its healthy response.
          # The body assertion distinguishes the Go app's 404 from Envoy's own
          # no-route 404 (empty body), so the check still fails if routing breaks.
          gatus.home-operations.com/endpoint: |-
            conditions:
              - "[STATUS] == 404"
              - "[BODY] == pat(*404 page not found*)"
        hostnames:
          - social-proxy.wynning.tech
        parentRefs:
          - name: envoy-towonel
            namespace: networking
          - name: envoy-internal
            namespace: networking
