---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: comms
resources:
  - helmrelease.yaml
  - externalsecret.yaml
  - pvc.yaml
configMapGenerator:
  - name: mautrix-meta-base-config
    files:
      - config.yaml=./resources/config.yaml
      - registration.yaml=./resources/registration.yaml
generatorOptions:
  disableNameSuffixHash: true
