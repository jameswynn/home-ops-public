---
# Work volume only (query log + stats; Longhorn backups suffice). The config
# claim (adguard-config) comes from components/kopiur in ../ks.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-work
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
