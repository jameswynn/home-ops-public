---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Coder.com"
    gethomepage.dev/description: "Cloud-Native Dev Environment"
    gethomepage.dev/group: "Development"
    gethomepage.dev/icon: "coder.svg"
    gethomepage.dev/weight: "90"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: networking
  hostnames:
    - "coder.${SECRET_INTERNAL_DOMAIN}"
    - "*.coder.${SECRET_INTERNAL_DOMAIN}"
  rules:
    # Public hostname goes through anubis. X-Real-Ip is already set for us by
    # the ClientTrafficPolicy on both gateways, so no header filter is needed.
    - backendRefs:
        - name: coder
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
