---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-web
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  components:
    - ../../../../components/volume-claim
    - ../../../../components/nfs-scaler
  postBuild:
    substitute:
      APP: *app
      VOLUME_CAPACITY: 10Gi
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./apps/default/calibre-web/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
