---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: longhorn
    role: alert-rules
  name: longhorn
  namespace: longhorn-system
spec:
  groups:
    - name: longhorn.rules
      rules:
        - alert: LonghornVolumeActualSpaceUsedWarning
          annotations:
            description: The actual space used by Longhorn volume {{$labels.volume}} on {{$labels.node}} is at {{$value}}% capacity for more than 5 minutes.
            summary: The actual used space of Longhorn volume is over 90% of the capacity.
          expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
          for: 5m
          labels:
            issue: The actual used space of Longhorn volume {{$labels.volume}} on {{$labels.node}} is high.
            severity: warning
        - alert: LonghornVolumeStatusCritical
          annotations:
            description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Fault for more than 2 minutes.
            summary: Longhorn volume {{$labels.volume}} is Fault
          expr: longhorn_volume_robustness == 3
          for: 5m
          labels:
            issue: Longhorn volume {{$labels.volume}} is Fault.
            severity: critical
        - alert: LonghornVolumeStatusWarning
          annotations:
            description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Degraded for more than 5 minutes.
            summary: Longhorn volume {{$labels.volume}} is Degraded
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            issue: Longhorn volume {{$labels.volume}} is Degraded.
            severity: warning
        - alert: LonghornNodeStorageWarning
          annotations:
            description: The used storage of node {{$labels.node}} is at {{$value}}% capacity for more than 5 minutes.
            summary: The used storage of node is over 70% of the capacity.
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70
          for: 5m
          labels:
            issue: The used storage of node {{$labels.node}} is high.
            severity: warning
        - alert: LonghornDiskStorageWarning
          annotations:
            description: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is at {{$value}}% capacity for more than 5 minutes.
            summary: The used storage of disk is over 70% of the capacity.
          expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
          for: 5m
          labels:
            issue: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is high.
            severity: warning
        - alert: LonghornNodeDown
          annotations:
            description: There are {{$value}} Longhorn nodes which have been offline for more than 5 minutes.
            summary: Longhorn nodes is offline
          expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
          for: 5m
          labels:
            issue: There are {{$value}} Longhorn nodes are offline
            severity: critical
        # - alert: LonghornIntanceManagerCPUUsageWarning
        #   annotations:
        #     description:
        #       Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is {{$value}}% for
        #       more than 5 minutes.
        #     summary: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is over 300%.
        #   expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
        #   for: 5m
        #   labels:
        #     issue: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} consumes 3 times the CPU request.
        #     severity: warning
        # Orphaned rebuild slots. A replica that is running but has never been healthy
        # and never been marked failed is counted as "rebuild in progress" by
        # ReplicaController.CanStartRebuildingReplica. Once
        # concurrent-replica-rebuild-per-node-limit (3) of them pile up on a node, that
        # node's rebuild queue is blocked permanently: spec.rebuildRetryCount pins at
        # FailedReplicaMaxRetryCount (5), the engine stops trying to attach the replica,
        # and nothing ever sets failedAt to trigger cleanup or replenishment.
        #
        # This is how 2026-10-23 happened: all 15 slots (3 x 5 nodes) squatted since
        # 2026-10-14, 62 volumes degraded, 52 on a single replica, zero rebuilds running,
        # silent for 9 days. LonghornVolumeStatusWarning did fire throughout but does not
        # distinguish "rebuilding, be patient" from "queue is wedged".
        #
        # Fix is to delete the offending replica CRs — they hold no data and the engine
        # never attached them. Clear them a few at a time: freeing every slot at once
        # unblocks the whole backlog and the resulting I/O burst stalls muspelheim's etcd
        # (see the muspelheim etcd caution in CLAUDE.md), which restarts k3s, interrupts
        # the in-flight rebuilds and manufactures a fresh batch of orphans.
        #
        # 45m tolerates a legitimately slow rebuild; a real one makes progress and clears
        # healthyAt long before that.
        - alert: LonghornReplicaRebuildSlotStuck
          annotations:
            description: >-
              Longhorn replica {{$labels.name}} (volume {{$labels.volume}}) on {{$labels.node}} has been running
              for 45m without ever becoming healthy or being marked failed. It is holding a rebuild slot that no
              other replica on that node can use. Delete the replica CR to release it.
            summary: Longhorn replica is holding a rebuild slot without rebuilding
          expr: |
            kube_customresource_longhorn_replica_info{
              customresource_kind="Replica",
              current_state="running",
              healthy_at="",
              failed_at=""
            } == 1
          for: 45m
          labels:
            issue: Longhorn replica {{$labels.name}} on {{$labels.node}} is squatting a rebuild slot.
            severity: warning
        # Node-level escalation: at or past the per-node concurrency limit, every slot on
        # the node is squatted and nothing on it can rebuild again until this is cleared.
        - alert: LonghornRebuildQueueDeadlocked
          annotations:
            description: >-
              {{$value}} replicas on Longhorn node {{$labels.node}} have been holding rebuild slots for 45m
              without rebuilding, at or above the per-node limit of 3. No replica on this node can rebuild
              until the stuck replica CRs are deleted.
            summary: Longhorn rebuild queue is deadlocked on {{$labels.node}}
          expr: |
            count by (node) (
              kube_customresource_longhorn_replica_info{
                customresource_kind="Replica",
                current_state="running",
                healthy_at="",
                failed_at=""
              } == 1
            ) >= 3
          for: 45m
          labels:
            issue: Longhorn rebuild queue on {{$labels.node}} is fully blocked by stuck replicas.
            severity: critical
        # Backstop that depends only on Longhorn's own volume metrics, so it still fires
        # if the kube-state-metrics custom-resource config above is removed or breaks.
        # Normal churn stays well under this: VolSync's hourly volsync-*-src clones show
        # up as a handful of degraded volumes for a few minutes, not 5 for two hours.
        - alert: LonghornVolumesDegradedTooLong
          annotations:
            description: >-
              {{$value}} Longhorn volumes have been degraded for 2 hours. Replica rebuilding is probably not
              making progress — check for replicas holding rebuild slots without rebuilding.
            summary: Many Longhorn volumes degraded for 2 hours
          expr: count(longhorn_volume_robustness == 2) >= 5
          for: 2h
          labels:
            issue: Longhorn has {{$value}} volumes degraded for over 2 hours.
            severity: critical
        - alert: LonghornNodeCPUUsageWarning
          annotations:
            description: Longhorn node {{$labels.node}} has CPU Usage / CPU capacity is {{$value}}% for more than 5 minutes.
            summary: Longhorn node {{$labels.node}} experiences high CPU pressure for more than 5m.
          expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
          for: 5m
          labels:
            issue: Longhorn node {{$labels.node}} experiences high CPU pressure.
            severity: warning
