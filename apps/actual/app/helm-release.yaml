---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app actual
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      actual:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/actualbudget/actual-server
              tag: 26.8.1
            env:
              TZ: ${CLUSTER_TZ}
              ACTUAL_PORT: &httpPort 5006
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            # CPU from 7d of Prometheus data (2016 samples): p50 0m, p95 1m,
            # max 1m. 25m is the practical request floor. No CPU limit, per the
            # cluster convention (request from observed usage; throttling hurts
            # more than it helps).
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
                ephemeral-storage: 100Mi
              limits:
                memory: 512Mi
                ephemeral-storage: 100Mi

    service:
      app:
        controller: actual
        ports:
          http:
            port: *httpPort

    persistence:
      data:
        enabled: true
        existingClaim: *app
        advancedMounts:
          actual:
            app:
              - path: /data

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Actual"
          gethomepage.dev/description: "Budget Tracking"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "https://actual.${SECRET_INTERNAL_DOMAIN}/favicon-32x32.png"
          gethomepage.dev/weight: "100"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
