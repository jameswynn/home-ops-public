---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/nfd.k8s-sigs.io/nodefeaturerule_v1alpha1.json
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: coral-tpu
spec:
  rules:
    # Google Coral USB Accelerator
    - name: coral-tpu
      labels:
        feature.node.kubernetes.io/coral-tpu: "true"
      matchFeatures:
        - feature: usb.device
          matchExpressions:
            vendor: { op: In, value: [ "1a6e", "18d1" ] }
