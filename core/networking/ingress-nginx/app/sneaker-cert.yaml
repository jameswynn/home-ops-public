---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sneaker-cert
  namespace: networking
spec:
  commonName: sneaker.social
  dnsNames:
    - sneaker.social
    - '*.sneaker.social'
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  secretName: sneaker-cert
  usages:
    - digital signature
    - key encipherment
