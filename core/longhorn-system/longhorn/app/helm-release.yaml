---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: longhorn
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.11.2
  url: oci://ocharted.wynning.tech/charts.longhorn.io/longhorn
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  timeout: 20m

  chartRef:
    kind: OCIRepository
    name: longhorn

  install:
    createNamespace: true
    remediation:
      retries: -1

  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    global:
      imageRegistry: mirror.gcr.io
    image:
      longhorn:
        instanceManager:
          # TODO: Remove this after 1.11.1 is released
          tag: v1.11.0-hotfix-1
    longhornManager:
      # Sized from 7d p95 on the amd64 nodes (74-107m); niflheim (arm64) sits at
      # ~564m for a comparable replica count and is tracked separately as an
      # outlier. Request only - the DaemonSet stays burstable above this floor.
      resources:
        requests:
          cpu: 150m
      tolerations:
        - key: "arm"
          value: "true"
          operator: "Equal"
          effect: "NoSchedule"
    longhornDriver:
      tolerations:
        - key: "arm"
          value: "true"
          operator: "Equal"
          effect: "NoSchedule"
    longhornUI:
      tolerations:
        - key: "arm"
          value: "true"
          operator: "Equal"
          effect: "NoSchedule"

    httproute:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Longhorn"
        gethomepage.dev/description: "Cluster Storage Management"
        gethomepage.dev/group: "Storage"
        gethomepage.dev/icon: "longhorn.png"
        gethomepage.dev/weight: "20"
        gethomepage.dev/pod-selector: ""
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: networking
      hostnames:
        - "longhorn.${SECRET_INTERNAL_DOMAIN}"
      path: /
      pathType: "PathPrefix"

    defaultSettings:
      backupTarget: s3://longhorn@eu-west-1/longhorn
      backupTargetCredentialSecret: minio-secret
      defaultDataPath: /storage
      taintToleration: "arm=true:NoSchedule"
      nodeDrainPolicy: block-for-eviction-if-contains-last-replica
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      defaultDataLocality: best-effort
      # Why every reboot used to be a rebuild storm (2026-11-17): the chart
      # default replenishment wait is 600s. A node that is away longer than that
      # has every replica on it abandoned and rebuilt from scratch elsewhere,
      # and a kured cycle here is never under 10 minutes (the drain alone is
      # 10-15 with nodeDrainPolicy above). helheim came back from its 02:17
      # reboot holding 20 replicas instead of ~60; the other 40 were full
      # rebuilds at one per node, hours of degraded volumes that then failed
      # node-maintenance-gate's cluster_safe for the next window. 3600s covers a
      # maintenance cycle: the returning node's replicas are reused and
      # delta-synced (fast-replica-rebuild is on). Cost: a genuinely dead node
      # waits an hour before its replicas are replaced, fine at 3 replicas.
      replicaReplenishmentWaitInterval: 3600
      # Two rebuilds per node (chart default 3). Was 1, live-only, since the
      # 2026-11-08 recovery, when 2 pushed etcd fsync to 2.3s - but etcd then
      # shared muspelheim's BX500 with Longhorn. etcd moved to NVMe 2026-11-09.
      # Re-tested 2026-11-23 at 2 with 3 rebuilds running: etcd p99 unchanged
      # (muspelheim 3-7ms, helheim 3ms, svartalfheim 42-61ms = its baseline),
      # BX500 peak 22% busy, no failed rebuilds, 14 degraded -> 0 in 5 min.
      # Two slots also means one stuck replica no longer blocks a whole node.
      concurrentReplicaRebuildPerNodeLimit: 2
      # least-effort: only rebalance when a node has zero replicas of a volume,
      # never bulk-move replicas back onto a node that just returned.
      replicaAutoBalance: least-effort
      removeSnapshotsDuringFilesystemTrim: true
