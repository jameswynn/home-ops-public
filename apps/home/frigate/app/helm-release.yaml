---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app frigate
  namespace: home
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: mosquitto
      namespace: home
    - name: intel-device-plugin-gpu
      namespace: kube-system
    - name: node-feature-discovery
      namespace: kube-system
  values:
    service:
      main:
        controller: main
        ports:
          http-with-auth:
            port: &httpAuthPort 8971
          http:
            port: &port 5000
          rtsp:
            enabled: true
            port: 8554

    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            feature.node.kubernetes.io/coral-tpu: "true"
            feature.node.kubernetes.io/intel-gpu: "true"
          annotations:
            configmap.reloader.stakater.com/reload: *app
        containers:
          main:
            securityContext:
              privileged: true
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
            env:
              TZ: "${CLUSTER_TZ}"
              # LIBVA_DRIVER_NAME: i965
            envFrom:
              - secretRef:
                  name: *app

            resources:
              requests:
                # Frigate is the cluster's largest CPU consumer. 7d of Prometheus
                # (query_range, step 300): p50 1316m, p95 1539m, max 1691m — a
                # sustained detect + ffmpeg load, not a bursty one. The previous
                # 1000m request sat below even p50, so the pod ran on borrowed
                # CPU essentially all the time and had no guaranteed share under
                # contention. 1500m covers p50 with room and lands at p95.
                # 2000m would cover the observed max, but it would spend a full
                # core of the cluster's ~1.6 core single-node-failure margin to
                # buy the top 5% of the distribution — not worth it while the
                # node it is pinned to has spare capacity to absorb the tail.
                # No CPU limit, per the cluster convention.
                cpu: 1500m
                memory: 5000Mi
                gpu.intel.com/i915: "1"
                # Without an explicit request the LimitRange default (20Mi) applies,
                # and stdout logs alone (~0.35 MiB/h, rotated by k3s at ~60 MiB)
                # blow past it and get the pod evicted roughly daily.
                ephemeral-storage: 64Mi
              limits:
                memory: 8000Mi
                gpu.intel.com/i915: "1"
                ephemeral-storage: 256Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 120

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Frigate"
          gethomepage.dev/description: "Camera NVR"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "frigate.png"
          gethomepage.dev/weight: "20"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name = frigate"
          internal.wynning.tech/hostname: &host "{{ .Release.Name }}.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - group: ""
                kind: Service
                name: frigate
                namespace: home
                port: *httpAuthPort
            matches:
              - path:
                  type: PathPrefix
                  value: /
      schema:
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - group: ""
                kind: Service
                name: frigate
                namespace: home
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /api/config/schema.json

    persistence:
      config:
        enabled: true
        existingClaim: frigate-config-v1
      config-file:
        enabled: true
        type: configMap
        name: *app
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: false
      media:
        enabled: true
        type: nfs
        server: ${SECRET_NAS_URL}
        path: /volume1/frigate
        globalMounts:
          - path: /media
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm
      tmpcache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp/cache
      usb:
        enabled: true
        type: hostPath
        hostPath: /dev/bus/usb
        hostPathType: Directory
        globalMounts:
          - path: /dev/bus/usb
