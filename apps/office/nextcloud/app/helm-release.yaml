---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nextcloud
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 8.5.10
  url: oci://ocharted.wynning.tech/nextcloud.github.io/helm/nextcloud
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nextcloud2
  namespace: office
spec:
  interval: 5m
  releaseName: nextcloud2
  chartRef:
    kind: OCIRepository
    name: nextcloud
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    remediation:
      retries: 3
  values:
    nextcloud:
      # securityContext:
      #   fsGroup: 33

      host: &host cloud.${SECRET_ROOT_DOMAIN}

      extraEnv:
        - name: REDIS_HOST
          value: nextcloud-dragonfly
        - name: REDIS_HOST_PORT
          value: "6379"

      phpConfigs:
        uploadLimit.ini: |
          upload_max_filesize = 16G
          post_max_size = 16G
          max_input_time = 3600
          max_execution_time = 3600
          default_phone_region = US

      configs:
        overwrite.config.php: |-
          <?php
          $CONFIG = array (
            'overwriteprotocol' => 'https',
            'default_phone_region' => 'US',
          );
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' =>
            array(
              0 => '127.0.0.1',
              1 => '10.0.0.0/8',
            ),
            'forwarded_for_headers' =>
            array (
              0 => 'HTTP_X_FORWARDED_FOR',
            ),
            'trusted_domains' =>
            array(
              0 => 'localhost',
              1 => 'cloud.${SECRET_ROOT_DOMAIN}'
            )
          );
        bulkupload.config.php: |-
          <?php
          $CONFIG = array (
            'bulkupload.enabled' => false,
          );

      mail:
        enabled: true
        fromAddress: no-reply
        domain: ${SECRET_ROOT_DOMAIN}
        smtp:
          host: smtp.comms.svc.cluster.local
          port: 25

    image:
      registry: mirror.gcr.io
      repository: library/nextcloud
      tag: 34.0.3

    nginx:
      enabled: false

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: beta.kubernetes.io/arch
                  operator: In
                  values:
                    - amd64

    # CPU from 7d of Prometheus data: p50 9.5m, p95 16.7m, max 310m — PHP-FPM
    # is idle between requests and the spikes are short sync bursts. 50m
    # covers the steady state with room to burst. No CPU limit, per the
    # cluster convention: throttled PHP-FPM workers turn into slow page loads
    # and client sync timeouts rather than a clean backpressure signal.
    resources:
      requests:
        memory: 1000Mi
        cpu: 50m
        ephemeral-storage: 200Mi
      limits:
        memory: 2000Mi
        ephemeral-storage: 1000Mi

    replicaCount: 1

    persistence:
      enabled: true
      existingClaim: nextcloud2
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-nfs

    livenessProbe:
      enabled: false

    readinessProbe:
      enabled: false

    startupProbe:
      enabled: true
      # /status.php stays unhealthy for the whole of `occ upgrade`, and the chart
      # default (30s + 30x10s) budgets only 5.5 minutes for it. A major upgrade
      # has to rsync ~2G of new code onto Longhorn *and* migrate a 600M+ database
      # with 200k+ oc_filecache rows; overrunning gets the container killed
      # mid-migration, which leaves a half-applied schema and maintenance mode
      # stuck on. 20 minutes, matching spec.upgrade.timeout.
      failureThreshold: 120

    internalDatabase:
      enabled: false

    podAnnotations:
      secret.reloader.stakater.com/reload: *app

    externalDatabase:
      enabled: true
      type: postgresql

      existingSecret:
        enabled: true
        secretName: nextcloud2-secrets
        usernameKey: POSTGRES_USER
        passwordKey: POSTGRES_PASSWORD

    postgresql:
      enabled: false

    externalRedis:
      enabled: false

    redis:
      enabled: false

    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        failedJobsHistoryLimit: 1
        successfulJobsHistoryLimit: 1
        # The cron pod mounts the same RWO `nextcloud2` volume as the app pod, so
        # it can only run on whichever node currently holds that volume. Without
        # this it schedules anywhere, and a pod that lands elsewhere sits in
        # ContainerCreating forever — the volume never detaches from the app pod,
        # and the scheduler never revisits a node it has already committed to.
        # The chart hardcodes concurrencyPolicy: Forbid, so one wedged pod
        # silently suppresses every subsequent run: cron was dead for 12h before
        # this was spotted. Pinning by affinity instead means a pod that cannot
        # be placed stays *unscheduled* and is retried, rather than wedging.
        #
        # Same selector the push-service uses; component: app is load-bearing,
        # since without it the cron pods match themselves.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: "app.kubernetes.io/name"
                      operator: In
                      values:
                        - nextcloud
                    - key: "app.kubernetes.io/instance"
                      operator: In
                      values:
                        - nextcloud2
                    - key: "app.kubernetes.io/component"
                      operator: In
                      values:
                        - app
                topologyKey: "kubernetes.io/hostname"
        # CPU from 7d of Prometheus data across the individual cron runs:
        # p50 ~4m, p95 ~13m, max 13.3m. Each run is short and mostly waits on
        # the database. 50m so a run gets scheduled promptly instead of
        # starting throttled. No CPU limit, per the cluster convention — a
        # cron job that overruns its window is worse than one that burns CPU.
        resources:
          requests:
            cpu: 50m
            memory: 20Mi
            ephemeral-storage: 50Mi
          limits:
            memory: 1500Mi
            ephemeral-storage: 500Mi
        securityContext:
          runAsUser: 33
          runAsGroup: 33
          runAsNonRoot: true
          readOnlyRootFilesystem: true
  valuesFrom:
    - kind: Secret
      name: &secrets nextcloud2-secrets
      valuesKey: NEXTCLOUD_ADMIN_USERNAME
      targetPath: nextcloud.username
    - kind: Secret
      name: *secrets
      valuesKey: NEXTCLOUD_ADMIN_PASSWORD
      targetPath: nextcloud.password
    - kind: Secret
      name: *secrets
      valuesKey: POSTGRES_HOST
      targetPath: externalDatabase.host
    - kind: Secret
      name: *secrets
      valuesKey: POSTGRES_DB
      targetPath: externalDatabase.database
    - kind: Secret
      name: *secrets
      valuesKey: NEXTCLOUD_REDIS_PASSWORD
      targetPath: redis.auth.password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-push-service
  namespace: office
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn:
    - name: nextcloud2
      namespace: office
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: "app.kubernetes.io/name"
                        operator: In
                        values:
                          - nextcloud
                      - key: "app.kubernetes.io/instance"
                        operator: In
                        values:
                          - nextcloud2
                      # Without this, cronjob pods match too — a stuck cron pod
                      # on another node drags this one off the RWO volume.
                      - key: "app.kubernetes.io/component"
                        operator: In
                        values:
                          - app
                  topologyKey: "kubernetes.io/hostname"
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: beta.kubernetes.io/arch
                        operator: In
                        values:
                          - amd64
        containers:
          main:
            image:
              # -- image repository
              repository: mirror.gcr.io/library/nextcloud
              # -- image tag
              tag: 34.0.3

            # How to Enable
            # 1. Install "client push" app within nextcloud
            # 2. sudo -u www-data php -d memory_limit=-1 /var/www/html/occ notify_push:setup https://nextcloud.mydomain.com/push
            command:
              - /nextcloud/custom_apps/notify_push/bin/x86_64/notify_push
              - /nextcloud/config/config.php
              - --port
              - &port "7867"
              - --log-level
              - warning

            env:
              - name: NEXTCLOUD_URL
                value: http://nextcloud2:8080

    service:
      main:
        controller: main
        ports:
          http:
            enabled: true
            port: *port

    # TODO: Replace with httproute
    ingress:
      main:
        enabled: false
        className: external-nginx
        hosts:
          - host: &host cloud.${SECRET_ROOT_DOMAIN}
            paths:
              - path: /push/
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host

    persistence:
      nextcloud:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nextcloud2
        globalMounts:
          - path: /nextcloud
      nextcloud-data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nextcloud-nfs
        globalMounts:
          - path: /nextcloud/data
