---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        JELLYFIN_HOMEPAGE_APIKEY: |-
          {{ .JELLYFIN_HOMEPAGE_APIKEY }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: jellyfin
