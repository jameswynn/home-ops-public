      #   carddav_nc_contacts_list_contacts
      #   carddav_nc_contacts_search_contacts
      #   carddav_nc_contacts_get_contact
      # Deliberately not adding carddav_nc_contacts_create_contact /
      # _patch_contact: coach is a read profile in the epic (#1547).
