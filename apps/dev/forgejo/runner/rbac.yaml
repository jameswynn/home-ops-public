---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner
  namespace: dev
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/component: ci-runner
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-sa-token
  namespace: dev
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/component: ci-runner
  annotations:
    kubernetes.io/service-account.name: forgejo-runner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-actions
  namespace: act-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/component: ci-runner
rules:
  # Allow the runner to manage its own job/task pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Allow reading ConfigMaps (e.g. runner configuration)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow the runner to read its own secrets (registry credentials, etc.)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-actions
  namespace: act-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/component: ci-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-runner-actions
subjects:
  - kind: ServiceAccount
    name: forgejo-runner
    namespace: dev
