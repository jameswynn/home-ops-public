---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-sync
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Rename, not passthrough: the image reads ACTUAL_SERVER_PASSWORD, while
        # the shared `actual-budget` Bitwarden item stores it as
        # ACTUAL_BUDGET_PASSWORD (that item predates this app and is also used by
        # the Actual MCP server, so the field name is not ours to change).
        #
        # This is the only copy of the password. The server has no ACTUAL_PASSWORD
        # env — it was set through the UI and lives hashed in
        # /data/server-files/account.sqlite, which cannot be read back.
        ACTUAL_SERVER_PASSWORD: "{{ .ACTUAL_BUDGET_PASSWORD }}"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: actual-budget
