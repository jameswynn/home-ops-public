---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: towonel-agent-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: towonel-agent-secret
    deletionPolicy: Delete
  refreshInterval: 15m
  data:
    # Bitwarden SM secret `towonel-tunnel` value = the hub-minted invite token.
    - secretKey: TOWONEL_INVITE_TOKEN
      remoteRef:
        key: towonel-tunnel
