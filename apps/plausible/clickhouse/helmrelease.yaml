---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      clickhouse:
        type: statefulset
        containers:
          app:
            image:
              repository: clickhouse/clickhouse-server
              tag: 24.12.6.70-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
              pullPolicy: IfNotPresent
            env:
              CLICKHOUSE_SKIP_USER_SETUP: "1"
            securityContext:
              readOnlyRootFilesystem: true
            resources:
              requests:
                # 7d of Prometheus data (1463 samples): p50 104m, p95 306m,
                # p99 584m, max 813m — the average matches the original ~115m
                # measurement but the tail is far spikier (merge fan-out).
                # 300m lands at p95 and gives it a real guaranteed share under
                # contention without denting muspelheim's tight headroom.
                # No limit — ClickHouse merges are bursty.
                cpu: 300m
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /?query=SELECT+1
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      clickhouse:
        controller: clickhouse
        ports:
          http:
            port: 8123

    persistence:
      tmp:
        type: emptyDir
      data:
        suffix: data
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts:
          - path: /var/lib/clickhouse
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/clickhouse-server/config.d/logging.xml
            subPath: config.xml
          - path: /etc/clickhouse-server/users.d/logging.xml
            subPath: users.xml

    configMaps:
      config:
        enabled: true
        data:
          # language=xml
          config.xml: |
            <clickhouse>
                <logger>
                    <level>warning</level>
                    <console>true</console>
                </logger>

                <listen_host>0.0.0.0</listen_host>

                <!-- Stop all the unnecessary logging -->
                <query_thread_log remove="remove"/>
                <query_log remove="remove"/>
                <text_log remove="remove"/>
                <trace_log remove="remove"/>
                <metric_log remove="remove"/>
                <asynchronous_metric_log remove="remove"/>
                <session_log remove="remove"/>
                <part_log remove="remove"/>
            </clickhouse>
          # language=xml
          users.xml: |
            <clickhouse>
                <profiles>
                    <default>
                        <log_queries>0</log_queries>
                        <log_query_threads>0</log_query_threads>
                    </default>
                </profiles>
            </clickhouse>
