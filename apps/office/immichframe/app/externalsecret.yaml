---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immichframe
  namespace: office
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: immichframe
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Always wins over the password stored in the settings db, so it doubles
        # as lockout recovery for /admin.
        IMMICHFRAME_ADMIN_PASSWORD: |-
          {{ .IMMICHFRAME_ADMIN_PASSWORD }}
        # Imported into /app/Config/immichframe.db on FIRST start only; after that
        # the admin UI (/admin) is the source of truth and edits here are ignored.
        # Albums/people/display options are picked in the admin UI, not here.
        # The Immich API key needs: album.read album.statistics asset.view
        # asset.read asset.statistics face.read memory.read person.read
        # person.statistics tag.read.
        Settings.yml: |-
          General:
            Interval: 45
            UnitSystem: "imperial"
            PhotoDateFormat: "MM/dd/yyyy"
          Accounts:
            - ImmichServerUrl: "http://immich-server:2283"
              ApiKey: "{{ .IMMICHFRAME_IMMICH_API_KEY }}"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: immichframe
