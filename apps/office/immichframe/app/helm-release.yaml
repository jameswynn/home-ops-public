---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immichframe
  namespace: office
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        strategy: Recreate
        pod:
          annotations:
            secret.reloader.stakater.com/reload: *app
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          main:
            image:
              repository: ghcr.io/immichframe/immichframe
              tag: v1.0.39.0@sha256:b4bd2ac6ec75c0117a24bd627dc0b449d485ac87ec3a410c73d5db05a4bbfcaf
            env:
              - name: TZ
                value: ${CLUSTER_TZ}
              - name: IMMICHFRAME_CONFIG_PATH
                value: /app/Config
              - name: IMMICHFRAME_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: IMMICHFRAME_ADMIN_PASSWORD
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 20
                  periodSeconds: 30
              readiness: *probe
            # Fresh install, no Prometheus history yet; .NET 8 service proxying
            # images. Revisit the request from observed p95 after a week.
            # No CPU limit, per the cluster convention.
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
                ephemeral-storage: 100Mi
              limits:
                memory: 512Mi
                ephemeral-storage: 500Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "ImmichFrame"
          gethomepage.dev/description: "Photo Slideshow"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "immich-frame.png"
          gethomepage.dev/weight: "25"
          external-dns.alpha.kubernetes.io/hostname: "immichframe.${SECRET_INTERNAL_DOMAIN}"
        hostnames:
          - "immichframe.${SECRET_INTERNAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking

    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /app/Config
      settings:
        enabled: true
        type: secret
        name: *app
        globalMounts:
          - path: /app/Config/Settings.yml
            subPath: Settings.yml
            readOnly: true
