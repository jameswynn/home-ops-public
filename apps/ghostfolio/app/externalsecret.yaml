---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # App
        ACCESS_TOKEN_SALT: |-
          {{ .GHOSTFOLIO_ACCESS_TOKEN_SALT }}
        DATABASE_URL: |-
          postgresql://{{ .GHOSTFOLIO_POSTGRES_USERNAME }}:{{ .GHOSTFOLIO_POSTGRES_PASSWORD }}@${SVC_POSTGRES_HOST}:${SVC_POSTGRES_PORT}/{{ .GHOSTFOLIO_POSTGRES_DATABASE }}
        JWT_SECRET_KEY: |-
          {{ .GHOSTFOLIO_JWT_SECRET_KEY }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: ghostfolio
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-init-db
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Postgres Init
        INIT_POSTGRES_HOST: "${SVC_POSTGRES_HOST}"
        INIT_POSTGRES_SUPER_PASS: |-
          {{ .POSTGRES_SUPERUSER_PASSWORD }}
        INIT_POSTGRES_DBNAME: |-
          {{ .GHOSTFOLIO_POSTGRES_DATABASE }}
        INIT_POSTGRES_USER: |-
          {{ .GHOSTFOLIO_POSTGRES_USERNAME }}
        INIT_POSTGRES_PASS: |-
          {{ .GHOSTFOLIO_POSTGRES_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: ghostfolio
    - extract:
        key: postgresql
