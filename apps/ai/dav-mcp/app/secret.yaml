---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dav-mcp-secrets
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    name: dav-mcp-secrets
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        NEXTCLOUD_CALDAV_USERNAME: "{{ .NEXTCLOUD_CALDAV_USERNAME }}"
        NEXTCLOUD_CALDAV_APP_PASSWORD: "{{ .NEXTCLOUD_CALDAV_APP_PASSWORD }}"
        NEXTCLOUD_CARDDAV_USERNAME: "{{ .NEXTCLOUD_CARDDAV_USERNAME }}"
        NEXTCLOUD_CARDDAV_APP_PASSWORD: "{{ .NEXTCLOUD_CARDDAV_APP_PASSWORD }}"
  dataFrom:
    - extract:
        key: toolhive-mcp
  refreshInterval: 15m
