---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-tailscale
spec:
  logging:
    level:
      default: info

  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          # Pinned past the gateway-helm default (distroless-v1.39.5 trusts the compromised
          # eMudhra CAs). Revert to `imageRepository:` once the chart default is >= 1.39.6.
          image: mirror.gcr.io/envoyproxy/envoy:distroless-v1.39.6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
      envoyService:
        loadBalancerClass: "tailscale"

  shutdown:
    drainTimeout: 180s
