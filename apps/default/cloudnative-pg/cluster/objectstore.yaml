---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres
  namespace: default
spec:
  # 14d, not 30d: daily base backups of this cluster are ~5GiB compressed, so
  # 30d was ~157GiB and filled the shared postgresql bucket (see garage.yaml).
  retentionPolicy: 14d
  instanceSidecarConfiguration:
    resources:
      limits:
        memory: 512Mi
        cpu: 1
      requests:
        memory: 128Mi
        cpu: 30m
  configuration:
    destinationPath: s3://postgresql/
    endpointURL: https://${SECRET_GARAGE_URL}
    s3Credentials:
      region:
        name: postgresql-garage
        key: GARAGE_REGION
      accessKeyId:
        name: postgresql-garage
        key: GARAGE_ACCESS_KEY
      secretAccessKey:
        name: postgresql-garage
        key: GARAGE_SECRET_KEY
    wal:
      compression: zstd
    data:
      compression: gzip
