---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    controllers:
      frontend:
        strategy: RollingUpdate
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: ${APP}-initdb
        containers:
          main:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-nextjs
              tag: v2.18.1
            env: &env
              NODE_ENV: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: DATABASE_URL
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: SESSION_SECRET
              JOB_SERVER_URL: http://streamystats-job-server
            ports:
              - containerPort: 3000
                name: http
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: http
              readiness: *probes
            resources:
              requests:
                memory: 112Mi
              limits:
                memory: 1Gi
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}

      job-server:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-job-server
              tag: v2.18.1
            env:
              <<: *env
              HOST: 0.0.0.0
              SESSION_POLL_INTERVAL_MS: "30000"
              CRON_ACTIVITY_SYNC: "*/5 * * * *"
              CRON_RECENT_ITEMS_SYNC: "*/5 * * * *"
              CRON_USER_SYNC: "*/5 * * * *"
              CRON_JOB_CLEANUP: "*/5 * * * *"
            ports:
              - containerPort: 3005
                name: http
            probes:
              liveness: &probesJob
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
              readiness: *probesJob
            resources:
              requests:
                cpu: 100m
                memory: 112Mi
              limits:
                memory: 1Gi
            securityContext: *sec

    service:
      frontend:
        controller: frontend
        ports:
          http:
            port: 80
            targetPort: 3000
      job-server:
        controller: job-server
        ports:
          http:
            port: 80
            targetPort: 3005

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Streamystats"
          gethomepage.dev/description: "Viewing Stats"
          gethomepage.dev/group: "Applications"
          gethomepage.dev/icon: "streamystats.png"
          gethomepage.dev/weight: "120"
        hostnames:
          - "${APP}.${SECRET_ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-towonel
            namespace: networking
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - name: streamystats-anubis
                port: 8080
