---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # LiteLLM
        DATABASE_URL: |-
          postgres://{{ .LITELLM_POSTGRES_USERNAME }}:{{ .LITELLM_POSTGRES_PASSWORD }}@${SVC_POSTGRES_HOST}:${SVC_POSTGRES_PORT}/{{ .LITELLM_POSTGRES_DATABASE }}
        # LiteLLM
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}" # Must start with sk-
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}" # Must start with sk-
        UI_USERNAME: "{{ .LITELLM_UI_USERNAME }}"
        UI_PASSWORD: "{{ .LITELLM_UI_PASSWORD }}"

        # AI APIs

        ## Anthropic (OAuth bearer token -> Authorization: Bearer <token>)
        ## Stored as the full header value so litellm's os.environ/ substitution
        ## (whole-value only) can drop it straight into extra_headers.Authorization.
        ANTHROPIC_AUTH_HEADER: "Bearer {{ .LITELLM_ANTHROPIC_AUTH_TOKEN }}"

        ## OpenAI
        OPENAI_API_KEY: "{{ .LITELLM_OPENAI_API_KEY }}"

        GOOGLE_API_KEY: "PLACEHOLDER"

        ANTHROPIC_API_KEY: "PLACEHOLDER"

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-init-db
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Postgres Init
        INIT_POSTGRES_HOST: "${SVC_POSTGRES_HOST}"
        INIT_POSTGRES_SUPER_PASS: |-
          {{ .POSTGRES_SUPERUSER_PASSWORD }}
        INIT_POSTGRES_DBNAME: |-
          {{ .LITELLM_POSTGRES_DATABASE }}
        INIT_POSTGRES_USER: |-
          {{ .LITELLM_POSTGRES_USERNAME }}
        INIT_POSTGRES_PASS: |-
          {{ .LITELLM_POSTGRES_PASSWORD }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: postgresql
