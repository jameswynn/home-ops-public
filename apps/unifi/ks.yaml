---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi
  namespace: &namespace unifi
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: ./apps/unifi/app
  components:
    - ../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: unifi-data
      KOPIUR_CAPACITY: 20Gi
      # No KOPIUR_PUID/PGID override: the mover must stay 1000 to open the NAS
      # repository (999 → /repo/.shards permission denied). Restored files come
      # back 1000-owned; the image's root entrypoint chown -Rs /unifi/{run,log,data}
      # to UNIFI_UID/GID 999 on start whenever the dir owner differs.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
