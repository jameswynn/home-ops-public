---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tailscale
spec:
  secretName: tailscale-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  commonName: ts.wynning.tech
  dnsNames:
    - ts.wynning.tech
    - "*.ts.wynning.tech"
