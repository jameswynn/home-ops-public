---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hugo-ap-comments-proxy
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager-sdk
    kind: ClusterSecretStore
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        ACCESS_TOKEN: |-
          {{ .BLOG_ACCESS_TOKEN }}

  refreshInterval: 15m
  dataFrom:
    - extract:
        key: hugo-ap-comments-proxy
