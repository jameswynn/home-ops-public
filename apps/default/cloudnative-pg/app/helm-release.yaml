---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cloudnative-pg
  namespace: default
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.29.0
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      create: true
    # CPU from 7d of Prometheus data: p50 10.3m, p95 12.2m, max 25.4m — a
    # steady reconcile loop over the Postgres clusters, no idle floor. 25m
    # covers p95 with 2x headroom. No CPU limit, per the cluster convention:
    # a failover should never wait on a throttled operator.
    resources:
      requests:
        memory: 100Mi
        cpu: 25m
        ephemeral-storage: 100Mi
      limits:
        memory: 500Mi
        ephemeral-storage: 200Mi
    # monitoring:
    #   grafanaDashboard:
    #     create: true
