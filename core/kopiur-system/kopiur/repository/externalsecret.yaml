---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager-sdk
  target:
    name: kopiur-repository-secret
    template:
      data:
        # Same Bitwarden item as every ${APP}-volsync-secret: this is the
        # password of the existing VolSync repository, not a new one.
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  refreshInterval: 15m
  dataFrom:
    - extract:
        key: volsync
