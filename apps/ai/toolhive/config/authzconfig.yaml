# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/toolhive.stacklok.dev/mcpauthzconfig_v1beta1.json
# Cedar deny-by-default: only explicitly permitted (group, tool) pairs are callable.
# Tool names are the VirtualMCPServer-prefixed forms: {backend-name}_{tool-name}.
# Run `tools/list` on the unified endpoint after each new backend is deployed to
# confirm exact names, then add or correct permits below.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPAuthzConfig
metadata:
  name: toolhive-authz
spec:
  type: cedarv1
  config:
    # Authentik includes group names in the "groups" claim via the default groups scope.
    # Ensure the ToolHive Authentik provider requests the "groups" scope and that the
    # groups property mapping is enabled. See OIDC.md for Authentik prerequisites.
    group_claim_name: "groups"
    policies:
      # -------------------------------------------------------------------------
      # toolhive-basic (Zug): SearXNG + memini-zug
      # memini tool names: from eleboucher/memini docs/reference/mcp-tools.md and
      # internal/api/mcp/mcp.go (9 mcpsdk.AddTool calls — HIGH confidence).
      # memory_answer is registered only when MEMINI_LLM_BASE_URL is set;
      # not set in this deployment, so the permit is dormant but harmless.
      # ToolHive prefix: MCPServerEntry name "memini-zug" → "memini-zug_" prefix.
      # Verify exact names with `tools/list` after deploy (see OIDC.md).
      # -------------------------------------------------------------------------
      - |
        permit(
          principal in THVGroup::"toolhive-basic",
          action == Action::"call_tool",
          resource is Tool
        ) when {
          resource == Tool::"searxng_web_search" ||
          resource == Tool::"memini-zug_memory_briefing" ||
          resource == Tool::"memini-zug_memory_recall" ||
          resource == Tool::"memini-zug_memory_remember" ||
          resource == Tool::"memini-zug_memory_answer" ||
          resource == Tool::"memini-zug_memory_list" ||
          resource == Tool::"memini-zug_memory_get" ||
          resource == Tool::"memini-zug_memory_history" ||
          resource == Tool::"memini-zug_memory_update" ||
          resource == Tool::"memini-zug_memory_forget"
        };

