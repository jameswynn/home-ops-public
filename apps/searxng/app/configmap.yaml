---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
data:
  settings.yml: |
    use_default_settings: true

    server:
      limiter: false
      image_proxy: true

    ui:
      static_use_hash: true
      default_locale: en
      query_in_title: true
      infinite_scroll: true

    search:
      autocomplete: duckduckgo
      formats:
        - html
        - json
  limiter.toml: |
    [real_ip]
    x_for = 1
    ipv4_prefix = 32
    ipv6_prefix = 48

    [botdetection.ip_limit]
    link_token = false
