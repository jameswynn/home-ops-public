---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich-database
  namespace: &namespace office
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  dependsOn:
    - name: cloudnative-pg
      namespace: default
  path: ./apps/office/immich/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace office
spec:
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  # dependsOn:
  #   - name: apps-immich-database
  path: ./apps/office/immich/app
  prune: true
  components:
    - ../../../../components/dragonfly
    - ../../../../components/nfs-scaler
    - ../../../../components/anubis
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: *namespace
      ANUBIS_TARGET: http://immich-server:2283
      NFS_SCALAR_TARGET: immich-server
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
