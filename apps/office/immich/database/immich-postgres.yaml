---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: office
spec:
  instances: 3
  # imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16.2-v0.2.1
  # imageName: ghcr.io/corentingiraud/cnpg-pgvector-vectorchord:16-migration
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-0.5.3
  primaryUpdateStrategy: unsupervised
  # Image bumps restart the primary last. `restart` (the default) recreates
  # the primary pod in place: ~2 min of no writable endpoint (default/postgres,
  # 2026-11-19). `switchover` promotes the most aligned replica first, so
  # clients see a ~2-5 s reconnect, and the old primary restarts as a replica.
  # Cost: the primary moves to whichever node hosts that replica; instances
  # here are node-pinned local-path, so write latency follows the node's disk.
  primaryUpdateMethod: switchover
  nodeMaintenanceWindow:
    inProgress: true
    reusePVC: true
  storage:
    size: 5Gi
    storageClass: local-path
  enableSuperuserAccess: true
  superuserSecret:
    name: immich-postgres-superuser
  resources:
    requests:
      cpu: 10m
      ephemeral-storage: 200Mi
    limits:
      ephemeral-storage: 200Mi
  postgresql:
    # enabling this to allow manually changing the primary_slot_name
    enableAlterSystem: true
    shared_preload_libraries:
      # - "vectors.so"
      - "vchord.so"
    parameters:
      max_connections: "600"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres
  # backup:
  #   retentionPolicy: 30d
  #   barmanObjectStore: &barmanObjectStore
  #     wal:
  #       compression: bzip2
  #       maxParallel: 8
  #     data:
  #       compression: bzip2
  #     destinationPath: s3://postgresql/
  #     endpointURL: https://${SECRET_MINIO_URL}:9443
  #     serverName: immich-postgres-v1
  #     s3Credentials:
  #       accessKeyId:
  #         name: immich-postgres-minio
  #         key: minio_access_key
  #       secretAccessKey:
  #         name: immich-postgres-minio
  #         key: minio_secret_key
  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  # bootstrap:
  #   initdb:
  #     database: immich
  #     owner: immich
  #     secret:
  #       name: immich-postgres
  #     postInitSQL:
  #       - CREATE EXTENSION cube
  #       - CREATE EXTENSION earthdistance
  #       - CREATE EXTENSION vectors
  #       - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/postgresql.cnpg.io/database_v1.json
#
# Owns the extension *versions* in the pre-existing `immich` database. The CNPG
# reconciler is idempotent against existing state: the database and the role
# already exist, so this never creates anything — it only runs
# `ALTER EXTENSION vchord UPDATE TO '<version>'` as superuser when `version`
# differs from pg_extension.extversion (presence alone, with no version, is a
# no-op on an installed extension).
#
# Why: Renovate bumps `imageName` above, which swaps vchord.so but leaves the
# extension object at the old version. Immich tries the ALTER itself on boot,
# but as the `immich` role, which does not own the extension -> "must be owner
# of extension vchord" -> microservices worker exits -> CrashLoopBackOff
# (2026-11-08 to 11-10, 285 restarts, 0.3.0 -> 0.5.3). Immich then reindexes
# clip_index/face_index itself after the update; nothing else is needed.
#
# The version below MUST match the image tag's extension half. Renovate keeps
# them together (`vectorchord` group in .renovate/groups.json5); if they ever
# drift, the image-ahead case is the crash above and the pin-ahead case is a
# harmless reconcile error in this object's status.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: office
spec:
  cluster:
    name: immich-postgres
  name: immich
  owner: immich
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
      # renovate: datasource=github-releases depName=tensorchord/VectorChord
      version: "0.5.3"

---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-immich
  namespace: office
spec:
  schedule: "@daily"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: immich-postgres
  # The cluster archives via the barman-cloud plugin and has no spec.backup
  # section. Without these, method defaults to barmanObjectStore and every
  # run fails with "cluster has no backup section".
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
