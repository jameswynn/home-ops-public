  # Public edge. heimdall, the off-cluster OVH VPS that terminates towonel and
  # fronts every public hostname. This is the A-record target for both the towonel
  # hostname and every route on the envoy-towonel gateway. Routes target the address
  # rather than CNAME-ing to the towonel hostname on purpose -- a public CNAME leaks
  # into internal resolution. See the envoy-towonel gateway annotation for why.
  SVC_TOWONEL_ADDR: "15.204.118.232"

  # Postgres
  SVC_POSTGRES_HOST: "postgres-rw.default.svc.cluster.local"
  SVC_POSTGRES_PORT: "5432"
