---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagebucket_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: sneaker-social
spec:
  clusterRef:
    name: garage-cluster
  quotas:
    maxSize: 1Gi
  website:
    enabled: true
  globalAlias: sneaker.social
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/garage.rajsingh.info/garagekey_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: sneaker-social
spec:
  clusterRef:
    name: garage-cluster
  bucketPermissions:
    - bucketRef:
        name: sneaker-social
      read: true
      write: true

---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-sneaker-social
spec:
  parentRefs:
    - name: envoy-towonel
      namespace: networking
      sectionName: sneaker-https
  hostnames:
    - "sneaker.social"
  rules:
    - backendRefs:
        - name: garage-cluster
          port: 3902
