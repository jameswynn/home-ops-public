      # -------------------------------------------------------------------------
      # toolhive-researcher (Sagan): SearXNG + Karakeep (read-only) + Joplin (read-only) + memini-sagan
      # Karakeep tool names come from MCPToolConfig renaming in karakeep.yaml plus
      # the VirtualMCPServer workload prefix "karakeep_". Only search/get/list tools
      # are permitted; create/add/attach/remove tools are intentionally excluded.
      # Joplin tool names from james/containers#12 joplin-mcp adapter source (HIGH
      # confidence). ToolHive prefix "joplin_" + adapter tool names → joplin_joplin_*.
      # llm-wiki: no backend deployed; add when isolated wiki MCP server is wired.
      # ToolHive prefix: MCPServerEntry name "memini-sagan" → "memini-sagan_".
      # -------------------------------------------------------------------------
      - |
        permit(
          principal in THVGroup::"toolhive-researcher",
          action == Action::"call_tool",
          resource is Tool
        ) when {
          resource == Tool::"searxng_web_search" ||
          resource == Tool::"karakeep_get_bookmark" ||
          resource == Tool::"karakeep_get_bookmark_content" ||
          resource == Tool::"karakeep_get_lists" ||
          resource == Tool::"karakeep_search_bookmarks" ||
          resource == Tool::"joplin_joplin_search_notes" ||
          resource == Tool::"joplin_joplin_read_note" ||
          resource == Tool::"joplin_joplin_list_notes" ||
          resource == Tool::"joplin_joplin_list_notebooks" ||
          resource == Tool::"joplin_joplin_list_tags" ||
          resource == Tool::"memini-sagan_memory_briefing" ||
          resource == Tool::"memini-sagan_memory_recall" ||
          resource == Tool::"memini-sagan_memory_remember" ||
          resource == Tool::"memini-sagan_memory_answer" ||
          resource == Tool::"memini-sagan_memory_list" ||
          resource == Tool::"memini-sagan_memory_get" ||
          resource == Tool::"memini-sagan_memory_history" ||
          resource == Tool::"memini-sagan_memory_update" ||
          resource == Tool::"memini-sagan_memory_forget"
        };
