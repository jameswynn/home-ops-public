---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trivy-operator-dashboard
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.9.0
  url: oci://ghcr.io/raoulx24/charts/trivy-operator-dashboard
---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trivy-operator-dashboard
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: trivy-operator-dashboard
  maxHistory: 2
  values:
    fullnameOverride: *app
    gitHub:
      serverCheckForUpdates: false
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    history:
      distributedCache:
        sidecar:
          pvc:
            storageClassName: longhorn

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 1Gi
